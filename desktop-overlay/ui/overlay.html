<!-- Overlay markup. -->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Gomoku Overlay</title>
<style>
  /* 覆盖层必须完全透明：C++ 侧已把 WebView2 默认背景设为透明，
     这里 body/html 不能再给任何背景色，否则整屏糊一层底色。 */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .lbl { font: 600 13px "Segoe UI", "Microsoft YaHei", sans-serif; paint-order: stroke;
         stroke: rgba(0,0,0,.55); stroke-width: 3px; fill: #fff; text-anchor: middle; dominant-baseline: central; }
</style>
</head>
<body>
<svg id="ov" xmlns="http://www.w3.org/2000/svg">
  <g id="gScreen"></g>
  <g id="gBoard"></g>
  <g id="gMarks"></g>
</svg>
<script>
/* ============================================================================
 * 全屏覆盖层
 *   · 屏幕四角：荧光天蓝 L 型（#00E5FF），四角 L 的腿之间用天蓝实线连接
 *   · 棋盘：偏紫的亮蓝紫 L 型（#A855F7），L 的腿之间用**天蓝实线**连接（2026-10-04 定稿）
 *   · 全部按屏幕尺寸动态计算，不写死像素 → 2K/3K/4K、16:9/4:3 自适应
 * ========================================================================== */
'use strict';

var SVGNS = 'http://www.w3.org/2000/svg';
var COL_SCREEN = '#00E5FF';   // 荧光天蓝
var COL_BOARD  = '#A855F7';   // 偏紫的亮蓝紫

var gScreen = document.getElementById('gScreen');
var gBoard  = document.getElementById('gBoard');
var gMarks  = document.getElementById('gMarks');
var svg     = document.getElementById('ov');

function mk(tag, attrs) {
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function clear(g) { while (g.firstChild) g.removeChild(g.firstChild); }

/* L 型：以 (x,y) 为拐角，dirX/dirY 指示两条腿伸向的方向 */
function cornerL(g, x, y, dirX, dirY, len, color, w) {
  g.appendChild(mk('path', {
    d: 'M ' + (x + dirX * len) + ' ' + y + ' L ' + x + ' ' + y + ' L ' + x + ' ' + (y + dirY * len),
    fill: 'none', stroke: color, 'stroke-width': w,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round'
  }));
}

/* 2026-10-04（用户：「紫色的 L 型角框的连接处由原来的虚线，变成天蓝色的实线」）：
   角框腿尖之间的连接线全部改**天蓝实线**（原为细虚线），与宿主 C++ DrawLBracket 一致。 */
function dashed(g, x1, y1, x2, y2, color) {
  g.appendChild(mk('line', {
    x1: x1, y1: y1, x2: x2, y2: y2,
    stroke: color, 'stroke-width': 1.4, opacity: 0.85
  }));
}

var lastState = null;

function render(st) {
  if (!st) return;
  var W = st.sw || window.innerWidth, H = st.sh || window.innerHeight;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

  /* ---- 屏幕四角 ---- */
  clear(gScreen);
  var L = Math.max(24, Math.min(W, H) * 0.045);      // 腿长随屏幕自适应
  var w = Math.max(5, Math.min(W, H) / 210);         // 2026-10-04 用户：识别框天蓝线粗一倍
  var m = 2;                                          // 贴边留白
  var cs = [
    [m, m, 1, 1], [W - m, m, -1, 1], [W - m, H - m, -1, -1], [m, H - m, 1, -1]
  ];
  cs.forEach(function (c) { cornerL(gScreen, c[0], c[1], c[2], c[3], L, COL_SCREEN, w); });
  // 腿尖相连：上边 / 右边 / 下边 / 左边
  dashed(gScreen, m + L, m, W - m - L, m);
  dashed(gScreen, W - m, m + L, W - m, H - m - L);
  dashed(gScreen, m + L, H - m, W - m - L, H - m);
  dashed(gScreen, m, m + L, m, H - m - L);

  /* ---- 棋盘框 ---- */
  clear(gBoard);
  var b = st.board;
  if (b && b.found) {
    var x0 = b.x0, y0 = b.y0, x1 = b.x1, y1 = b.y1;
    var bl = Math.max(14, Math.min(x1 - x0, y1 - y0) * 0.18);
    var bw = Math.max(1.5, Math.min(x1 - x0, y1 - y0) / 120);   // 2026-10-04 用户：紫框粗细 ×0.75
    cornerL(gBoard, x0, y0, 1, 1, bl, COL_BOARD, bw);
    cornerL(gBoard, x1, y0, -1, 1, bl, COL_BOARD, bw);
    cornerL(gBoard, x1, y1, -1, -1, bl, COL_BOARD, bw);
    cornerL(gBoard, x0, y1, 1, -1, bl, COL_BOARD, bw);
    dashed(gBoard, x0 + bl, y0, x1 - bl, y0, COL_SCREEN);
    dashed(gBoard, x1, y0 + bl, x1, y1 - bl, COL_SCREEN);
    dashed(gBoard, x0 + bl, y1, x1 - bl, y1, COL_SCREEN);
    dashed(gBoard, x0, y0 + bl, x0, y1 - bl, COL_SCREEN);
  }

  /* ---- 落点标记 ---- */
  clear(gMarks);
  (st.marks || []).forEach(function (mk2) {
    var r = Math.max(6, (st.cell || 30) * 0.42);
    var col = mk2.rank === 0 ? '#00E5FF' : (mk2.rank === 1 ? '#43a047' : '#ff7f9f');
    gMarks.appendChild(mk('circle', {
      cx: mk2.sx, cy: mk2.sy, r: r, fill: 'none', stroke: col,
      'stroke-width': 2.5, opacity: 0.95
    }));
    if (mk2.rank === 0) {
      gMarks.appendChild(mk('circle', { cx: mk2.sx, cy: mk2.sy, r: r * 0.42, fill: col, opacity: 0.85 }));
    }
    if (mk2.label) {
      var t = mk('text', { x: mk2.sx, y: mk2.sy - r - 8, class: 'lbl' });
      t.textContent = mk2.label;
      gMarks.appendChild(t);
    }
  });
}

var host = (window.chrome && window.chrome.webview) ? window.chrome.webview : null;
if (host) {
  host.addEventListener('message', function (e) { lastState = e.data; render(e.data); });
} else {
  // 无宿主时的可视化自检：随机画一个框，便于单独打开 html 看样式
  render({ sw: window.innerWidth, sh: window.innerHeight,
           board: { found: true, x0: 400, y0: 200, x1: 900, y1: 700 },
           marks: [{ sx: 650, sy: 450, rank: 0, label: 'H8' }], cell: 33 });
}
window.addEventListener('resize', function () { if (lastState) render(lastState); });
</script>
</body>
</html>
