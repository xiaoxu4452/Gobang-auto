<!-- Panel markup. -->

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>五子棋桌面助手</title>
<style>
  html,body{margin:0;padding:0;width:100%;background:transparent;overflow:hidden;
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;}
  /* 桌面版：面板是可拖动的浮动卡片，底下的网页/应用要能点到 → 空白处点击穿透 */
  #__gb_panel_wrap{position:fixed;inset:0;pointer-events:none;}
  #__gb_panel{pointer-events:auto;}
  /* 面板在桌面版允许拖动（真正的拖动由宿主按标题栏区域接管） */
  #__gb_hdr{cursor:move!important;}
  #__gb_hdr{flex:0 0 auto;}#__gb_adrow{padding:1px 12px 1px!important;}#__gb_swaprow{padding:1px 12px 4px!important;}#__gb_bottombar>div:first-child{padding:5px 12px 4px!important;}#__gb_footbar{padding:0 12px 6px!important;}#__gb_panel{height:100%;}#__gb_body{overflow-y:auto;overflow-x:hidden;flex:1 1 auto;min-height:0;}
  #__gb_panel ::-webkit-scrollbar{height:5px;width:5px}#__gb_panel ::-webkit-scrollbar-thumb{background:#b8bdc6;border-radius:3px}#__gb_panel ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<canvas id="__gb_frame" style="position:fixed;left:0;top:0;z-index:1;pointer-events:none;"></canvas>
<div id="__gb_panel_wrap">
  
  <div id="__gb_panel" style="position:fixed;z-index:2147483647;width:225px;font-family:&quot;Segoe UI&quot;,&quot;Microsoft YaHei&quot;,sans-serif;background:#fff;border:1px solid #e0e3e8;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);font-size:12px;color:#1d1d1f;overflow:hidden;top:0;left:0;right:auto;bottom:auto;box-sizing:border-box;display:flex;flex-direction:column;width:100%;border-radius:0;"><div id="__gb_hdr" style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#3b7dd8;color:#fff;cursor:move;user-select:none;"><span style="flex:1;font-weight:600;" data-i18n="title">五子棋助手</span><button id="__gb_lang" title="Language" style="background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:11px;cursor:pointer;padding:1px 8px;border-radius:4px;">EN</button><button id="__gb_min" style="background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;padding:0 4px;">–</button><button id="__gb_close" style="background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;padding:0 4px;">×</button></div><div id="__gb_body"><div style="font-size:11px;color:#9aa3ad;padding:4px 12px 0;" data-i18n="think">思考时间</div><div class="__gb_row" style="display:flex;align-items:center;padding:3px 12px;border-bottom:1px solid #f0f0f0;background:#fafbfc;"><span class="__gb_lbl" style="flex:1;color:#555;" data-i18n="turn">步时(秒)</span><button class="__gb_step" data-dir="turn-" style="width:26px;height:26px;border-radius:50%;border:1.5px solid #43a047;color:#43a047;background:#fff;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;">−</button><input id="__gb_turnval" type="number" min="1" max="120" step="1" value="5" style="width:52px;text-align:center;color:#333;border:1px solid #ccc;border-radius:5px;padding:2px 2px;font-size:12px;margin:0 2px;"><button class="__gb_step" data-dir="turn+" style="width:26px;height:26px;border-radius:50%;border:1.5px solid #43a047;color:#43a047;background:#fff;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;">+</button></div><div class="__gb_row" style="display:flex;align-items:center;padding:3px 12px;border-bottom:1px solid #f0f0f0;background:#fafbfc;"><span class="__gb_lbl" style="flex:1;color:#555;" data-i18n="match">局时(秒)</span><button class="__gb_step" data-dir="match-" style="width:26px;height:26px;border-radius:50%;border:1.5px solid #43a047;color:#43a047;background:#fff;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;">−</button><input id="__gb_matchval" type="number" min="30" max="9999" step="10" value="6000" style="width:52px;text-align:center;color:#333;border:1px solid #ccc;border-radius:5px;padding:2px 2px;font-size:12px;margin:0 2px;"><button class="__gb_step" data-dir="match+" style="width:26px;height:26px;border-radius:50%;border:1.5px solid #43a047;color:#43a047;background:#fff;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;">+</button></div><div class="__gb_row" style="display:flex;align-items:center;padding:3px 12px;border-bottom:1px solid #f0f0f0;background:#fafbfc;"><span class="__gb_lbl" style="flex:1;color:#555;" data-i18n="hash">哈希表</span><button class="__gb_step" data-dir="hash-" style="width:26px;height:26px;border-radius:50%;border:1.5px solid #43a047;color:#43a047;background:#fff;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;">−</button><span id="__gb_hashval" style="min-width:48px;text-align:center;color:#333;font-size:12px;">自动</span><button class="__gb_step" data-dir="hash+" style="width:26px;height:26px;border-radius:50%;border:1.5px solid #43a047;color:#43a047;background:#fff;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;">+</button></div><style>#__gb_adrow{display:flex;gap:6px;padding:2px 12px 0;pointer-events:auto;}#__gb_swaprow{display:flex;gap:6px;padding:2px 12px 8px;pointer-events:auto;}#__gb_autodrop,#__gb_adcount,#__gb_swbal,#__gb_sweval{padding:3px 0;border-radius:6px;cursor:pointer;box-sizing:border-box;}#__gb_autodrop{flex:1;background:#fff!important;color:#1e7e34!important;border:1px solid #9ccc9c!important}#__gb_autodrop:hover{background:#f0faf0!important;filter:none}#__gb_autodrop[data-ad-on="1"]{background:#28a745!important;color:#fff!important;border-color:#28a745!important}#__gb_adcount{flex:0 0 46px;background:#fff!important;color:#4a6fa5!important;border:1px solid #a8bfd8!important;font-variant-numeric:tabular-nums}#__gb_adcount:hover{background:#f2f7fc!important;filter:none}#__gb_swbal{flex:1;background:#fff!important;color:#0e7490!important;border:1px solid #67c3d8!important}#__gb_swbal:hover{background:#f0fafc!important;filter:none}#__gb_sweval{flex:1;background:#fff!important;color:#b45309!important;border:1px solid #e8a96f!important}#__gb_sweval:hover{background:#fdf6ec!important;filter:none}[data-dark="1"] #__gb_autodrop{background:#173322!important;color:#8fe0a5!important;border-color:#2f6b45!important}[data-dark="1"] #__gb_autodrop[data-ad-on="1"]{background:#28a745!important;color:#fff!important;border-color:#28a745!important}[data-dark="1"] #__gb_autodrop:hover{background:#1d4230!important}[data-dark="1"] #__gb_adcount{background:#1d2430!important;color:#9db8d8!important;border-color:#3a4a60!important}[data-dark="1"] #__gb_adcount:hover{background:#26303f!important}[data-dark="1"] #__gb_swbal{background:#122a33!important;color:#8fd4e8!important;border-color:#2f6b7f!important}[data-dark="1"] #__gb_swbal:hover{background:#183743!important}[data-dark="1"] #__gb_sweval{background:#2a1f10!important;color:#f0b26e!important;border-color:#6b4a26!important}[data-dark="1"] #__gb_sweval:hover{background:#382818!important}#__gb_swbal[data-dis="1"],#__gb_autodrop[data-dis="1"]{opacity:.45!important;cursor:not-allowed!important;filter:grayscale(.6)!important}[data-dark="1"] #__gb_swbal[data-dis="1"],[data-dark="1"] #__gb_autodrop[data-dis="1"]{opacity:.4!important;filter:grayscale(.6)!important}</style><div id="__gb_adrow"><button id="__gb_autodrop" title="自动落子：盯住推荐第一点，盘面刷新后自动点击落子（双管线送点击，物理鼠标不动）" style="flex:1;cursor:pointer;">自动落子</button><button id="__gb_adcount" title="落子次数：每个落点连点几下（1~3 循环），点一下切换，所有状态同步" style="flex:0 0 46px;cursor:pointer;">×1</button></div><div id="__gb_swaprow"><button id="__gb_swbal" title="交换平衡点：空盘摆出 1 白 + 2 黑三个平衡点（浅蓝=白、浅紫=黑）；已有棋子给一对（1 白 + 1 黑）。配合自动落子可自动摆完" style="flex:1;cursor:pointer;">交换平衡点</button><button id="__gb_sweval" title="交换评估：按引擎对当前局面的评估，在状态栏提醒选黑还是选白交换更有优势（点击一次评估一次）" style="flex:1;cursor:pointer;">交换评估</button></div><div class="__gb_lbl2" style="font-size:11px;color:#9aa3ad;padding:4px 12px 0;" data-i18n="rule">规则</div><div class="__gb_opt" data-rule="0" style="display:flex;align-items:center;padding:4px 12px;border-bottom:1px solid #f0f0f0;cursor:pointer;text-align:left;"><span data-i18n="rule0" style="flex:1;text-align:left;">无禁手</span><span class="__gb_chk" style="color:#43a047;font-size:14px;visibility:hidden;">✓</span></div><div class="__gb_opt" data-rule="1" style="display:flex;align-items:center;padding:4px 12px;border-bottom:1px solid #f0f0f0;cursor:pointer;text-align:left;"><span data-i18n="rule1" style="flex:1;text-align:left;">无禁手长连不赢</span><span class="__gb_chk" style="color:#43a047;font-size:14px;visibility:hidden;">✓</span></div><div class="__gb_opt" data-rule="2" style="display:flex;align-items:center;padding:4px 12px;border-bottom:1px solid #f0f0f0;cursor:pointer;text-align:left;"><span data-i18n="rule2" style="flex:1;text-align:left;">有禁手</span><span class="__gb_chk" style="color:#43a047;font-size:14px;visibility:hidden;">✓</span></div><div style="display:flex;align-items:center;gap:6px;padding:4px 12px;flex-wrap:wrap;row-gap:3px;"><span class="__gb_lbl" style="color:#555;flex:none;" data-i18n="iplay">我执</span><button id="__gb_side_black" title="我执黑子" style="padding:3px 10px;border:1px solid #666;border-radius:5px;background:#fff;color:#333;cursor:pointer;font-size:12px;font-weight:600;line-height:1.3;">黑子</button><button id="__gb_side_white" title="我执白子" style="padding:3px 10px;border:1px solid #666;border-radius:5px;background:#fff;color:#333;cursor:pointer;font-size:12px;font-weight:600;line-height:1.3;">白子</button><span id="__gb_side_txt" style="font-size:10px;color:#888;white-space:nowrap;letter-spacing:.2px;"></span></div><div style="display:flex;align-items:center;padding:0 12px 4px;position:relative;"><button id="__gb_adjust" style="padding:2px 8px;border:1px solid #e67e22;border-radius:5px;background:#fff;color:#e67e22;cursor:pointer;font-size:11px;">手动调节</button><button id="__gb_opacity" data-i18n="opacity" style="position:absolute;left:50%;transform:translateX(-50%);padding:2px 8px;border:1px solid #7a90b8;border-radius:5px;background:#fff;color:#4a6a9a;cursor:pointer;font-size:11px;">透明度</button><button id="__gb_dark" style="margin-left:auto;padding:2px 8px;border:1px solid #555;border-radius:5px;background:#fff;color:#555;cursor:pointer;font-size:11px;">深色模式</button></div><div id="__gb_opacity_pop" style="display:none;flex-direction:column;gap:5px;padding:5px 12px 6px;font-size:11px;color:#666;border-bottom:1px solid #f0f0f0;"><div style="display:flex;align-items:center;gap:6px;"><span data-i18n="opacity" style="flex:none;width:34px;">透明度</span><input id="__gb_opacity_range" type="range" min="25" max="100" step="1" style="flex:1;min-width:0;"><input id="__gb_opacity_num" type="number" min="25" max="100" step="1" style="width:40px;text-align:center;color:#333;border:1px solid #ccc;border-radius:5px;padding:1px 0;font-size:11px;"><span style="color:#888;">%</span></div></div><style>#__gb_opacity_range{-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:#cbd2dc;outline:none;cursor:pointer;}#__gb_opacity_range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#3b7dd8;border:none;cursor:pointer;}#__gb_opacity_range::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#3b7dd8;border:none;cursor:pointer;}#__gb_panel input[type=number]::-webkit-inner-spin-button,#__gb_panel input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}#__gb_panel input[type=number]{-moz-appearance:textfield;}</style><div style="display:flex;align-items:center;gap:6px;padding:0 12px 6px;"><button id="__gb_heat" data-i18n="heat" style="padding:2px 8px;border:1px solid #3b7dd8;border-radius:5px;background:#fff;color:#3b7dd8;cursor:pointer;font-size:11px;">热力图</button><div id="__gb_legend" style="margin-left:auto;display:flex;align-items:center;gap:4px;padding:0 0 0 4px;font-size:9px;color:#888;user-select:none;white-space:nowrap;"><span style="display:inline-flex;align-items:center;gap:3px;"><i title="最佳" style="width:9px;height:9px;border-radius:50%;background:#00bfa5;display:inline-block;flex:none;"></i><span data-i18n="heatBest">最佳</span></span><span style="display:inline-flex;align-items:center;gap:3px;"><i title="较优" style="width:9px;height:9px;border-radius:50%;background:#43a047;display:inline-block;flex:none;"></i><span data-i18n="heatGood">较优</span></span><span style="display:inline-flex;align-items:center;gap:3px;"><i title="一般" style="width:9px;height:9px;border-radius:50%;background:#ff7f9f;display:inline-block;flex:none;"></i><span data-i18n="heatMid">一般</span></span><span style="display:inline-flex;align-items:center;gap:3px;"><i title="较弱" style="width:9px;height:9px;border-radius:50%;background:#ffb3c1;display:inline-block;flex:none;"></i><span data-i18n="heatLow">较弱</span></span></div></div><div id="__gb_status" style="font-size:11px;color:#666;line-height:1.45;border-top:1px solid #f0f0f0;padding:4px 12px 2px;min-height:48px;" data-i18n="connecting">连接引擎…</div><div id="__gb_stats" style="padding:6px 12px 2px;"><table style="width:100%;border-collapse:collapse;text-align:center;font-size:11px;"><tr style="color:#9aa3ad;font-size:10px;padding-bottom:2px;"><td data-i18n="colDepth">深度</td><td data-i18n="colEval">评估</td><td data-i18n="colSpeed">速度</td><td data-i18n="colNodes">节点</td></tr><tr style="font-weight:600;color:#1d1d1f;font-size:12px;padding-top:2px;"><td id="__gb_st_depth">-</td><td id="__gb_st_eval">-</td><td id="__gb_st_speed">-</td><td id="__gb_st_nodes">-</td></tr></table><div id="__gb_st_line" style="color:#666;margin-top:5px;margin-bottom:3px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div></div><div id="__gb_chart_wrap" style="display:flex;align-items:stretch;background:#fafbfc;border-top:1px solid #f0f0f0;"><div id="__gb_yaxis" style="flex:none;width:26px;height:100px;position:relative;box-sizing:border-box;"></div><div id="__gb_chart_scroll" style="flex:1 1 auto;overflow-x:auto;overflow-y:hidden;min-width:0;"><canvas id="__gb_chart" height="100" style="display:block;"></canvas></div></div><div id="__gb_bottombar" style="position:sticky;bottom:0;z-index:9;pointer-events:auto;display:flex;flex-direction:column;"><div style="display:flex;gap:6px;padding:8px 12px 12px;"><button id="__gb_rec" style="flex:1;padding:5px 0;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;" data-i18n="reidentify">重新识别</button><button id="__gb_analyze" style="flex:1;padding:5px 0;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;" data-i18n="analyze">分析</button></div><style>#__gb_footbar{display:flex;gap:6px;padding:0 12px 10px;}#__gb_footbar>button{flex:1;padding:5px 0;border-radius:6px;cursor:pointer;box-sizing:border-box;font-size:11px;}#__gb_pos{background:#2e7d32!important;color:#fff!important;border:1px solid #2e7d32!important;font-weight:600;}#__gb_pos[data-on="1"]{background:#1b5e20!important;border-color:#123f16!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)!important}#__gb_pos:hover{filter:brightness(1.08)}[data-dark="1"] #__gb_pos{background:#1e3a26!important;color:#9bd6a2!important;border-color:#3f7a4a!important}[data-dark="1"] #__gb_pos[data-on="1"]{background:#2c6b3a!important;color:#eafbe9!important;border-color:#5aa869!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)!important}[data-dark="1"] #__gb_pos:hover{filter:brightness(1.12)}#__gb_possave{background:#fff!important;color:#2e7d32!important;border:1px solid #7cb98a!important}#__gb_possave:hover{background:#f2f9f3!important;filter:none}[data-dark="1"] #__gb_possave{background:#232a3a!important;color:#9bd6a2!important;border-color:#3f7a4a!important}[data-dark="1"] #__gb_possave:hover{background:#2b3346!important}</style><div id="__gb_footbar"><button id="__gb_pos" data-i18n="posBtn" title="打开局面窗口（识别出来的棋盘 + 局面代码）" style="flex:1;cursor:pointer;">局面</button><button id="__gb_possave" data-i18n="posSave" title="保存局面（把识别到的棋盘渲染成 PNG 图片）" style="flex:1;cursor:pointer;">保存局面</button></div></div></div></div>
  
</div>
<script src="panel-ui.js"></script>
<script src="bridge.js"></script>
</body>
</html>
