# ============================================================================
# KataGo-五子棋（KataGomo）GTP 配置 —— 随 App 分发的运行时配置
# ============================================================================
# 键名全部对照上游源码逐条核对过：
#   cpp/program/gtpconfig.cpp  —— 官方生成 gtp.cfg 的模板（哪些键是必填的）
#   cpp/program/setup.cpp      —— reportAnalysisWinratesAs / 搜索上限的解析
#   cpp/command/gtp.cpp        —— 日志、认输、ponder 等键的读取
# 不要凭记忆增删键名：KataGo 对拼错的键只会打印 warning 然后**静默用默认值**，
# 一旦拼错就会变成「看起来能跑但行为不对」，极难排查。
# 改完这份配置后，跑 `python tools/lint_kata_cfg.py` 复检一遍，它会启动引擎把
# 所有「Unused key」列出来（键名写错、或上游本分支没有的键都会被点名）。
#
# 本文件是**唯一**的运行时配置来源（Android 侧不再由 Java 生成第二份）。
# 随设备的差异（线程数、NN 缓存大小、batch）由 EngineHost 用
# `-override-config key=value,...` 在命令行覆盖，不在这里写死。
# ============================================================================

# ---------------------------------------------------------------- 日志
# 手机上没有人会去看引擎日志，全部关掉，只保留一个空目录避免上游报错。
# logDir 相对于进程工作目录（EngineHost 把 cwd 设成 <filesDir>/kata）。
logDir = gtp_logs
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = false

# ---------------------------------------------------------------- 视角（关键）
# =BLACK ⇒ 引擎 kata-analyze 输出的 winrate 是【黑方胜率】（0~1 浮点）。
# 前端 app/web/index.html 的 KATA_WR_AS = 'black' 与此对应，两边必须一致。
#
# 实测指纹（tools/probe_kata_perspective.py，镜像对「谁必胜已知、行棋方相反」）：
#   局面 A：黑活四 D8–G8·轮到白走（黑必胜）→ 1.0000
#   局面 B：白活四 D8–G8·轮到黑走（白必胜）→ 0.0000
# b10r 与 b10f 两份权重指纹一致 ⇒ 只有「黑方胜率」能同时解释这两个值。
# 另经受控 A/B（tools/probe_kata_cmd_ab.py）确认 kata-analyze 与
# kata-genmove_analyze 的视角相同，换命令不影响。
#
# ⚠ 历史，别被旧结论带回去：这里曾经写着「=BLACK 输出的是白方胜率，
#   前端 KATA_WR_AS = 'white' 与此对应」。那个结论来自 tools/verify_engine.py 的
#   视角实验，而那次实验的 play 命令**缺颜色参数、被引擎全部拒绝**，
#   实际测的是**空盘**（2026-09-23 查实并已修复）。
#   照旧结论去改 KATA_WR_AS 会把胜率整体改反 —— 那正是 v1.0.11 那次线上事故。
#
# 键名解析见 setup.cpp 的 parseReportAnalysisWinrates，认 b/black/w/white/sidetomove。
reportAnalysisWinratesAs = BLACK

# ---------------------------------------------------------------- 规则
# 注意键名是 basicRule（camelCase），不是 rules；值大小写不敏感。
# 默认连珠（有禁手）。前端启动后会用 `kata-set-rule basicrule freestyle|renju` 覆盖。
basicRule = RENJU

# ---------------------------------------------------------------- 对局行为
# 这是「分析器」不是「对局器」：认输后引擎会回一行 "resign"，
# 而前端把引擎返回的着法当作一次真实走子处理，会造成盘面错乱。直接关掉。
allowResignation = false
resignThreshold = -0.90
resignConsecTurns = 3

# 不做后台思考。手机上一次只跑一个引擎，ponder 只会跟自己的搜索抢 CPU。
ponderingEnabled = false

# 分析器要的是「同一局面给同一个答案」，不要随机性。
# 上游默认 chosenMoveTemperature = 0.1，会让 kata-genmove_analyze 返回的着法抖动，
# 表现为同一局面反复分析、最佳点却在两个点之间跳。钉成 0。
chosenMoveTemperature = 0.0
chosenMoveTemperatureEarly = 0.0

# ---------------------------------------------------------------- 搜索上限
# 三个上限（maxVisits / maxPlayouts / maxTime）一个都不指定时，gtp.cpp 会自作主张
# 塞一套「1 秒主时 + 5×5 秒读秒」的快棋时间控制。这里给一个实际等于无限的上限，
# 把节奏完全交给前端每次搜索前发的 `time_settings`（前端用它实现「持续分析」）。
maxVisits = 100000000

# 手机上没有网络对局，读秒延迟缓冲从默认 1.0 秒压到 0.1 秒，
# 否则前端设的 0.5 秒预算会被这 1 秒缓冲直接吃掉。
lagBuffer = 0.1

# 别在接近赢棋时故意下快 —— 那是给人看的对局优化，对分析是负作用。
searchFactorWhenWinning = 1.0
searchFactorWhenWinningThreshold = 1.0
#
# 注：上游 Go 版还有 searchFactorAfterOnePass / searchFactorAfterTwoPass 两个键，
# 但**本五子棋分支没有**（五子棋没有 pass，这两个键被删了）。实测配置里写它们会被
# 静默忽略并打 warning（用 tools/lint_kata_cfg.py 验的）。已删除，别再加回来。

# ---------------------------------------------------------------- 资源
# 本文件是**唯一**的配置来源：Android 侧直接用这份资产（EngineHost.prepare 解包、
# 启动时 -config 指过去），不再由 Java 另生成一份 —— 之前两处各写一份，
# 结果常常是「测过的配置和进 APK 的配置不是同一份」。
# 下面三项跟机型强相关，由 EngineHost 用 -override-config 在命令行覆盖，这里只是兜底：
#   numSearchThreads        —— 按 CPU 核数
#   nnCacheSizePowerOfTwo   —— 恒 2^18（2026-09-25 起统一最高，不再按内存分档）
#   nnMaxBatchSize          —— 按核数，约 cores*4
numSearchThreads = 4
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 12
