     * 的 04/18 为 -0.47/-0.52）；合成真歪盘 1°~4° 全部 +0.046~+0.104；正图 -0.3。
     * 0.03 居中分离：真歪盘全放行，正图/真图全守住。 */
    if (lineEvAt(bestDeg) < lineEvAt(0) + 0.03) return img;
  }
  return scanRotate(img, bestDeg, p50);
}
/* 双假设投影：木纹盘网格线比底**暗**，深色皮肤线比底**亮** —— 两种都试，
 * 各自对行/列做「暗(亮)像素计数」直方图，谁找到的网格更规整就信谁。 */
function scanProject(gray, w, h, mode, bg, contrast) {
  const thr = Math.max(16, contrast * 0.18);
  const col = new Float32Array(w), row = new Float32Array(h);
  if (mode === 'dark') {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (gray[y * w + x] < bg - thr) { col[x]++; row[y]++; }
    }
  } else {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (gray[y * w + x] > bg + thr) { col[x]++; row[y]++; }
    }
  }
  return { col, row };
}
/* 从一维投影里找等距网格：自相关估周期 → 提峰（滤掉黑子宽峰）→ 最小二乘拟合
 * → 枚举「连续 15 条线」窗口取峰支持度最高者。对裁边/无框/坐标文字噪声鲁棒。
 * 返回 {lines:[15个像素坐标], period, rms, inliers} 或 null。
 * wide=true 用放宽周期范围 [n/40, n/13]（网格 14 格跨度可占图 35%）——
 * 老板：框选框的是整个棋盘（边界有宽度），网格占比会掉到 50% 以下。
 * 调用方先试窄范围（历史行为，零回归），null 才重试宽范围：宽范围短滞后
 * 自相关系统性偏高，正图基准实测会被带偏（探针 probe_padded 实证）。 */
/* 等距/渐变两版找网格的**共用前置**（v1.0.28 从 scanFindGrid 原样搬出）：
 * mx 门槛 → 去基线 → 平滑 → 自相关初估 P0（含谐波校正）→ 提峰 → 同线双峰合并。
 * 返回 null = 无网格证据（调用方直接 null）。dbg 出口语义与原 scanFindGrid 相同。 */
function scanGridPre(prof, wide, dbg, minPeaks, relThr0) {
  const n = prof.length;
  /* 线必须真的「存在」：投影最大值 ≥ 0.2·图长（线贯穿画面的物理证据）。
   * bright 模式在亮线不存在的图（木盘）上，投影全是噪声尖刺（幅值 ~10），
   * 没有「谷周期」可拟合的峰 —— 没这道门槛时谷间噪声尖刺能凑出
   * 15 inliers 的伪解（13 路空盘实测 per 35.66 / rms 9.85 → 被报「倾斜」）。
   * 真线即便被白子/边框吃掉一截也远高于 0.2。 */
  let mx = 0;
  for (let i = 0; i < n; i++) if (prof[i] > mx) mx = prof[i];
  if (mx < n * 0.2) return null;
  let mean = 0;
  for (let i = 0; i < n; i++) mean += prof[i];
  mean /= n;
  const d = new Float32Array(n);
  for (let i = 0; i < n; i++) d[i] = prof[i] - mean;
  /* 光照渐变去基线（v1.0.26 矩阵探针发现）：手机拍的图亮度缓变，「暗像素
   * 计数」投影里渐变的暗背景整片滑进来 —— 恰好卡在暗阈值边界的亮度会让
   * 基线锯齿化（噪声决定每行计不计入），提峰出一串假峰，拟合 rms 被带炸
   * （light=0.5 实测 rmsY 6.5 > 守门 4.0 而拒识）。
   * 基线用 **31px 滑动最小值**（腐蚀）而非均值 —— 均值会在宽包（棋盘外框
   * 粗线）中心挖出凹陷、把单峰劈成双伪峰（真机图实测 x=13 峰 662 被劈成
   * 7/14 两个 190 的伪峰，峰集全变、锚点判据失效）；min 基线是谷水平，
   * 峰形完整保留，渐变平台照旧归零（残留 < 提峰的 0.15·max 门槛）。 */
  {
    const HW = 30;                             // 滑窗 31px
    const raw = new Float32Array(d);
    const dq = new Int32Array(n);              // 单调队列（存下标，raw 值递增）
    let head = 0, tail = 0;
    for (let i = 0; i < n; i++) {
      while (tail > head && raw[dq[tail - 1]] >= raw[i]) tail--;
      dq[tail++] = i;
      if (dq[head] <= i - HW) head++;          // 弹出滑窗左界之外的下标
      d[i] = raw[i] - raw[dq[head]];
    }
  }
  const sm = new Float32Array(n);            // 3px 平滑
  for (let i = 0; i < n; i++) {
    const a = d[Math.max(0, i - 1)], b = d[i], c = d[Math.min(n - 1, i + 1)];
    sm[i] = (a + b + c) / 3;
  }
  /* 自相关初估周期。窄范围 [n/28, n/13] = 网格 14 格跨度占图 50%~95%（历史行为）；
   * wide 再放宽下限到 [n/40,…] = 占 35%（框住整个带边框棋盘的图）；
   * ultra 第三档 [n/80,…] = 占 16%（v1.0.31 29 号实测：App 截图棋盘只占 44% 宽，
   * 全图/去边 10% 框时周期 ~14px 落在宽段下限之外 → 全档拒识「未检测到网格」，
   * 用户框松一点就识别不了。仅 scanFindGrid2 全灭后才试 ultra，正常图零影响）。 */
  const kLo = Math.max(2, Math.floor(n / (wide === 'ultra' ? 80 : wide ? 40 : 28))), kHi = Math.min(n - 2, Math.ceil(n / 13));
  if (kHi <= kLo) return null;
  let k0 = -1, bestA = -Infinity;
  for (let k = kLo; k <= kHi; k++) {
    let A = 0;
    for (let x = 0; x + k < n; x++) A += sm[x] * sm[x + k];
    A /= (n - k);
    if (A > bestA) { bestA = A; k0 = k; }
  }
  if (k0 < 0 || bestA <= 0) return null;
  /* 周期显著性守门：真网格的投影是强周期信号，整周期处的自相关 ≈ 投影方差
   * 本身（实测木盘 ≈1.0 / 深皮 ≈0.5）；纯噪声图的自相关只是涨落（≈0.0x），
   * 却能在提峰/拟合里碰巧凑出「合法网格」一路走到 ok —— 显著性 < 0.25 一律
   * 判无网格。这比在 classify 之后数棋子更根本：拍错图（无周期纹理）在这里就死。 */
  let vr = 0;
  for (let i = 0; i < n; i++) vr += sm[i] * sm[i];
  vr /= n;
  if (bestA < 0.25 * vr) return null;
  // 抛物线插值细化
  const A = k => {
    let s = 0;
    for (let x = 0; x + k < n; x++) s += sm[x] * sm[x + k];
    return s / (n - k);
  };
  let P = k0;
  if (k0 > kLo && k0 < kHi) {
    const a1 = A(k0 - 1), a2 = A(k0), a3 = A(k0 + 1);
    const den = a1 - 2 * a2 + a3;
    if (den !== 0) P = k0 + Math.max(-0.5, Math.min(0.5, 0.5 * (a1 - a3) / den));
  }
  if (P < 4) return null;
  /* 谐波陷阱校正（v1.0.27 棋谱截图 07/08 实测）：棋子群整行计入投影造成
   * 幅值剧烈波动（91~522）+ 局部缺峰，自相关锁到半周期副峰（P0=19，
   * 真值 35.8）→ 提峰/拟合/窗口全歪 → 整图拒识。校正：粗提峰后取
   * 「相邻显著峰间隔的中位数」，与自相关估计差 >15% 时信中位数——
   * 缺峰造成的 2P 间隔、图缘碎峰都是少数，中位数稳健。 */
  {
    let smMax = 0;
    for (let i = 0; i < n; i++) if (sm[i] > smMax) smMax = sm[i];
    const cand = [];
    for (let i = 1; i < n - 1; i++) {
      if (sm[i] >= sm[i - 1] && sm[i] >= sm[i + 1] && sm[i] > 0.3 * smMax) cand.push(i);
    }
    const merged = [];
    for (const c of cand) {
      if (merged.length && c - merged[merged.length - 1] < 0.5 * P) {
        if (sm[c] > sm[merged[merged.length - 1]]) merged[merged.length - 1] = c;
      } else merged.push(c);
    }
    const gaps = [];
    for (let i = 1; i < merged.length; i++) gaps.push(merged[i] - merged[i - 1]);
    if (gaps.length >= 8) {
      gaps.sort((a, b) => a - b);
      const med = gaps[gaps.length >> 1];
      if (med >= kLo * 0.8 && med <= kHi * 1.2 && Math.abs(med - P) > 0.15 * Math.max(med, P)) {
        P = med;
      }
    }
  }
  if (dbg) dbg.P0 = P;                       // 自相关初估周期（插值细化后）
  /* 提峰：局部极大。半高宽只在**连续下降坡内**量（sm[L-1]<=sm[L] 是「还在下坡」
   * 的必要条件）—— 老写法 `sm[L-1] < half` 允许 L/R 越过谷底一路穿到相邻峰或
   * 图边界，于是同一张图里线峰的去留全看底噪抖动的运气：实测 15 条线峰被
   * 滤掉 6 条（两侧谷底恰好没有抖动回升点的那些），peaks<12 直接拒识——
   * 真实截图（棋子压线 + 压缩噪声）几乎必中这条。新写法从峰顶出发，走到
   * 半高以下就停：线峰 w≈2；黑子宽包（~0.9P）在图内时 w>0.6P 照旧被滤。
   * 撞到投影边界（L=0 / Rr=n-1）说明峰延伸出图、宽度量不到，保守放行，
   * 误留的峰由后面的拟合剔野兜底。 */
  const peaks = [];
  /* 高度门槛 0.15·max：bright 投影里暗线是「谷」，谷间背景平台的噪声尖刺
   * 高度远低于真线峰 —— 不设门槛的话（0.8P 放宽后）尖刺能凑出 15 inliers
   * 的伪解（13 路空盘实测 rms 9.87 → 被报「倾斜」）。真线峰 ≥ 0.15·max 恒过。 */
  let maxSm = 0;
  for (let i = 0; i < n; i++) if (sm[i] > maxSm) maxSm = sm[i];
  /* 相对阈（v1.0.28 40 号实证）：GRAD 路径（relThr=0.06）放宽——光照不均的
   * 深皮盘 row 方向格线峰只有 120-260，而框线/亮带峰 432 抬高 0.15·max 阈
   * 把它们全灭。放宽后多出的噪声峰由链跟踪（间距连续性）+lcRatio+rms 守门兜。
   * 等距版保持 0.15 不变（13 路空盘噪声尖刺防线）。 */
  const relThr = relThr0 !== undefined ? relThr0 : 0.15;
  for (let i = 1; i < n - 1; i++) {
    if (sm[i] <= relThr * maxSm || sm[i] <= sm[i - 1] || sm[i] < sm[i + 1]) continue;
    /* 等高平顶取中点（v1.0.26 矩阵探针发现）：box 缩放把 2px 线折成 1px，
     * 投影单点峰经 3px 平滑后是 3px 等高平顶，老逻辑取平顶左端 → 峰位恒偏
     * 1px（P=76 缩放图实测 15 条线全体 -1px、lineEv 全灭 avgLineEv 0.055）。
     * 1px 线平顶 39..41 → 中点 40 与真线对齐；宽峰无等高平台，零影响。 */
    let Lp = i, Rp = i;
    while (Lp > 0 && sm[Lp - 1] === sm[i]) Lp--;
    while (Rp < n - 1 && sm[Rp + 1] === sm[i]) Rp++;
    const px0 = Math.floor((Lp + Rp) / 2);
    const half = sm[i] / 2;
    let L = i; while (L > 0 && sm[L] > half && sm[L - 1] <= sm[L]) L--;
    let Rr = i; while (Rr < n - 1 && sm[Rr] > half && sm[Rr + 1] <= sm[Rr]) Rr++;
    /* 宽度上限 0.8P（原 0.6P）：歪图（边框+斜 3° 实测）把投影峰抹宽到
     * ~16px，小周期图（P≈21）0.6P=12.5px 会把 15 条峰全滤掉。黑子宽包
     * （~0.9P）仍在 0.8P 之上照旧被滤。 */
    if ((L > 0 && Rr < n - 1) && Rr - L > 0.8 * P) continue;
    peaks.push({ x: px0, h: sm[i] });
  }
  /* 峰数门槛（v1.0.28 40 号实证）：等距版要 15 线窗枚举，<12 无意义；
   * 渐变链版（minPeaks=8）允许缺线——链跟踪+二次拟合本就是为缺线盘设计的，
   * 底部亮带抬高 0.15·maxSm 相对阈、宽包滤掉棋子区后格线峰只剩零星几条，
   * 12 门槛让 GRAD 连入场资格都没有。 */
  if (peaks.length < (minPeaks || 12)) return null;
  if (dbg) dbg.peaks = peaks;
  /* 同线双峰合并：~2px 宽的线峰经平滑后在峰顶噪声里分裂成两个相邻局部极大
   * （真机 crop 图 col 峰 53/55 实测）。不合并则同线双峰在拟合里互拉、峰数虚增。 */
  const pk2 = [];
  for (const pk of peaks) {
    const last = pk2[pk2.length - 1];
    if (last && Math.abs(pk.x - last.x) < 3) {
      if (pk.h > last.h) pk2[pk2.length - 1] = pk;
    } else pk2.push(pk);
  }
  return { n, sm, pk2, P, dbg };
}

function scanFindGrid(prof, wide, dbg, fixedP) {
  const pre = scanGridPre(prof, wide, dbg);
  if (!pre) return null;
  let { n, sm, pk2, P } = pre;
  if (fixedP) P = fixedP;               // 交叉周期校正：钉死周期，只拟合相位
  /* 锚点选择（v1.0.26 真机修复）：老代码 φ0 = 第一个峰的 x —— 老板框选的图
   * 左边缘就是棋盘外框（粗黑线，投影峰全场最高 h=662），被当锚后等距拟合沿它
   * 塌出一套「错一格」的伪网格：列号整体 +1（老板报的「坐标偏」），最左上的白
   * 子骑在伪交点边缘、环带被邻子霸占 bgLocal 抬成白 → 判空漏子（探针
   * probe_real_photo 在真机原图上逐机制复现：12 颗全偏右一列 + 漏 (5,4)W）。
   * 改为：每个峰当锚试一圈，数「以 P 为周期能对齐(±0.2P)的峰数」，支持度最高
   * 者当选 —— 外框峰只有自己支持自己（support=1），真线锚 support=15，天然分开。 */
  let phi = pk2[0].x, bestSup = -1;
  for (const anc of pk2) {
    let sup = 0;
    for (const pk of pk2) {
      const k = Math.round((pk.x - anc.x) / P);
      if (Math.abs(pk.x - anc.x - k * P) < 0.2 * P) sup++;
    }
    if (sup > bestSup) { bestSup = sup; phi = anc.x; }
  }
  if (dbg) dbg.phi0 = phi;
  let lines = null;
  for (let iter = 0; iter < 3; iter++) {
    /* 剔野首轮 0.3P（兼容歪图峰心漂移），次轮起收紧 0.22P —— 锚点已对、P/φ
     * 已粗正，外框峰（dev≈0.27P）在这轮出局，第三轮纯真线拟合把 P/φ 收准。 */
    const cut = iter === 0 ? 0.3 : 0.22;
    let sk = 0, sx = 0, skk = 0, skx = 0, m = 0;
    const pts = [];
    for (const pk of pk2) {
      const k = Math.round((pk.x - phi) / P);
      const pred = phi + k * P;
      if (Math.abs(pk.x - pred) > cut * P) continue;   // 野点
      pts.push([k, pk.x, pk.h]);
      sk += k; sx += pk.x; skk += k * k; skx += k * pk.x; m++;
    }
    if (m < 12) return null;
    const den = m * skk - sk * sk;
    if (den === 0) return null;
    if (!fixedP) P = (m * skx - sk * sx) / den;   // 交叉周期校正模式：P 钉死只拟合 φ
    phi = (sx - P * sk) / m;
    if (dbg) dbg['it' + iter] = { P: P, phi: phi, m: m };
    if (iter === 2) {
      /* 用最终 P/φ 枚举「连续 15 条线」窗口：k 从 kmin 起逐格，取峰支持度最高。
       * 范围用**图**而不是峰（v1.0.27 棋谱截图实测）：边缘裁剪会把第 1/15 条
       * 线的峰截掉（残局图峰只覆盖 14 条线范围），按峰范围枚举连一个 15 线
       * 窗口都凑不出（s+14≤kmax 无解）→ 网格明明拟合成功（15 内点 rms 0.8）
       * 却整体 null。缺线窗口支持度 14/15 仍参评，inl≥12 门槛兜住质量。
       * 线位距图边 ≥2px（v1.0.28 44 号实证）：窗口压到图边缘时，边缘列的
       * 黑边/外框假峰（h 满贯）给窗口白送一份 sup → 偏移一格的伪窗反超
       * 真窗（识别 55..575 vs 真实 22..540）。真实贴边线最近 3px（08 号
       * 顶线），2px 阈不误伤。 */
      const kmin = Math.ceil((2 - phi) / P);
      const kmax = Math.floor((n - 3 - phi) / P) - 14;
      let best = null;
      /* 亚周期相位细扫（v1.0.27 棋谱 15/16 实测，probe_lineev）：回归 φ 偶发
       * 整体错 ~0.2P（15 号 row：P=36 对、φ=316.7，mod P 偏 8px → 15 条线
       * 全体偏 8px → lineEv 采样全落空 avgLineEv=0.113 拒识）。窗口枚举原来
       * 只在整数栅格上滑（px=φ+k·P），φ 错了所有窗口一起错，hit 容差 0.3P
       * 还照常拿分。细扫 φ±0.5P 步长 1px 让窗口自己找最贴峰的相位 —— sup
       * 在真相位处最大，正确解是候选之一，不会比原行为差。 */
      const F0 = Math.floor(0.5 * P);
      for (let f = -F0; f <= F0; f++) {
        const ph = phi + f;
        for (let s = kmin; s <= kmax; s++) {
          const ls = [], hit = [];
          let inl = 0, sup = 0;
          for (let k = s; k <= s + 14; k++) {
            const px = ph + k * P;
            ls.push(px);
            // 找 0.3P 内的峰：取**最近**者（等距取强峰），不是 x 序第一个。
            // （v1.0.28 棋谱 30 实证：真线前 ~0.13P 处有 JPEG 鬼影弱峰——
            //  94 强线前 88 弱峰 h 264 vs 70、147 前 140 h 280 vs 89，x 序
            //  第一个恒是鬼影 → 真相位每条线都被衰减打折、鬼影相位反而贴
            //  鬼影全额 → 细扫选错相位全体偏 7px → 空点采样带落空
            //  avgLineEv 0.082 拒识。与下方 rms「每线最近峰」同语义。）
            let found = null;
            for (const pk of pk2) {
              const dv = Math.abs(pk.x - px);

   * sW2a（br≈0、dk≈0.1-0.19），角子走主路径（br 0.79+ / dk 0.75+）。 */
  const brMemo = new Float32Array(N * N), dkMemo = new Float32Array(N * N);
  const mBExMemo = new Float32Array(N * N);   // 白亮核超出底色的量（mB - bgLocal）
  const lv = new Float32Array(N * N);            // 每交点线证据（行/列级假行检测用）

  const RO = 0.75 * P;           // 底色参照环外沿

   * sW 第一因子 0.35 门槛下，合成噪声（σ22 均匀底噪 br≈0.36、σ45≈0.44）与

   * 假白（darkSkin 5:184 / 偏心 / 噪声45 三案），而绝对阈提到 0.45 又杀真实
   * 弱白（05 号 br=0.43、22 号数字白 br=0.16）。分离点不在绝对 br 而在
   * **超底噪幅度**：真白亮盘 br 显著高于同盘空点底噪（实测最小 +0.16 =
   * 22 号数字白），假白 br≈底噪本身（实测最大 +0.06）。预扫一遍取全盘 br
   * 的 p50（棋盘空点占多数，p50 落在底噪区；封顶 0.45 防 darkSkin 亮线把
   * floor 抬太高反而放走假白——darkSkin 空点 p50 实测 0.45 在帽沿）作基准。
   * p50 比 p25 更抗「邻子暗影微污染环带 → bgLocal 塌 6-10 → 亮阈下移 →
   * br 虚高 0.13」的中盘连片+偏心+阴影案（矩阵 21P/1F 残余三假白）。 */
  const brPre = new Float32Array(N * N);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const k = j * N + i, cx = xs[i], cy = ys[j];
    const x0 = Math.max(0, Math.floor(cx - RO)), x1 = Math.min(w - 1, Math.ceil(cx + RO));
    const y0 = Math.max(0, Math.floor(cy - RO)), y1 = Math.min(h - 1, Math.ceil(cy + RO));
    const ring = []; const winV = [];
    for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) {
      const dx = xx - cx, dy = yy - cy, r2 = dx * dx + dy * dy;
      if (r2 > RO * RO) continue;
      const v = gray[yy * w + xx];
      if (r2 <= R * R) winV.push(v);
      if (r2 >= (1.05 * R) * (1.05 * R)) ring.push(v);
    }
    ring.sort((a, b) => a - b);
    let bg = ring.length ? ring[ring.length >> 1] : 128;
    if (ring.length) {
      let darkN = 0;
      for (const v of ring) if (v < bg - 22) darkN++;
      if (darkN > ring.length * 0.35) {
        const p80 = ring[Math.min(ring.length - 1, Math.floor(ring.length * 0.8))];
        if (p80 > bg) bg = p80;
      }
    }
    let bn = 0;
    for (const v of winV) if (v > bg + 6) bn++;

  }
  const sorted = Array.from(brPre).sort((a, b) => a - b);
  const brFloor = Math.min(0.45, sorted[Math.floor(sorted.length * 0.5)] || 0);
  let outEdge = 0, sumLineEv = 0, nEmpty = 0;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const k = j * N + i, cx = xs[i], cy = ys[j];
    const x0 = Math.max(0, Math.floor(cx - RO)), x1 = Math.min(w - 1, Math.ceil(cx + RO));
    const y0 = Math.max(0, Math.floor(cy - RO)), y1 = Math.min(h - 1, Math.ceil(cy + RO));
    // 窗口出界比例（把整圆应占面积与实际可得面积比）
    const full = Math.PI * RO * RO;
    let avail = 0;
    for (let yy = y0; yy <= y1; yy++) {

      avail += Math.min(x1, cx + half) - Math.max(x0, cx - half) + 1;

    if (avail / full < 0.6) {                       // 出界 >40%：判空 + 低置信（交红圈/用户）

    for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) {

      if (r > RO) continue;
      const v = gray[yy * w + xx];
      if (r <= R) { win.push(v); winDx.push(dx); winDy.push(dy); winWarm.push(warm ? warm[yy * w + xx] : 0); }
      if (r >= 1.05 * R) ring.push(v);
    }
    ring.sort((a, b) => a - b);
    let bgLocal = ring.length ? ring[ring.length >> 1] : 128;
    /* 环污染回退（2026-10-03 棋谱 15）：放大的标记黑子（终结者 App 关键手
     * 大一圈）把参照环也吞进石子 → bgLocal 塌到石子灰，「窗内比底暗」第二
     * 因子归零 → 黑子判空（15 号 (10,8) 实测 bgLocal 51 vs 真底 92、dk 0.61
     * 但 sB=0）。环里 >35% 像素比中位数暗 22+ 时改取 P80：目标格 p80=93≈
     * 真底 92；正常格 darkRing≤0.35 完全不受影响（15 号全盘仅 4 格触发）。
     * 白子门（2026-10-11 45 号漏子解剖，probe_ring_any 全案数据）：白子带
     * 黑邻子时环暗占比 0.351-0.352 踩线触发回退，p80 落到白邻子像素上
     * （bgLocal 217→241/243），mB-bg 塌到 11.3 过不了 f2 的 11.5 阈 → sW=0
     * 判空（56/52 两颗）。回退语义是「环中位塌了、P80 才是真底」——但窗口

     * 同亮度、差值只剩印数拉低）暗环像素是邻子不是底塌，不回退。判别式
     * winQuick ≤ ringP80-5 全案余量（gap=p80-winQ）：需 skip 的 45 号两颗
     * gap 1.9/3.4，需 fire 的 37 号暗角空点 gap 6.4、43 号群心空点 12.5、
     * 15 号吞环黑子 52——分居两侧。附带修正：15 号 (11,9) 黄标黑子（21 手）
     * 基线误判白，其 gap=-2.9 走 skip 后 blackCore 阈正确命中黑。 */
    let winQuick = 0;
    if (win.length) { let s3 = 0; for (let q3 = 0; q3 < win.length; q3++) s3 += win[q3]; winQuick = s3 / win.length; }
    let darkRing = 0, ringP80 = 0;
    if (ring.length) {
      let darkN = 0;
      for (const v of ring) if (v < bgLocal - 22) darkN++;
      darkRing = darkN / ring.length;
      ringP80 = ring[Math.min(ring.length - 1, Math.floor(ring.length * 0.8))];
      if (darkRing > 0.35 && ringP80 > bgLocal && winQuick <= ringP80 - 5) bgLocal = ringP80;

    let mG = 0, darkDisk = 0, brightDisk = 0, midDisk = 0, deepDark = 0, blackCore = 0;
    let bSum = 0, bCnt = 0, bWarm = 0;
    /* 中心亮占比 ctrBr（2026-10-03 矩阵 run3 假白解剖）：r≤0.6R 圆内亮于
     * bg+6 的像素占比。真白亮盘是居中连续圆盘（偏心 ≤0.17P 时该圆大部分
     * 仍在盘内）→ ctrBr 高；纯噪声亮斑任意圆内同分布（σ22 均匀底噪全窗
     * ≈0.36）、亮线皮肤（darkSkin 线亮于底）空点的亮像素是贯穿细线（中心
     * 圆内占比骤降）→ ctrBr 低。矩阵实测：darkSkin 空点 br=0.46、偏心侵窗
     * 假白 br=0.40、噪声45 假白 br=0.41-0.44 —— 亮总数分不开，空间分布分得开。 */
    let ctrN = 0, ctrB = 0;
    const RC = 0.6 * R;
    for (let q = 0; q < win.length; q++) {

      ctrN++;
      if (win[q] > bgLocal + 6) ctrB++;

      if (v > bgLocal + 6) {

    const blackCoreN = blackCore / (win.length || 1);
    /* mid 像素空间分布（2026-10-03 假白闸门设计用）：真白/灰白子的 mid 盘
     * 以交点为中心对称；邻子阴影/眩光侵入的 mid 像素偏向窗口一侧。

    let midYSum = 0, midCtrN = 0, midCtrHit = 0;

      const v = win[wi];
      if (v >= bgLocal - 45 && v <= bgLocal - 8 && v >= 90) {

        if (winDx[wi] * winDx[wi] + winDy[wi] * winDy[wi] <= RC2) midCtrHit++;

      if (winDx[wi] * winDx[wi] + winDy[wi] * winDy[wi] <= RC2) midCtrN++;

    const midCtr = midCtrN ? midCtrHit / midCtrN : 0;
    /* 亮像素均值 mB（v1.0.27 棋谱截图实证）：手数数字盖在棋子中心是各类
     * 棋谱 App 的常态 —— 白底黑字把窗口均值 mG 拉向暗侧（自家 App 实测

     * mB 只统计亮于底色的像素：白子 70% 像素亮（mB≈棋子本色），黑数字
     * 被过滤；黑子上白数字虽然计入 mB 但 brightDisk 占比不过门槛，
     * sW 仍为 0。扫描棋盘批 24 张 12 张靠这条救回。 */
    const mB = bCnt ? bSum / bCnt : bgLocal;
    const cl01 = v => Math.max(0, Math.min(1, v));

     * 25~35 —— 阈 30 会把黑子一半像素划出「显著暗」（darkDisk≈0.4 < 0.45，
     * 黑子整体判空，实测夹具 3/5 全灭）。收到 22 后空点的 darkDisk 余量

     * **斜率**：0.35→0.12（间隔变悬崖）、第二因子斜率 14→8（深皮软件棋盘

     * 判空线，网格解偏 1px 就整批漏子；收斜率后弱黑子 sB≈0.6+，窗口 ±1px
     * 抖动不再致命）。 */
    const sB = cl01((darkDisk - 0.45) / 0.12) * Math.max(
      cl01((bgLocal - mG - 14) / 8),
      /* 暗角相对暗度通道（v1.0.32 49 号实测）：视频光照暗角区 bgLocal 低，

       * 真白子翻成黑，黑白错乱）。相对暗度 (bg-mG)/bg：黑子比底暗 60%+，

       * 深皮盘黑 25/皮 51：相对 0.51 → 因子 (0.51-0.4)/0.2 = 0.55 仍判黑 ✓。 */
      cl01(((bgLocal - mG) / Math.max(1, bgLocal) - 0.4) / 0.2));
    /* 深黑核心补线（v1.0.27 棋谱 15/16 实测）：**黄标黑子**（App 当前手黄底
     * 高亮盖在黑子上）窗口 = 黑本体 35% + 黄块 33% —— 黄块把 dk 稀释到
     * 0.45 踩线（sB=0），又把 br 顶到 0.51（sW=0.64 判白，21/23 两颗错）。

     * 白子 0、空点 0（min 的 60 上限保证深皮底 45-65 与绿盘空点不进带）。

    const sB2 = cl01((blackCoreN - 0.30) / 0.10);

     *    判白（cf 0.55）。全部主路径真白 mB-bg≥13.6（07 号最弱 13.6、其余
     *    ≥20），阈 11.5 斜率 2.8：假白 f2=0 归空（sE 0.75 反超判 E）、最弱
     *    真白 f2=0.75 仍稳 W（conf 0.77→0.66），≥20 者完全不受扰。 */
    /* ⑤ 底噪自适应（2026-10-03 矩阵 run3 假白解剖，见函数头注释）：亮像素
     *    占比必须显著高于同盘空点底噪（真白最小超幅 +0.16 = 22 号数字白；
     *    假白最大 +0.06）——噪声盘/亮线皮肤的空点亮斑全部死在底噪水平。
     *    阈 0.125（2026-10-03 05 号漏子案）：0.35→0.30 放 f1 后，五重叠加案
     *    (8,9)（br 0.47 超幅 0.13、mB-bg 18.6）靠本阈压到 brOver 0.03、
     *    sW 0.02 被 sE 反超；漏子 (5,3)/(7,5)（br 0.38、mB-bg 19-23）brOver
     *    满格不受影响。22 号数字白超幅 0.16 → 权重 0.67，conf 仍 0.8+ 稳白。 */
    const brOver = cl01((brightDisk - brFloor - 0.125) / 0.06);
    /* ⑥ f1 阈 0.35→0.30（2026-10-03 05 号漏子案）：红十字标记子 (5,3) 与

    const sW = cl01((brightDisk - 0.30) / 0.25) * cl01((mB - bgLocal - 11.5) / 2.8) * brOver;

     * ② 数字亮盘白子（自家 App）：白子亮盘 br≈0.19-0.21 过不了 0.35 门槛、

     *    br∈[0.10,0.35] + dk<0.35 + mG<bg-6 三重夹击只命中数字白子。
     *    **bgLocal≥220 浅底闸门**：这条形态只在浅色盘上找（自家 234/残局

     *    （08 号 VCF 界面 bg 171-206 实测 78 颗暴增的元凶），一律不参评。

       * （40 y14 亮峰 4/9 像素）——中位被盘面像素稀释到 157（vs 盘内基线
       * 151，差 6 撤不动，假子全漏）；75 分位咬住峰结构（249）。30 号
       * y14 的「盘内暗|线|UI 亮」不对称剖面上 75 分位≈186 与 UI 侧基线
       * 185 打平 → 双侧判据自然拦住。 */

      if (bl !== undefined && cm - bl < 15) continue;
      if (br !== undefined && cm - br < 15) continue;

        const k2 = alongX ? (q * N + edge) : (edge * N + q);
        if (grid[k2] !== 0) { grid[k2] = 0; conf[k2] = 0.3; }

}

}

/* 灰度直方图归一化——**已试并回滚**（2026-10-10，tools/probe_generalize.mjs
 * 实证）：29 张真实图 × 8 变换矩阵上，percentile 拉伸把灰度 22→8 PASS、
 * 色偏 20→8、亮-30 16→6——正常图的分布被拉伸扭曲、contrast≈255 破坏投影
 * 峰检测量纲，负收益全面回退。真正的泛化命门是**饱和截断**（亮+30/过曝把
 * 白子与亮底糊成一片，信息不可逆丢失）与相对差压缩，归一化救不了。
 * 泛化结论钉在这：分类全靠「相对 bgLocal 的亮度差」（灰度/色偏几乎全 PASS
 * 可证），对整体平移缩放本就鲁棒；没有真实失败样图之前不再盲改。 */
/* 自动裁纯色边带（2026-10-10 棋谱 40 实证）：用户随手框选常带进大片异色
 * 背景（视频黑边/纯色 UI 边）——40 号 crop 含 250px 黑边把全图 p50 拉到 81，
 * bright 阈值 99.5 低于木盘底色 130，木盘整片被判「亮」→ 行投影饱和无峰
 * → 拒识。而格线本身完全健康（P≈37.5 正方等距）。药：从四边向内裁掉
 * 「近单色」的连续边带（该行/列 ≥92% 像素落在行中位数 ±16 内）。
 * 保守三闸：①连续 ≥6px 才裁（棋盘自身边框线 1~3px 不动）；②每边最多裁
 * 到画面 45%（真盘内容永远留得住）；③裁后 <200px 视为裁爆（纯色图），
 * 原样返回交给对比度门拒。灰度单色 ≈ 任意纯色边带（黑边/白边/色带）。 */
function scanTrimBorder(img) {
  const b = scanDetectBorder(img);
  if (!b.changed || b.x1 - b.x0 < 200 || b.y1 - b.y0 < 200) return img;
  const w = img.width, h = img.height;
  const d = img.data;
  const nw = b.x1 - b.x0, nh = b.y1 - b.y0;
  const nd = new Uint8ClampedArray(nw * nh * 4);
  for (let y = 0; y < nh; y++) {
    const src = ((y + b.y0) * w + b.x0) * 4, dst = y * nw * 4;
    nd.set(d.subarray(src, src + nw * 4), dst);
  }
  return { data: nd, width: nw, height: nh, trimX: b.x0, trimY: b.y0 };
}

/* 边带检测（scanTrimBorder 的检测半区，重试外层也要用）：
 * 返回「异色单色边带」包围盒。 */
function scanDetectBorder(img) {
  const w = img.width, h = img.height;
  const g = scanToGray(img);
  const gAt = (x, y) => g[y * w + x];
  /* 全图主色：边带必须与它**异色**才可裁（v2，03 号误杀教训）——
   * downscale 的 box 平均把盘内空区行抹得几乎全单色，「仅单色」会把
   * 同色空盘区当边带一路裁到有棋子的行（03 号实测盘被裁掉一半）。
   * 黑边/白边带与主色差大 → 裁；同色底带（App 底/空盘木底）→ 留。 */
  const all = [];
  for (let i = 0; i < g.length; i += 7) all.push(g[i]);   // 1/7 采样够算 p50
  const P50G = all.sort((a, b) => a - b)[all.length >> 1];
  const MED = (a) => { const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; };
  /* 行/列判定 = 单色 且 与主色异色 */
  const rowOK = (y) => {
    const row = [];
    for (let x = 0; x < w; x++) row.push(gAt(x, y));
    const m = MED(row); let c = 0;
    for (const v of row) if (Math.abs(v - m) <= 16) c++;
    return c >= w * 0.92 && Math.abs(m - P50G) > 24;
  };
  const colOK = (x) => {
    const col = [];
    for (let y = 0; y < h; y++) col.push(gAt(x, y));
    const m = MED(col); let c = 0;
    for (const v of col) if (Math.abs(v - m) <= 16) c++;
    return c >= h * 0.92 && Math.abs(m - P50G) > 24;
  };
  const MAX = Math.floor(Math.min(w, h) * 0.45);
  /* 带内允许零散例外行（40 号黑边带里有字幕小字行，「连续单色」在
   * 第一个带字行就断）。推进规则：可裁行刷新进度、连续 miss 超限才算
   * 真进内容区停——边带内零散字行被跳过后一并裁掉。 */
  let x0 = 0, y0 = 0, x1 = w, y1 = h;
  let run = 0, miss = 0;
  /* miss 上限 50（v4，40 号实测）：黑边带中部有整块标题字幕区（连续 >12 行
   * 非单色），miss=12 在那里断带只裁到 180/250。放宽到 50 的安全性由
   * 「异色」条件兜底——盘区行与主色同色恒不可裁，推进不可能进盘；
   * 被 miss 跳过的例外行只可能是边带内的 UI 字/装饰。 */
  for (let y = 0; y < MAX; y++) {
    if (rowOK(y)) { run = y + 1; miss = 0; }
    else if (++miss > 50) break;
  }
  if (run >= 6) y0 = run;
  run = 0; miss = 0;
  for (let y = h - 1; y >= h - MAX; y--) {
    if (rowOK(y)) { run = h - y; miss = 0; }
    else if (++miss > 50) break;
  }
  if (run >= 6) y1 = h - run;
  run = 0; miss = 0;
  for (let x = 0; x < MAX; x++) {
    if (colOK(x)) { run = x + 1; miss = 0; }
    else if (++miss > 50) break;
  }
  if (run >= 6) x0 = run;
  run = 0; miss = 0;
  for (let x = w - 1; x >= w - MAX; x--) {
    if (colOK(x)) { run = w - x; miss = 0; }
    else if (++miss > 50) break;
  }
  if (run >= 6) x1 = w - run;
  return { x0, y0, x1, y1,
    changed: !(x0 === 0 && y0 === 0 && x1 === w && y1 === h) };
}

/* RGBA 子区拷贝（重试外层的裁窗） */
function scanCropImg(img, x0, y0, x1, y1) {
  const w = img.width, nw = x1 - x0, nh = y1 - y0;
  const nd = new Uint8ClampedArray(nw * nh * 4);
  for (let y = 0; y < nh; y++) {
    const src = ((y + y0) * w + x0) * 4, dst = y * nw * 4;
    nd.set(img.data.subarray(src, src + nw * 4), dst);
  }
  return { data: nd, width: nw, height: nh };
}

/* 识别主入口：松框兜底重试（2026-10-10 老板「框选/大小不苛刻」+ 准确第一）。
 * 首跑失败后按两个通用策略重试，每个候选走**完整管线+全部守门**（守门零
 * 放松，过不了照样拒——宁可拒不可错）：
 *   ① 内容窗：边带检测出的非边带区（40 号视频黑边+标题字带实测 250px
 *      异色带卡死 p50/阈值，trim 只裁得到一半）；
 *   ② 中心 80%/62% 缩窗（44 号 PC 窗口两侧面板干扰列投影，缩窗甩掉边缘
 *      干扰源；41 号伪周期也是边缘棋子群/面板结构拉偏自相关）。
 * 全败返回首跑的拒识原因（最有代表性）。 */
function scanImageCore(img) {
  const r0 = scanImageOnce(img);
  if (r0.ok) return r0;
  // 尝试 2：禁自动裁边带的原样图（05 号实测：按钮纯色带被裁掉时切走盘底，
  // 而不裁时 p50 本来就干净——trim 是援军不是必经步骤）
  const r1 = scanImageOnce(img, true);
  if (r1.ok) return r1;
  const wIn = img.width, hIn = img.height;
  const base = scanDownscale(img, 1000);
  const sx = wIn / base.width, sy = hIn / base.height;
  const cands = [];
  const b = scanDetectBorder(base);
  if (b.changed && b.x1 - b.x0 > 200 && b.y1 - b.y0 > 200)
    cands.push({ img: scanCropImg(img, Math.round(b.x0 * sx), Math.round(b.y0 * sy),
                                   Math.round(b.x1 * sx), Math.round(b.y1 * sy)),
                 tag: '内容窗' });
  for (const s of [0.8, 0.62]) {
    const w2 = Math.round(base.width * s), h2 = Math.round(base.height * s);
    const x0 = Math.round((base.width - w2) / 2), y0 = Math.round((base.height - h2) / 2);
    cands.push({ img: scanCropImg(img, Math.round(x0 * sx), Math.round(y0 * sy),
                                   Math.round((x0 + w2) * sx), Math.round((y0 + h2) * sy)),
                 tag: '中心' + s });
  }
  for (const c of cands) {
    const r = scanImageOnce(c.img);
    if (r.ok) return r;      // xs/ys 本就在输入图坐标系（候选窗是原图子区）
  }
  /* 第 5 档：低对比阈（v1.0.28，40 号实证）。深皮游戏盘的格线只比底色亮
   * 20-30 灰阶（40 号实测线 v≈110-130 / 底 v≈90-110 / p50=90），而投影阈
   * 用 contrast（p95-p5=113）—— 格线全灭、只剩白棋子和框过阈，网格无峰。
   * 全部常规档失败后用固定小阈 22 重试一次：线行过阈、行间不过，
   * 投影恢复周期性。常规档能过的图行为不变。 */
  const r4 = scanImageOnce(img, false, 22);
  if (r4.ok) return r4;
  /* 小图放大重试已上移为 scanImage 的「缩放图多尺寸仲裁」（短边 <660 的图
   * 原尺寸+2x(+4x) 三档按棋理修正颗数仲裁）——覆盖面更广（450-660px 的
   * 60% 档也参与），此处不再重复。 */
  return r0;
}
function scanImage(img) { return scanImageCore(img); }
/* 缩放图多尺寸仲裁（v1.0.29 边界修复轮，probe_scale_experiment 实测）——
 * **在 UI 层（runScanOnImageData）调用**，不在 scanImage 内：test_logic 直接
 * 调 scanImage 测「管线识别精度」，夹具里合法地含 7:5 非法局面（9c/9d 实测），
 * 仲裁若在 scanImage 内跑棋理对账会污染 raw 语义（把测试弄红）。
 * 短边 <660px 的图（用户把大图缩到 35%/60% 再喂），原尺寸跑完后再跑 2x
 * 双线性放大档，两档结果各数一遍「棋理修正颗数」（= 认错子数的下界，只数
 * 不翻——真正翻色仍由调用方现有的 enforceBalance 统一执行）：
 *   - 原档修正 0（棋理自洽）→ 直接采信原档：合成夹具（620px LCG 噪声图）
 *     与主基线行为零扰动；
 *   - 原档需翻色/几何拒识 → 放大档竞争，翻色更少者胜（实测 13_s35 29→27、
 *     50_s35 41→38、45_s35/s60 76→78、52_s35 拒→55 全修复）；
 *   - 放大爆炸的图（55_s35 底纹 51/88 颗、翻色 20/39）被此判据自然拒绝；
 *   - 内容类失败（比例/棋理/零子）不仲裁：图上不存在合法盘面，放大改不了
 *     内容——21:1 图放大后底纹多读出的白子反而绕过比例守门（21:2 过 20 阈）
 *     静默导入错盘面。
 * 实测残留（交底）：13_s60 假白 1 颗（原/放大棋理均自洽，判据不可见）、
 * 43_s60 锚差 1 行（缩放糊化框边、台阶特征消失）、40_s35/s60 拒识
 * （重采样链里对比度灭透，放大重试也救不活）。 */
function scanImageArb(img) {
  const r0 = scanImage(img);
  if (img.width >= 660 && img.height >= 660) return r0;
  if (!r0.ok && !/网格|倾斜|15路/.test(r0.reason || '')) return r0;   // 内容失败不仲裁
  const fixNof = r => {
    if (!r.ok) return 1e9;
    let nb = 0, nw = 0;
    for (let k = 0; k < r.grid.length; k++) { if (r.grid[k] === 1) nb++; else if (r.grid[k] === 2) nw++; }
    const d = nb - nw;
    return (d === 0 || d === 1) ? 0 : Math.ceil(Math.abs(d) / 2);
  };
  const f0 = fixNof(r0);
  if (f0 === 0) return r0;                 // 原档棋理自洽 → 直接采信（夹具零扰动）
  let big = img, bestB = null, bestN = f0;
  for (let k = 0; k < 2; k++) {
    big = scanUpscale2x(big);
    const rb = scanImage(big);
    const fb = fixNof(rb);
    if (rb.ok && fb < bestN) { bestB = rb; bestN = fb; }
    if (big.width >= 900 && big.height >= 900) break;
  }
  return bestB || r0;                      // 放大档严格更优才采纳（同分保留原档）
}

/* 外线外侧连续暗带宽度（框边台阶判别式的量尺，probe_step_run 同款）：
 * 从线位向外走，行/列均值低于（±0.3P 内最暗 + 30）的连续像素数。
 * 真格线（细暗线，外侧是板底）外侧暗带 ≈0；「板→暗框」的框边台阶
 * 外侧整片暗 → 暗带宽。 */
function scanOuterDarkRun(g, w, h, pos, P, dir, s0, s1, vertical) {
  const lim = vertical ? w : h;
  const mean = c => { let s = 0, n = 0; for (let t = s0; t <= s1; t += 2) { const v = vertical ? g[t * w + c] : g[c * w + t]; s += v; n++; } return s / Math.max(1, n); };
  const a = Math.max(0, Math.round(pos - 0.3 * P)), b = Math.min(lim - 1, Math.round(pos + 0.3 * P));
  let mn = 255;
  for (let c = a; c <= b; c++) mn = Math.min(mn, mean(c));
  const thr = mn + 30;
  let run = 0;
  for (let c = Math.round(pos); c >= 0 && c < lim; c += dir) {
    if (mean(c) < thr) run++; else break;
    if (run > 0.35 * P) break;
  }
  return run;
}

/* 小图 2x 双线性放大（v1.0.29 缩放图修复的对称操作）：scanDownscale 只缩
 * 不放——用户把大图缩到 35% 再喂，格线半像素化、框边糊化，特征全灭。
 * 只在「全档拒识 + 短边 <450px」时由 scanImage 调用（零回归设计：识别成功
 * 的图绝不重跑；曾试过全图放大（阈值 660），把 test_logic 的 620px 合成
 * 夹具环境整个改变（LCG 噪声被插值平滑、21:1 比例守门用例翻车）且
 * 55_s35 底纹被读成 88 颗子——否决，改为失败后重试档）。 */
function scanUpscale2x(img) {
  const w = img.width, h = img.height, d = img.data;
  const W = w * 2, H = h * 2;
  const out = new Uint8ClampedArray(W * H * 4);
  for (let y = 0; y < H; y++) {
    const sy = (y - 0.5) / 2;
    const y0 = Math.max(0, Math.min(h - 1, Math.floor(sy))), y1 = Math.min(h - 1, y0 + 1), fy = Math.max(0, Math.min(1, sy - y0));
    for (let x = 0; x < W; x++) {
      const sx = (x - 0.5) / 2;
      const x0 = Math.max(0, Math.min(w - 1, Math.floor(sx))), x1 = Math.min(w - 1, x0 + 1), fx = Math.max(0, Math.min(1, sx - x0));
      const j00 = (y0 * w + x0) * 4, j01 = (y0 * w + x1) * 4, j10 = (y1 * w + x0) * 4, j11 = (y1 * w + x1) * 4;
      const o = (y * W + x) * 4;
      for (let c = 0; c < 3; c++) {
        out[o + c] = d[j00 + c] * (1 - fx) * (1 - fy) + d[j01 + c] * fx * (1 - fy)
                   + d[j10 + c] * (1 - fx) * fy + d[j11 + c] * fx * fy;
      }
      out[o + 3] = 255;
    }
  }
  return { data: out, width: W, height: H };
}

function scanImageOnce(img, noTrim, thrOv) {
  const wIn = img.width, hIn = img.height;   // 输入图坐标（xs/ys 回传用，v1.0.28）
  img = scanDownscale(img, 1000);
  /* downscale 比例（v1.0.28 修复）：xs/ys 的逆映射必须用 **downscale 后**的
   * 比例 wIn/w_ds。老代码用 trim 后的 w —— trim 生效时坐标整体放大
   * w_ds/(w_ds-裁剪量)（44 号实测 dx=32 → 放大 5.9%，15 条线越右偏越多，
   * 第 15 线偏 34px≈1 格；41 号 dy=23 偏 0.7P → 采样圈错位 low 飙升）。 */
  const kDsX = wIn / img.width, kDsY = hIn / img.height;
  img = scanAutoLevel(img);          // 微歪自动拉正：±10° 内选网格最规整的角度（0° 也在候选）
  let trimX = 0, trimY = 0;
  if (!noTrim) {
    const t = scanTrimBorder(img);   // 自动裁纯色边带（黑边/纯色 UI 边不进 p50 统计）
    if (t.trimX !== undefined) { img = t; trimX = t.trimX; trimY = t.trimY; }
  }
  const w = img.width, h = img.height;
  const g = scanToGray(img);
  const warm = scanWarm(img.data, w, h);   // 暖色掩码：红圈标/黄标专用（双色盘救援）
  // 对比度
  const hist = new Uint32Array(256);
  for (let i = 0; i < g.length; i++) hist[g[i]]++;
  let acc = 0, p5 = 0, p50 = 0, p95 = 0;
  const n = g.length;
  for (let v = 0; v < 256; v++) {
    acc += hist[v];
    if (!p5 && acc >= n * 0.05) p5 = v;
    if (!p50 && acc >= n * 0.50) p50 = v;
    if (!p95 && acc >= n * 0.95) p95 = v;
  }
  if (p95 - p5 < 18) return { ok: false, reason: '图片对比度过低，请换一张清晰的截图' };
  const contrast = thrOv !== undefined ? thrOv : (p95 - p5);
  // 双假设投影找网格（窄周期范围失败 → 宽范围重试：框住整个带边框棋盘的图）
  let best = null;
  for (const mode of ['dark', 'bright']) {
    const pr = scanProject(g, w, h, mode, p50, contrast);
    let fx = scanFindGrid2(pr.col), fy = scanFindGrid2(pr.row);
    /* 框锚等分兜底（v1.0.29，40 号）：一维有实测解、正交维物理性无信号
     * （棋子群/暗区盖线）→ 用实测维线间中点做正交 DoG 投影，找间距≈14P
     * 的强框对 15 线等分。frame 维在下方守门处免检，可信度由
     * avgLineEv + 黑白比例 + 棋理校验兜底。 */
    if (fx && !fy) fy = scanGridByFrame(g, w, h, fx.lines, fx.period, true);
    else if (!fx && fy) fx = scanGridByFrame(g, w, h, fy.lines, fy.period, false);
    if (!fx || !fy) continue;
    const score = fx.inliers + fy.inliers - (fx.rms + fy.rms) / fx.period * 10;
    if (!best || score > best.score) best = { fx, fy, score, pr };
  }
  if (!best) return { ok: false, reason: '未检测到棋盘网格，请用正视、完整的棋盘截图' };
  /* 框边台阶滑窗（v1.0.29 05 号解剖，probe_step_run）：外线吃进「板→暗框」的
   * 宽台阶（外侧连续暗带 ≥0.12P；真格线外侧暗带实测 ≤0.08P）→ 最外线是框边
   * 不是格线、整窗错 1 行/列（05 号：真线 718..1710，伪窗把棋盘外 1 周期的
   * 底框边 1782 当第 15 线，10 子坐标整体 +1 行）→ 朝新外线干净的方向滑 1P。
   * 双侧都是台阶（45 rot+2 左 0.20/右 0.36）= 旋转越界，不滑。弱星盘（05 星
   * s 38-59 < 100）recal 救不了，只有这里能救。frame 解的线本就锚在框对上，
   * 不适用。滑窗后 inliers/hit 沿用原窗统计（新旧窗内点结构相同，差一条
   * 框边峰，inl≥12/span≥13 结论不变）。 */
  if (!best.fx.frame && !best.fy.frame) {
    const xs0 = Math.round(w * 0.25), xs1 = Math.round(w * 0.75);
    const ys0 = Math.round(h * 0.25), ys1 = Math.round(h * 0.75);
    const thrF = 0.12;
    /* 线贴框棋盘（30 号 s35 实测：外线+框连成 0.39P 暗带）单侧看似台阶但
     * 滑 1P 后新外线依旧贴框（暗带仍宽）——滑窗前先验证**新外线外侧干净**，
     * 不干净 = 贴框不是错锚，不滑。真错锚（05）滑 1P 后新外线外侧是板底，
     * 干净 ✓。 */
    const yL = scanOuterDarkRun(g, w, h, best.fy.lines[0], best.fy.period, -1, xs0, xs1, false);
    const yR = scanOuterDarkRun(g, w, h, best.fy.lines[14], best.fy.period, +1, xs0, xs1, false);
    if (yR >= thrF * best.fy.period && yL < thrF * best.fy.period) {
      const newY = scanOuterDarkRun(g, w, h, best.fy.lines[14] - best.fy.period, best.fy.period, +1, xs0, xs1, false);
      if (newY < thrF * best.fy.period)
        best.fy.lines = best.fy.lines.map(v => v - best.fy.period);
    } else if (yL >= thrF * best.fy.period && yR < thrF * best.fy.period) {
      const newY = scanOuterDarkRun(g, w, h, best.fy.lines[0] + best.fy.period, best.fy.period, -1, xs0, xs1, false);
      if (newY < thrF * best.fy.period)
        best.fy.lines = best.fy.lines.map(v => v + best.fy.period);
    }
    const xL = scanOuterDarkRun(g, w, h, best.fx.lines[0], best.fx.period, -1, ys0, ys1, true);
    const xR = scanOuterDarkRun(g, w, h, best.fx.lines[14], best.fx.period, +1, ys0, ys1, true);
    if (xR >= thrF * best.fx.period && xL < thrF * best.fx.period) {
      const newX = scanOuterDarkRun(g, w, h, best.fx.lines[14] - best.fx.period, best.fx.period, +1, ys0, ys1, true);
      if (newX < thrF * best.fx.period)
        best.fx.lines = best.fx.lines.map(v => v - best.fx.period);
    } else if (xL >= thrF * best.fx.period && xR < thrF * best.fx.period) {
      const newX = scanOuterDarkRun(g, w, h, best.fx.lines[0] + best.fx.period, best.fx.period, -1, ys0, ys1, true);
      if (newX < thrF * best.fx.period)
        best.fx.lines = best.fx.lines.map(v => v + best.fx.period);
    }
  }
  let Px = best.fx.period, Py = best.fy.period;
  /* rms/inliers 守门已放宽（v1.0.23）：有自动对齐兜底，宁可多认进一些交给校对态，
     也别把「差一口气」的图全拒掉 —— 老板实测「大小角度要非常精准才能识别」。
     rms 挂时分流文案：15 线窗口里有**假线**（inliers < 15，非 15 路网格硬套 15 线
     必然凑不出 15 条真峰）→「不是15路」；15 条线都在但歪（rms 超标）→「倾斜或透视」。
     原 v1.0.23 的「窗口跨度 <0.72 图宽」判定退役：框住整个带边框棋盘的图网格
     占比本来就不大，会被误伤。 */
  const fakeLines = best.fx.inliers < 15 || best.fy.inliers < 15;
  if (Math.abs(Px - Py) / Math.max(Px, Py) > 0.12 || best.fx.rms > 0.11 * Px || best.fy.rms > 0.11 * Py)
    return { ok: false, reason: fakeLines ? '不是15路棋盘（或棋盘占画面太小），无法识别'
                                          : '棋盘倾斜或透视过大，请转正一点或框正一点再试' };
  /* inl≥12 + span≥13（v1.0.29 双重守门，40 号框锚攻坚）：
   * ① inl 从 14 放宽到 12：40 号 col 实测 inl=12（深皮盘格线只亮 20-30
   *    灰阶 + 边线峰被「距边 ≥2px」挤掉 + 遮挡散布中间）——inl≥14 拒杀。
   * ② 放宽必须补 span：hit 首尾 true 索引差 ≥13（识别出的线至少覆盖 14
   *    连续格）。13 路盘（13 条真线）硬套 15 窗时不管窗位怎么滑，hit
   *    跨度 ≤12 格 → 必拒（v1.0.28 inl≥14 挡的 13 路带子盘由 span 接防，
   *    test_logic 带子用例回归验证）。miss 散布中间（遮挡特征，40 col
   *    hit=111011111010111 span=14）不误伤。
   * ③ frame 维（框锚等分解）免检：它的线证据是物理框对+吸附率，不适用
   *    投影峰计数的尺子；其可信度由最终 avgLineEv 守门兜底（40 实测 0.794）。 */
  const spanOf = hit => { const f = hit.indexOf(true); return f < 0 ? 0 : hit.lastIndexOf(true) - f; };
  const dimOk = d => d.frame ? true : (d.inliers >= 12 && spanOf(d.hit) >= 13);
  if (!dimOk(best.fx) || !dimOk(best.fy))
    return { ok: false, reason: '不是15路棋盘（或截图不完整），无法识别' };
  /* 星位重校准（v1.0.28）：UI 边缘峰把窗口拟合拽偏 1 行或 7% 周期（棋谱
   * 07/08/09 实证），棋盘自带星位是最硬的物理基准；弱星盘回退原网格。 */
  const recal = scanStarRecal(g, w, h, best.fx.lines, best.fy.lines, Px, Py);
  let useXs = best.fx.lines, useYs = best.fy.lines, useP = Math.min(Px, Py);
  if (recal) { useXs = recal.xs; useYs = recal.ys; useP = Math.min(recal.px, recal.py); }
  /* 框锚路径标记 → 亮边线整线撤子只在此路径生效（31 号真子保护，见规则注） */
  const isFrame = !!(best.fx.frame || best.fy.frame);
  let cls = scanClassify(g, w, h, useXs, useYs, useP, warm, isFrame);
  if (cls.outEdge > N * 15 * 0.15)
    return { ok: false, reason: '棋盘超出画面，请截完整棋盘' };
  /* 行/列线证据尾部守门已试并撤销（2026-10-03）：非 15 路网格硬套 15 窗口时
   * 末端行/列的 lv 确实塌（13 路夹具实测 0.84-0.91 vs 真盘 0.9+），但真图
   * 的边缘行被棋子盖线/裁剪切边后行 lv 同样塌（24 张实测 05/06/11/19/20
   * 五张 min 行 lv<0.35 被误拒）——真图分布与 13 路夹具重叠，标量阈不可分。
   * 13 路盘的防线 = 「零棋子拒识」（下方）：识别出 0 子时拒、不清用户棋谱。 */
  if (cls.avgLineEv < 0.22)
    return { ok: false, reason: '网格定位可疑：棋盘在画面里太小或太淡，请框得再紧一点' };
  let blacks = 0, whites = 0, low = 0;
  for (let k = 0; k < N * N; k++) {
    if (cls.grid[k] === BLACK) blacks++;
    else if (cls.grid[k] === WHITE) whites++;
    if (cls.conf[k] < CONF_LOW) low++;
  }
  let stones = blacks + whites;
  /* 交叉周期校正（v1.0.31 49/29 双实测）：列/行周期差 6%~12% 时，小方向被干
   * 扰峰拽出偏小周期（49 列 76.6 vs 行 83.8，差 8.6% 逃过 12% 方度守门 → 网
   * 格错位、假子漏子大爆发）。**放在 classify 之后、以「棋理修正颗数」为采纳
   * 判据**（第一版放 classify 前无判据，29 号被「合格但锚错」的重枚举解打偏，
   * 46 颗全部错位——probe_29_marked 实测）。用大周期钉死重枚举小方向 → 重跑
   * classify → 修正颗数**严格更少**才采纳（同分/更多保留原解，9d 教训）。
   * 差 <6% 不触发（正常图零影响）；frame 维的周期来自框对，不参与枚举竞争。 */
  const dP0 = Math.abs(Px - Py) / Math.max(Px, Py);
  if (dP0 > 0.06 && !best.fx.frame && !best.fy.frame && best.pr) {
    const fixN0 = (() => { const d = blacks - whites; return (d === 0 || d === 1) ? 0 : Math.ceil(Math.abs(d) / 2); })();
    const cand = Px < Py ? scanFindGrid2(best.pr.col, Py) : scanFindGrid2(best.pr.row, Px);
    if (cand && cand.inliers >= 12) {
      const nx = Px < Py ? cand.lines : useXs;
      const ny = Px < Py ? useYs : cand.lines;
      const cls2 = scanClassify(g, w, h, nx, ny, Math.max(Px, Py), warm, isFrame);
      let b2 = 0, w2 = 0;
      for (let k = 0; k < N * N; k++) { if (cls2.grid[k] === BLACK) b2++; else if (cls2.grid[k] === WHITE) w2++; }
      const d2 = b2 - w2;
      const fixN2 = (d2 === 0 || d2 === 1) ? 0 : Math.ceil(Math.abs(d2) / 2);
      if (cls2.avgLineEv >= 0.22 && fixN2 < fixN0) {
        if (Px < Py) { best.fx = cand; useXs = cand.lines; } else { best.fy = cand; useYs = cand.lines; }
        Px = Math.max(best.fx.period, best.fy.period);
        cls = cls2; blacks = b2; whites = w2;
        low = 0;
        for (let k = 0; k < N * N; k++) if (cls2.conf[k] < CONF_LOW) low++;
        stones = blacks + whites;
      }
    }
  }
  /* 这里不拦「零棋子」：拍一张空盘开局是合法操作（摆谱 App 的正常输入）。
   * 真正的防线在 runScanOnImageData：**当前已有棋谱**时识别出 0 子才拒
   * （几乎必然是拍错图/13 路盘硬套 15 路），空盘 + 空谱照常通过。
   * 噪声图混进来的防线在 scanFindGrid 的周期显著性守门（无周期纹理在那里
   * 就死，走不到这里）。 */
  if (stones >= 10 && Math.max(blacks, whites) > Math.min(blacks, whites) * 20)
    return { ok: false, reason: '黑白比例异常（' + blacks + ':' + whites + '），疑似误识别，请检查截图' };
  const kx = kDsX, ky = kDsY;
  return { ok: true, grid: cls.grid, conf: cls.conf, stats: { stones, blacks, whites, low },
           xs: useXs.map(v => (v + trimX) * kx), ys: useYs.map(v => (v + trimY) * ky) };
}
/* ---- 棋理自检+修正（2026-10-10 老板规则）----
 * 真实五子棋谱的黑白子数只能是 黑=白（轮黑）或 黑=白+1（轮白）——
 * 识别结果不在此范围 ⇒ **必有认反的子**（实证：棋谱 15/16 黄底最新手标号
 * 盖住的黑子被判白、user5/05 网格边缘偏移产生的假白，三张全违规）。
 * 修正 = 把**置信度最低**的子翻色（d<0 翻白→黑、d>1 翻黑→白），翻到数量
 * 落回合法范围。conf 就是为此准备的排序依据：错认子几乎总是最犹豫的那颗
 * （实证：15/16 唯一低置信 (11,9) conf 0.69，其余白全 1.0，翻它即合规）。
 * 返回：null=本就合法没动；{fixed, nb, nw}=翻了 fixed 颗；{fail}=该色子数
 * 不够翻（几乎不可能，防线而已，调用方拒识）。 */
function enforceBalance(grid, conf) {
  let nb = 0, nw = 0;
  for (let k = 0; k < N * N; k++) { if (grid[k] === BLACK) nb++; else if (grid[k] === WHITE) nw++; }
  const d = nb - nw;
  if (d === 0 || d === 1) return null;
  /* 幅度上限（v1.0.33 49 号实测）：黑白差 |d|>2 说明有系统性错误（暗角假子/
   * 漏子/非交替谱），翻色对账只会把真白子翻黑制造错盘面（49 实测：盘心亮度
   * 252/253 的两颗白瓷子被「索引序」翻成黑）。|d|≤4 = 个别颜色错，
   * 翻色后大部分可用（App 有摆色可人工改）；|d|>4 = 系统性错误 → fail
   * 拒识弹回，把错误暴露给用户。 */
  if (Math.abs(d) > 4) return { fail: true, nb, nw };
  /* 需要 k 颗翻色：d=-1→1、-2→1、-3→2、-4→2（每翻一颗白→黑 d+2）；
   * d=2→1、3→1、4→2（每翻一颗黑→白 d-2）。目标 d'∈{0,1}。 */
  const flipToBlack = d < 0;
  const k = flipToBlack ? Math.ceil(-d / 2) : Math.ceil((d - 1) / 2);
  const pool = [];
  for (let j = 0; j < N * N; j++) if (grid[j] === (flipToBlack ? WHITE : BLACK)) pool.push(j);
  if (pool.length < k) return { fail: true, nb, nw };
  /* 最犹豫的先翻；conf 并列（分类器全自信时常见）按索引序保证**确定性**——
   * 同一张图永远翻同一组子，可预测比随机好。 */
  pool.sort((a, b) => (conf[a] - conf[b]) || (a - b));
  for (let i = 0; i < k; i++) grid[pool[i]] = flipToBlack ? BLACK : WHITE;
  nb = 0; nw = 0;
  for (let j = 0; j < N * N; j++) { if (grid[j] === BLACK) nb++; else if (grid[j] === WHITE) nw++; }
  return { fixed: k, nb, nw };
}
/* 识别成功落地：替换盘面 → 直接可摆（**无校对态**，2026-10-03 老板指令：
 * 校对模式整个删除，识别结果默认就是正确的，不对再人工删子/补子）。
 * post() 一字不改：schedule(false) 因 analyzing=false 在 pump() 的
 * 「!S.ready || !S.analyzing」闸门处自然空转 —— 暂停语义复用同一道闸。 */
function applyScan(res) {
  /* 棋理修正已在 runScanOnImageData 里做完（必须在关 overlay 之前拦拒识），
   * stats 已按修正后数量更新 —— 修正动作不弹提示（2026-10-10 老板指令）。 */
  const mv = [];
  for (let k = 0; k < N * N; k++) if (res.grid[k]) mv.push({ x: k % N, y: (k / N) | 0, c: res.grid[k], q: 1 });
  mv.sort((a, b) => a.c - b.c || a.y - b.y || a.x - b.x);   // 黑组→白组，组内 y,x（确定性序）
  S.moves = mv; S.cursor = mv.length;
  /* 识别子 = **底图**，不是棋谱（2026-10-10 老板指令「识谱之后不要自定义顺序」）：
   * 识别序（黑组→白组）不是真实落子序，对它前进/后退毫无意义 —— scanBase 记住
   * 底图子数：手数读数从 0/0 起、后退被 clamp 在底图之上（回放只作用于手摆的
   * 棋谱）、下一手序号从 1 起。识别序从此不可见。 */
  S.scanBase = mv.length;
  /* seg 初值 = 按识别出的黑白数量推交替推算值（黑=白 → 黑）。识别导入的子
   * 带 q:1 不占号，之后手摆的第一手序号 = 1。seg 显示的就是「下一手要摆的
   * 颜色」：按盘面差值自动推算（2026-10-10 强改退役）。 */
  S.scanFreeColor = scanNextDefault(res.stats.blacks, res.stats.whites);
  S.scanBusy = false;
  const wasAna = S.analyzing;
  S.analyzing = false;                 // 识别导入 = 摆谱动作；开不开始终由用户手动决定
  save(); post();
  /* 正在算的那一轮必须**真的**停手：上面的 post() 只是不再排**下一**轮
   * （analyzing=false 让 schedule 在 pump() 闸门处空转），而无限分析下的
   * **当前**轮不会自己结束 —— 不 stop 的话引擎继续满速算一个已经没人看的
   * 局面：界面数字被输出闸门挡住不跳，但 CPU 白烧、电池白耗，用户还以为停了。
   * 复用与「暂停」/「退后台」同一条被断言过的路径（stopAnalysisNow），
   * 不另写一份 —— 那条路径的收支账本已被 D3 节与 verify_apk 钉死。 */
  if (wasAna) stopAnalysisNow();
  /* 识别成功**不弹任何提示**（老板 v1.0.25：识别后下面不要弹提示词）——
   * 盘面变化本身就是最直白的反馈；失败路径的 toast 保留（报错必须看得见）。
   * 棋理修正也**不弹**（2026-10-10 老板指令「不要弹提示」）：修正照做
   * （盘面数量落回合法），只是不吭声 —— 与识别成功不弹同一条纪律。 */
}
/* dataURL → ImageData（浏览器/preview 路径；App 里 Java 已给 base64 同样走这） */
function decodeImageDataUrl(url, cb) {
  const im = new Image();
  im.onload = () => {
    try {
      const c = document.createElement('canvas');
      c.width = im.naturalWidth; c.height = im.naturalHeight;
      const cx = c.getContext('2d');
      cx.drawImage(im, 0, 0);
      cb(cx.getImageData(0, 0, c.width, c.height));
    } catch (e) {
      S.scanBusy = false; toast('图片解码失败');
    }
  };
  im.onerror = () => { S.scanBusy = false; toast('图片解码失败，请换一张图'); };
  im.src = url;
}
function handleImageData(im) {
  /* 解码完成不再直接识别 —— 先进「调整」overlay：真实照片自动找网格不可靠
   * （透视/背景杂物/拍不全），「棋盘在哪」由用户框出来，算法只管框内那块。
   * 识别被挪到 adjConfirm() → runScanOnImageData()。 */
  scanAdjOpen(im);
}
/* 框选确认后的识别 + 落地。识别失败**不关** overlay：用户看着原因调框重试，
 * 比退出去重新选图再框一遍友好得多。 */
function runScanOnImageData(im) {
  let res = scanImageArb(im);   // 缩放图多尺寸仲裁（短边 <660 才有放大档竞争）
  /* 条件「零棋子拒识」（2026-10-03）：空盘本身是合法输入（见 scanClassify 尾部
   * 注释），但**当前已有棋谱**时识别出 0 子几乎必然是拍错图/13 路盘硬套 15 路
   * （v1.0.28 preview ⑧ 实证：13 路空盘被当合法空 15 路盘接受，applyScan 直接
   * 清掉用户 9 手棋谱）。此时拒识、保留原谱、overlay 弹回让人调框重试；真想
   * 摆空盘的用户先清空即可（清空按钮就在旁边，成本极低）。 */
  if (res.ok && res.stats.stones === 0 && S.moves.length > 0)
    res = { ok: false, reason: '网格已定位但未识别到任何棋子；当前棋谱已保留，若要导入空盘请先清空' };
  /* 棋理强改已移除（v1.0.33 49/29 双实测）：识别 raw 本来就对（49 的 36 颗
   * 颜色全对、29 的 46 颗全对位），强改反而把真白子翻黑制造错盘面（49 实测
   * 盘心 252/253 的白瓷子被「索引序」翻黑）。教学视频盘/自由摆谱的黑白数量
   * 本就不符合交替谱——棋理假设只对正式对局成立。黑白数量在 seg 与盘面上
   * 如实显示，用户自行判断；「下哪里」的交替推算（scanNextDefault）保留。
   * enforceBalance 函数保留（不再接线），供后续按图分类启用。 */
  if (!res.ok) { toast(res.reason); scanAdjShow(true); return; }
  scanAdjClose();
  applyScan(res);
}

/* ---------- 前进 / 后退 / 清空 ----------
 * 游标 S.cursor = 当前看到第几手。棋盘、胜负、禁手、以及送给引擎的盘面全部
 * 只看前 cursor 手，所以后退一格就是真的在分析「那一手刚下完」的局面。
 * 旧版只有一个「悔棋」= 把手删掉，删了就回不去；摆谱复盘真正要的是**来回看**。
 * 注意前进/后退只动游标、绝不动 S.moves —— 完整棋谱必须留着，否则回不去。 */
$('#btnPrev').onclick = () => { if (S.cursor > S.scanBase) { S.cursor--; post(); } };
$('#btnNext').onclick = () => { if (S.cursor < S.moves.length) { S.cursor++; post(); } };
$('#btnClear').onclick = () => { S.moves = []; S.cursor = 0; S.scanBase = 0; S.scanFreeColor = null; post(); };

/* ---------- 识谱：选图 → 识别 → 直接落盘（无校对态） ----------
 * 「分析不自动开」是老板指令：识别导入只是摆谱，开始分析必须用户手动点。 */
let scanBusyT = null;
function scanBusyOff() { clearTimeout(scanBusyT); S.scanBusy = false; }
$('#btnScan').onclick = () => {
  if (S.scanBusy) return;
  S.scanBusy = true;
  /* 8s 自动解锁：用户在系统选图器里按「取消」时，原生路径不产生任何回调，
   * 没有这条的话 busy 锁会把识谱按钮永久焊死。 */
  clearTimeout(scanBusyT); scanBusyT = setTimeout(scanBusyOff, 8000);
  $('#fileScan').click();
};
$('#fileScan').onchange = () => {
  scanBusyOff();
  if (HAS_NATIVE()) return;    // 原生环境由 Java chooser 接管，防个别 WebView 双触发
  const f = $('#fileScan').files && $('#fileScan').files[0];
  $('#fileScan').value = '';   // 清掉，允许下次选同一张
  if (!f) return;
  const r = new FileReader();
  r.onload = () => decodeImageDataUrl(r.result, handleImageData);
  r.onerror = () => { scanBusyOff(); toast('读取图片失败'); };
  r.readAsDataURL(f);
};

/* ---------- 识谱调整 overlay：任意角度旋转 / 捏合缩放 / 平移 / 框选 ----------
 * 为什么要有这一步：自动识别对「棋盘占满画面、正视、背景干净」的截图才可靠，
 * 真实照片全占不着 —— 老板的实测结论是「完全识别不了」。正解不是继续调算法，
 * 而是把最不确定的「棋盘在哪」交给用户：框出来（可旋转、可缩放），算法只做
 * 框内那块的网格定位与黑白分类，成功率与框选质量线性相关。
 *
 * 坐标系分三层，确认时逐层换算回原图像素：
 *   原图 (x0,y0) --旋转 θ--> 旋转后 (u,v) --pan/zoom--> 屏幕 (sx,sy)
 * (u,v) 系的原点 = 旋转包围盒左上角，且与屏幕始终平行 —— 框存 (u,v) 系的
 * 轴对齐矩形，屏幕上永远是正矩形，用户框得住转正后的棋盘。
 * 旋转是任意角度（滑条 ±90° + 双指转动）：斜着拍的照片 90° 步进救不了。
 * v1.0.20 的教训：它的 90° 显示变换把图画在负象限（点 ↻ 图就飞出屏幕），
 * 而确认裁剪是独立重算的所以测试全绿 —— 显示与识别必须走同一套变换。 */
const AJ = {
  on: false, img: null, rotDeg: 0,    // 旋转角（度，归一化到 (-180,180]）
  panX: 0, panY: 0, zoom: 1,          // pan = 包围盒左上角的屏幕位置
  crop: { x: 0, y: 0, w: 0, h: 0 },   // 旋转后坐标系
  cv: null, cx: null, dpr: 1,
  rotSnap: null,        // 旋转起点快照 {deg,crop}：拖动中从起点整体重算，防逐步膨胀滚雪球
};
function normDeg(d) { return ((d + 180) % 360 + 360) % 360 - 180; }
function bboxAt(deg) {
  /* 任意角度下「图旋转后」的轴对齐包围盒（中心 = 图中心） */
  const t = Math.abs(Math.sin(deg * Math.PI / 180)), c = Math.abs(Math.cos(deg * Math.PI / 180));
  return { w: AJ.img.width * c + AJ.img.height * t, h: AJ.img.width * t + AJ.img.height * c };
}
function adjBBox() { return bboxAt(AJ.rotDeg); }
function adjRotRad() { return AJ.rotDeg * Math.PI / 180; }
/* 图内坐标 → 旋转后坐标：相对图中心旋转 θ，再平移到包围盒中心 */
function adjImgToUv(x, y) {
  const B = adjBBox(), th = adjRotRad(), c = Math.cos(th), s = Math.sin(th);
  const dx = x - AJ.img.width / 2, dy = y - AJ.img.height / 2;
  return { u: dx * c - dy * s + B.w / 2, v: dx * s + dy * c + B.h / 2 };
}
/* 旋转后坐标 (u,v) → 图内坐标（deg 可指定角度：旋转快照反解用） */
function adjUvToImg(u, v, deg) {
  const B = bboxAt(deg), th = deg * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);
  const dx = u - B.w / 2, dy = v - B.h / 2;
  return { x: dx * c + dy * s + AJ.img.width / 2, y: -dx * s + dy * c + AJ.img.height / 2 };
}
/* 屏幕点 → 图内坐标（逆变换，锚定用） */
function adjScreenToImg(sx, sy) {
  return adjUvToImg((sx - AJ.panX) / AJ.zoom, (sy - AJ.panY) / AJ.zoom, AJ.rotDeg);
}
function scanAdjOpen(im) {
  /* 浏览器/原生两条解码路径回传的都是 ImageData，而 drawImage 不吃它 ——
   * 转成 canvas 当图源（ImageData → putImageData 一次，无损）。 */
  if (im.data && im.width && im.height) {
    const c = document.createElement('canvas');
    c.width = im.width; c.height = im.height;
    c.getContext('2d').putImageData(im, 0, 0);
    im = c;
  }
  AJ.on = true; AJ.img = im; AJ.rotDeg = 0; AJ.rotSnap = null;
  AJ.cv = $('#adjCv'); AJ.cx = AJ.cv.getContext('2d');
  AJ.dpr = Math.min(2, window.devicePixelRatio || 1);
  clearTimeout(scanBusyT);            // overlay 可能开着远超 8s：busy 由确认/取消负责
  S.scanBusy = true;
  scanAdjShow(true);
  adjFitAll();
  adjBind();
}
function scanAdjShow(on) {
  const el = $('#scanAdj');
  el.style.display = on ? 'flex' : 'none';
  if (on) { requestAnimationFrame(adjPaint); }   // 等布局生效后再量尺寸绘制
}
function scanAdjClose() {
  scanAdjShow(false);
  AJ.on = false; AJ.img = null;
  scanBusyOff();
}
/* 视图适配：缩放适配屏幕、居中、框=整张旋转包围盒的**内切正方形**（框恒正方，
 * 老板指令：棋盘是方的，框固定正方形 —— 网格占比横竖一致识别也更稳）。保留当前旋转角。 */
function adjFitAll() {
  const B = adjBBox();
  const cw = AJ.cv.clientWidth || window.innerWidth;
  const chh = AJ.cv.clientHeight || window.innerHeight - 100;
  AJ.zoom = Math.min(cw / B.w, chh / B.h) * 0.92;
  AJ.panX = (cw - B.w * AJ.zoom) / 2;
  AJ.panY = (chh - B.h * AJ.zoom) / 2;
  const s = Math.min(B.w, B.h);
  AJ.crop = { x: (B.w - s) / 2, y: (B.h - s) / 2, w: s, h: s };
  AJ.rotSnap = null;
  syncRotUI();
  adjPaint();
}
/* 转到目标角度（度）。框从「旋转起点快照」整体重算而非增量转 —— 每步 0.5°
 * 的轴对齐包围膨胀若逐次累积会滚雪球；从起点一次算到位，90° 整图框恰好转置。
 * 图上被框住的内容跟着图转（四角的图点不变），锚点钉在屏幕原位（缺省=图中心），
 * 图不跳。zoom 传入时同时缩放（pinch 复用这条路径）。 */
function adjSetRotTo(deg, zoom, anchorImg, anchorS) {
  const src = AJ.rotSnap || { deg: AJ.rotDeg, crop: { x: AJ.crop.x, y: AJ.crop.y, w: AJ.crop.w, h: AJ.crop.h } };
  /* 缺省锚 = 快照框中心的图点，钉在当前框中心屏幕位 —— 转角度时框不动、
   * 图围着框转。锚图中心的话框偏在一边时内容会绕着走（老板报的「调整时
   * 图片还会移动」），锚框中心才符合「框住棋盘后微调角度」的直觉。 */
  if (anchorImg == null) {
    const su = src.crop.x + src.crop.w / 2, sv = src.crop.y + src.crop.h / 2;
    anchorImg = adjUvToImg(su, sv, src.deg);
  }
  if (anchorS == null) {
    const cu = AJ.crop.x + AJ.crop.w / 2, cvv = AJ.crop.y + AJ.crop.h / 2;
    anchorS = { x: AJ.panX + cu * AJ.zoom, y: AJ.panY + cvv * AJ.zoom };
  }
  if (zoom != null) {
    const fit = adjFitZoom();
    AJ.zoom = Math.max(fit * 0.5, Math.min(fit * 10, zoom));
  }
  const th0 = src.deg * Math.PI / 180, B0 = bboxAt(src.deg);
  const th1 = deg * Math.PI / 180, B1 = bboxAt(deg);
  const c0 = Math.cos(th0), s0 = Math.sin(th0), c1 = Math.cos(th1), s1 = Math.sin(th1);
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for (const [u, v] of [[src.crop.x, src.crop.y],
                        [src.crop.x + src.crop.w, src.crop.y],
                        [src.crop.x, src.crop.y + src.crop.h],
                        [src.crop.x + src.crop.w, src.crop.y + src.crop.h]]) {
    const dx = u - B0.w / 2, dy = v - B0.h / 2;    // → 起点系里相对图中心
    const px = dx * c0 + dy * s0, py = -dx * s0 + dy * c0;
    const nu = px * c1 - py * s1 + B1.w / 2;        // → 新 (u,v)
    const nv = px * s1 + py * c1 + B1.h / 2;
    if (nu < minX) minX = nu; if (nu > maxX) maxX = nu;
    if (nv < minY) minY = nv; if (nv > maxY) maxY = nv;
  }
  AJ.rotDeg = normDeg(deg);
  AJ.crop = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  adjClampCrop();
  /* 锚点的图点显示在锚屏幕点：pan = 锚屏幕 - 图点(u,v)×zoom */
  const uv = adjImgToUv(anchorImg.x, anchorImg.y);
  AJ.panX = anchorS.x - uv.u * AJ.zoom;
  AJ.panY = anchorS.y - uv.v * AJ.zoom;
  syncRotUI();
  adjPaint();
}
function syncRotUI() {
  /* 手势转出的角度可超出 ±90°：滑条顶格，数值显示真实角度（点它回正） */
  const sl = $('#adjRotSlider');
  if (sl) sl.value = Math.max(-90, Math.min(90, AJ.rotDeg));
  setText('#adjRotVal', Math.round(AJ.rotDeg) + '°');
}
function adjClampCrop() {
  const B = adjBBox(), c = AJ.crop;
  /* 框恒正方（老板指令）：边长 = 四个约束取最小。正方形框旋转后的 AABB
   * 数学上恒正方（边·(|cosθ|+|sinθ|)），所以这条约束全链路自洽。 */
  c.w = c.h = Math.max(32, Math.min(c.w, c.h, B.w, B.h));
  c.x = Math.max(0, Math.min(c.x, B.w - c.w)); c.y = Math.max(0, Math.min(c.y, B.h - c.h));
}
/* 框的屏幕矩形（pan/zoom 只作用于显示，crop 始终存图片坐标） */
function adjCropScreen() {
  const c = AJ.crop;
  return { x: AJ.panX + c.x * AJ.zoom, y: AJ.panY + c.y * AJ.zoom,
           w: c.w * AJ.zoom, h: c.h * AJ.zoom };
}
function adjPaint() {
  if (!AJ.on || !AJ.img) return;
  const cv = AJ.cv, cx = AJ.cx, dpr = AJ.dpr;
  const cw = cv.clientWidth || window.innerWidth, chh = cv.clientHeight || 500;
  const W = Math.round(cw * dpr), H = Math.round(chh * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.fillStyle = '#141311'; cx.fillRect(0, 0, cw, chh);
  cx.save();
  cx.translate(AJ.panX, AJ.panY); cx.scale(AJ.zoom, AJ.zoom);
  /* 图中心画在包围盒中心（bboxAt 与确认裁剪共用同一套数学）——
     v1.0.20 把图画在负象限导致点旋转后图飞出屏幕的教训。 */
  const B = adjBBox();
  cx.translate(B.w / 2, B.h / 2); cx.rotate(AJ.rotDeg * Math.PI / 180);
  cx.drawImage(AJ.img, -AJ.img.width / 2, -AJ.img.height / 2);
  cx.restore();
  // 框外压暗：四块半透明，框内保持原样
  const s = adjCropScreen();
  cx.fillStyle = 'rgba(0,0,0,.55)';
  cx.fillRect(0, 0, cw, s.y);
  cx.fillRect(0, s.y + s.h, cw, chh - s.y - s.h);
  cx.fillRect(0, s.y, s.x, s.h);
  cx.fillRect(s.x + s.w, s.y, cw - s.x - s.w, s.h);
  // 边框 + 三分参考线（对齐棋盘边线用）
  cx.strokeStyle = '#fff'; cx.lineWidth = 1.5;
  cx.strokeRect(s.x, s.y, s.w, s.h);
  cx.strokeStyle = 'rgba(255,255,255,.25)'; cx.lineWidth = 1;
  for (const k of [1 / 3, 2 / 3]) {
    cx.beginPath(); cx.moveTo(s.x + s.w * k, s.y); cx.lineTo(s.x + s.w * k, s.y + s.h); cx.stroke();
    cx.beginPath(); cx.moveTo(s.x, s.y + s.h * k); cx.lineTo(s.x + s.w, s.y + s.h * k); cx.stroke();
  }
  // 四角手柄：L 形粗线，移动端热区靠命中半径保证（见 adjHit）
  cx.strokeStyle = '#ffd54a'; cx.lineWidth = 4; cx.lineCap = 'round';
  const L = Math.min(26, Math.max(14, Math.min(s.w, s.h) * 0.2));
  for (const [px, py, dx, dy] of [[s.x, s.y, 1, 1], [s.x + s.w, s.y, -1, 1],
                                  [s.x, s.y + s.h, 1, -1], [s.x + s.w, s.y + s.h, -1, -1]]) {
    cx.beginPath();
    cx.moveTo(px + dx * L, py); cx.lineTo(px, py); cx.lineTo(px, py + dy * L);
    cx.stroke();
  }
}
/* 命中测试：返回 'tl'/'tr'/'bl'/'br'（调框）/'in'（移框）/null（平移图片）。
 * 命中半径 28px 不随 zoom 缩——手指粗细是物理量。 */
function adjHit(sx, sy) {
  const s = adjCropScreen(), R = 28;
  const corners = [[s.x, s.y, 'tl'], [s.x + s.w, s.y, 'tr'], [s.x, s.y + s.h, 'bl'],
                   [s.x + s.w, s.y + s.h, 'br']];
  for (const [px, py, id] of corners)
    if (Math.abs(sx - px) <= R && Math.abs(sy - py) <= R) return id;
  if (sx > s.x && sx < s.x + s.w && sy > s.y && sy < s.y + s.h) return 'in';
  return null;
}
/* 把屏幕 delta 换成 (u,v) delta。(u,v) 系相对屏幕平行，但图在里面转了 θ ——
 * 拖框方向必须按 R(-θ) 逆旋转，否则斜角下拖角手柄是斜着走的（v1.0.20 漏了）。 */
/* 拖角缩放的会话状态：锚（对角点，(u,v) 系）+ 指针起点 (u,v) + 累计位移 */
let adjSq = null;
function adjDrag(mode, dx, dy) {
  const c = AJ.crop, th = adjRotRad(), co = Math.cos(th), si = Math.sin(th);
  const du = (dx * co + dy * si) / AJ.zoom, dv = (-dx * si + dy * co) / AJ.zoom;
  if (mode === 'in') {
    c.x += du; c.y += dv;
  } else if (adjSq) {
    /* 框恒正方（老板指令）：边长 = 锚到指针的带符号分量取 max ——
     * 无论往哪个方向拖都有跟手反馈，且 w=h 永不破坏。 */
    adjSq.du += du; adjSq.dv += dv;
    const up = adjSq.px + adjSq.du, vp = adjSq.py + adjSq.dv;
    let s;
    if (mode === 'tl') s = Math.max(adjSq.ax - up, adjSq.ay - vp);
    else if (mode === 'tr') s = Math.max(up - adjSq.ax, adjSq.ay - vp);
    else if (mode === 'bl') s = Math.max(adjSq.ax - up, vp - adjSq.ay);
    else s = Math.max(up - adjSq.ax, vp - adjSq.ay);
    const B = adjBBox();
    s = Math.max(32, Math.min(s, Math.min(B.w, B.h)));
    if (mode.includes('l')) c.x = adjSq.ax - s;
    if (mode.includes('t')) c.y = adjSq.ay - s;

let adjPtrs = new Map(), adjMode = null, adjPinch = null;
/* 拖角缩放的会话初始化：锚（对角点）+ 指针起点，均为 (u,v) 系坐标 */
function adjSqStart(mode, sx, sy) {
  if (!mode || mode === 'in') { adjSq = null; return; }
  const c = AJ.crop;
  const pImg = adjScreenToImg(sx, sy);
  const pUv = adjImgToUv(pImg.x, pImg.y);
  adjSq = {
    ax: mode.includes('l') ? c.x + c.w : c.x,
    ay: mode.includes('t') ? c.y + c.h : c.y,
    px: pUv.u, py: pUv.v, du: 0, dv: 0
  };
}
function adjBind() {
  if (AJ.cv.dataset.bound) return;     // 只绑一次（AJ.cv 每次打开都取同一元素）
  AJ.cv.dataset.bound = '1';
  const pos = e => ({ x: e.clientX, y: e.clientY });
  AJ.cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    /* 合成事件（自动化测试）与已释放指针会让 setPointerCapture 抛 NotFoundError：
     * 捕获不影响真实手势（真指针必然捕获成功），只是别让异常断掉后续记账。 */
    try { AJ.cv.setPointerCapture(e.pointerId); } catch (_) {}
    adjPtrs.set(e.pointerId, pos(e));
    if (adjPtrs.size === 1) {
      adjMode = adjHit(e.clientX, e.clientY);
      adjSqStart(adjMode, e.clientX, e.clientY);   // 拖角缩放（等比正方）会话
    }
    if (adjPtrs.size === 2) {          // 进入捏合：只缩放+平移 —— 旋转只在滑条（老板指令：
      const [a, b] = [...adjPtrs.values()];   // 「缩放的时候也会旋转这是我不想要的」）
      const cx0 = (a.x + b.x) / 2, cy0 = (a.y + b.y) / 2;
      const pImg = adjScreenToImg(cx0, cy0);
      adjPinch = { d: Math.hypot(a.x - b.x, a.y - b.y), zoom: AJ.zoom,
                   uv0: adjImgToUv(pImg.x, pImg.y),   // 锚定图点的 (u,v)，缩放中恒定
                   sq: adjCropScreen() };   // 框的屏幕矩形快照：捏合期间钉死（v1.0.25）

    const dx = p.x - prev.x, dy = p.y - prev.y;
    adjPtrs.set(e.pointerId, p);
    if (adjPtrs.size === 2 && adjPinch) {
      const [a, b] = [...adjPtrs.values()];

      const fit = adjFitZoom();
      AJ.zoom = Math.max(fit * 0.5, Math.min(fit * 10, adjPinch.zoom * d / adjPinch.d));
      /* 锚定的图点保持在两指中心：pan = 中心屏幕 - 图点(u,v)×zoom（不转角度） */

      AJ.panX = ncx - adjPinch.uv0.u * AJ.zoom;
      AJ.panY = ncy - adjPinch.uv0.v * AJ.zoom;
      /* 框钉屏（老板 v1.0.25：框大小不变，只有图片放大缩小）：框的屏幕矩形恒等于
       * 快照，图片坐标里的框按视图反算 —— 图在框下面缩放平移，取景框不再跟着图走。
       * 只有缩得比整图还小（框会罩到图外）才被 adjClampCrop 收回来。 */
      AJ.crop.w = AJ.crop.h = adjPinch.sq.w / AJ.zoom;
      AJ.crop.x = (adjPinch.sq.x - AJ.panX) / AJ.zoom;
      AJ.crop.y = (adjPinch.sq.y - AJ.panY) / AJ.zoom;
      adjClampCrop();
      adjPaint();
      return;
    }
    if (adjMode === 'pinch' || !adjMode) {     // 平移图片
      AJ.panX += dx; AJ.panY += dy; adjPaint();
    } else adjDrag(adjMode, dx, dy);
  });
  const up = e => {
    adjPtrs.delete(e.pointerId);
    if (adjPtrs.size === 0) { adjMode = null; adjPinch = null; AJ.rotSnap = null; adjSq = null; }
    else if (adjPtrs.size === 1) {
      adjPinch = null; AJ.rotSnap = null;
      const [p] = [...adjPtrs.values()];
      adjMode = adjHit(p.x, p.y);
      adjSqStart(adjMode, p.x, p.y);
    }
  };
  AJ.cv.addEventListener('pointerup', up);
  AJ.cv.addEventListener('pointercancel', up);
  AJ.cv.addEventListener('wheel', e => {       // 桌面滚轮缩放（以光标为锚）
    e.preventDefault();
    const fit = adjFitZoom();
    const k = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const nz = Math.max(fit * 0.5, Math.min(fit * 10, AJ.zoom * k));
    const sq = adjCropScreen();                // 框钉屏：与捏合同一条规矩（v1.0.25）
    AJ.panX = e.clientX - (e.clientX - AJ.panX) * nz / AJ.zoom;
    AJ.panY = e.clientY - (e.clientY - AJ.panY) * nz / AJ.zoom;
    AJ.zoom = nz;
    AJ.crop.w = AJ.crop.h = sq.w / nz;
    AJ.crop.x = (sq.x - AJ.panX) / nz;
    AJ.crop.y = (sq.y - AJ.panY) / nz;
    adjClampCrop(); adjPaint();
  }, { passive: false });
}
function adjFitZoom() {
  const B = adjBBox();
  const cw = AJ.cv.clientWidth || window.innerWidth;
  const chh = AJ.cv.clientHeight || window.innerHeight - 100;
  return Math.min(cw / B.w, chh / B.h);
}
$('#adjRotSlider').addEventListener('input', e => {
  if (!AJ.rotSnap) AJ.rotSnap = { deg: AJ.rotDeg, crop: { x: AJ.crop.x, y: AJ.crop.y, w: AJ.crop.w, h: AJ.crop.h } };
  adjSetRotTo(parseFloat(e.target.value));
});
$('#adjRotSlider').addEventListener('change', () => { AJ.rotSnap = null; });
$('#adjRotVal').onclick = () => { AJ.rotSnap = null; adjSetRotTo(0); toast('已回正 0°'); };
$('#adjFull').onclick = () => adjFitAll();
$('#adjCancel').onclick = () => { scanAdjClose(); toast('已取消识谱'); };
$('#adjOk').onclick = adjConfirm;
window.addEventListener('resize', () => { if (AJ.on) adjPaint(); });

function adjConfirm() {
  if (!AJ.img) return;
  const btn = $('#adjOk');
  btn.disabled = true; btn.textContent = '识别中…';    // 点击必有反馈，绝不静默
  try {
    /* 三层变换的合成直接在 ≤720 的小画布上做：先 translate 到框左上、再转出
     * 「图绕包围盒中心旋转 θ」—— 与 adjPaint 的显示变换同一套数学。
     * 不建全尺寸旋转画布：12MP 照片在 45° 下包围盒 ~5000px，会超部分 WebView
     * 的 canvas 尺寸上限 → 静默黑图，正是真机「点识别没反应」的候选根因之一。 */
    const iw = AJ.img.width, ih = AJ.img.height;
    const B = adjBBox(), th = adjRotRad();
    const c = AJ.crop, cw = Math.max(1, Math.round(c.w)), ch = Math.max(1, Math.round(c.h));
    const k = Math.min(1, 720 / Math.max(cw, ch));
    const c2 = document.createElement('canvas');
    c2.width = Math.max(1, Math.round(cw * k)); c2.height = Math.max(1, Math.round(ch * k));
    const g2 = c2.getContext('2d');
    g2.translate(-c.x * k, -c.y * k); g2.scale(k, k);
    g2.translate(B.w / 2, B.h / 2); g2.rotate(th);
    g2.drawImage(AJ.img, -iw / 2, -ih / 2);
    const d = g2.getImageData(0, 0, c2.width, c2.height);
    AJ.rotSnap = null;
    scanAdjShow(false);                // 藏起 overlay 但保持 busy：失败要回来重试
    runScanOnImageData(d);
  } catch (err) {
    toast('识别出错：' + (err && err.message ? err.message : err));
    scanAdjShow(true);
  } finally {
    btn.disabled = false; btn.textContent = '识别此区域';
  }
}

/* ---------- 下一手（黑先/白先）----------
 * 识别导入后的下一手摆色 = 按识别出的黑白数差推算 —— 「黑=白 → 轮黑、
 * 黑=白+1 → 轮白」正是棋理上唯一合法的下一手（2026-10-10 老板确认识别
 * 结果总在此范围内）。applyScan 置初值，onTap 摆完/删子按新盘面重推，
 * 全部走这一个函数 —— 推算来源唯一，seg 纯显示、不可强改
 *（2026-10-10 老板指令「还是不要有强行改变黑白子的方式和视角和胜率了」）。
 * 旧的「补色锚定推导」与「差值合法性」拦截已退役 —— 报数（#scanCnt）让用户
 * 自己掌握差值，识别错了老板说一声再改。 */
function scanNextDefault(b, w) {
  const d = b - w;
  if (d === 0) return BLACK;         // 黑=白 → 轮黑
  if (d === 1) return WHITE;         // 黑=白+1 → 轮白
  return d > 1 ? WHITE : BLACK;      // 差值异常（漏识别）：取能把盘面拉回合法的方向
}
/* 识别模式下「下一手摆色」永远跟随**当前显示盘面**（游标之前）的黑白数差。
 * 收进 post() 统一算（2026-10-10 全面检查修的 bug）：旧版只在摆子/删子后重算，
 * **后退/前进**后 seg 显示、摆色、引擎轮次全与所见盘面脱节——3黑3白识别后
 * 后退一手变 3黑2白，按差值该轮白，seg 却还亮黑、引擎还按黑方算。
 * scanFreeColor==null（普通模式/没识别过）保持 null，按手数交替不变。 */
function syncScanFree() {
  if (S.scanFreeColor == null) return;
  let nb = 0, nw = 0;
  for (let i = 0; i < S.cursor; i++) {
    const m = S.moves[i];
    if (m.c === BLACK) nb++; else if (m.c === WHITE) nw++;
  }
  S.scanFreeColor = scanNextDefault(nb, nw);
}

/* ---------- 设置按钮 ---------- */
function bindSeg() {
  document.querySelectorAll('#segEngine button').forEach(b => {
    b.classList.toggle('on', b.dataset.v === S.engine);
    b.onclick = () => {
      if (b.dataset.v === S.engine) {
        /* 点的就是当前引擎：平时是无效操作，但引擎已经死了的话，这就是**手动重启**
         * 的入口 —— 崩溃自愈连坏 3 次升级成硬错误后，用户总得有一条伸手就能够到
         * 的恢复路（以前只能「切到另一台再切回来」，根本想不到）。 */
        if (!S.ready) restartEngine();
        return;
      }
      S.engine = b.dataset.v;
      save();
      bindSeg();
      restartEngine();
    };
  });
  document.querySelectorAll('#segRule button').forEach(b => {
    b.classList.toggle('on', +b.dataset.v === S.rule);
    b.onclick = () => {
      if (+b.dataset.v === S.rule) return;
      S.rule = +b.dataset.v;
      save(); bindSeg();
      S.cands = []; S.root = null; S.depth = 0; S.nodes = 0; S.nps = 0;  // 规则变了，旧估值作废
      S.accept = false;              // 同理：旧规则下的输出也不能再收
      rebuild(); refreshForbid(); paint(true);
      /* 关键：**不要**在这里直接 drv().syncRule()。
       * Rapfi 思考期间会静默丢弃除 STOP 外的一切命令（gomocup.cpp:801-805），
       * 而此刻它几乎一定在跑无限搜索 —— 于是 INFO RULE 被丢掉、规则压根没变，
       * 表现就是「切换有无禁手，棋盘上的估值没有变化」。
       * 改规则由 pump() → interrupt 回调里的 applyRuleIfNeeded() 在**引擎空闲后**下发。
       * Rapfi 不用重启：规则是运行时 INFO RULE 切的（虽会清盘，但紧接着的
       * YXBOARD 会重放）。 */
      /* KataGo 则**要**重启 —— 这是换 b10 之后新增的唯一例外。
       * 它的两份网按规则分开（b10r 连珠 / b10f 无禁手），而 -model 只能在进程
       * 启动时给，运行时没有换网的办法（kata-set-rule 只管规则、换不了权重文件）。
       * b28 时代之所以能「不重启」，正是因为那一份 269MB 的网自己同时支持两种规则。
       * 不重启的话会拿连珠网去算无禁手（或反过来），而且**完全静默** —— 用户只会
       * 觉得「换了禁手之后棋力怪怪的」，跟当初「KataGo 下面什么都没有」是同一类
       * 「不报错的错」。两份网各约 6MB，重开很快，这个代价可以接受。 */
      if (S.engine === 'kata' && kataModel() !== kataNetLoaded) { restartEngine(); return; }
      schedule(true);
      uiAll(); uiStatus();
    };
  });
  $('#topNMinus').onclick = () => bumpTopN(-1);
  $('#topNPlus').onclick = () => bumpTopN(+1);
  syncTopN();
}

/* ---------- 界面刷新 ---------- */
let uiT = null;
function scheduleUI() { if (uiT) return; uiT = requestAnimationFrame(() => { uiT = null; uiAll(); }); }

/* 状态栏（#stSub 那行「引擎名 · 深度 · 节点 · nps」）的**降频**刷新。
 *
 * 为什么需要它：Rapfi 深度计算时，**每加深一层**会连着吐出
 *   INFO DEPTH / INFO SELDEPTH / INFO TOTALNODES / INFO MESSAGE
 * 四条都会调 uiStatus()（见解析器里那四个分支）。实测一轮迭代 11 行 INFO、
 * 一次分析录到 58 轮迭代 → 状态栏要整行重建并重排 **200 次以上**，
 * 而这些数字在两次迭代之间根本来不及看清。手机上就表现成
 * 「深度和节点动得特别慢、卡卡的」—— 其实不是引擎慢，是界面在拿
 * 同一行文字反复重排，把主线程占住了，反过来拖慢了输出的消费。
 *
 * 这里用「时间闸 + 尾随补刷」而不是简单的丢掉：
 *   - 距上次刷新不足 STATUS_MIN_MS → 只记一个待办（合并掉这一批）；
 *   - 到点后**一定**再刷一次，所以深度停在某个值上时，最终显示是对的，
 *     不会出现「最后一个数字被节流吃掉、界面永远停在旧值」。
 * 注意 uiStatus() 本身**不能**改成节流：它还有 8 处同步调用点
 * （启动、切引擎、清空、自愈提示、KataGo 首帧…），那些是状态变化，
 * 必须立刻可见。所以只在「引擎连续吐数字」这条路上降频。 */
let statusT = null, statusAt = 0;
const STATUS_MIN_MS = 120;      // 约 8 次/秒：比人眼能读的快得多，又足够便宜
function scheduleStatus() {
  const now = performance.now();
  const wait = statusAt + STATUS_MIN_MS - now;
  if (wait <= 0) {
    // 到点了，直接刷（并取消可能挂着的待办，避免重复）
    if (statusT) { clearTimeout(statusT); statusT = null; }
    statusAt = now;
    uiStatus();
    return;
  }
  if (statusT) return;          // 已有待办，合并
  statusT = setTimeout(() => { statusT = null; statusAt = performance.now(); uiStatus(); }, wait);
}
function uiAll() {
  /* 这个函数每收到一批引擎输出就会被调用（见 scheduleUI），所以 DOM 只在
   * **真的变了**的时候才写。无脑写 innerHTML / className 会让浏览器反复重建
   * 文本节点、重算样式并触发重排 —— 在手机这种低端渲染管线上，这本身就会
   * 表现成抖动，跟画布重画叠加起来就是用户说的「总闪烁」。 */
  /* 终局三分支（2026-10-10 老板指令）：恰五=「X方连五」（画横线）；黑长连=
   * 「黑方长连」（禁手判负，不画横线）；禁手落子=「黑方禁手」（同上）。
   * 都是 4 字，#turnTag 定宽 66px 不抖。 */
  const turn = S.winline
    ? '<b style="color:#2f8fd8">' + (S.winOver ? '黑方长连'
      : (stoneAt(S.winline[0][0], S.winline[0][1]) === BLACK ? '黑方连五' : '白方连五')) + '</b>'
    : S.forbidOver
      ? '<b style="color:#2f8fd8">黑方禁手</b>'
    /* 「轮到谁」跟 nextColor() 而不是 sideToMove()：识别序盘面的下一手摆色
     * 不是手数奇偶的自然轮次，状态栏必须跟 seg 高亮、引擎视角、落子颜色
     * 同一来源，否则三处显示自相矛盾。 */
    : '轮到 ' + (nextColor() === BLACK ? '●' : '○');
  if (turn !== uiTurn) { uiTurn = turn; $('#turnTag').innerHTML = turn; }
  if (S.analyzing !== uiAna) {
    uiAna = S.analyzing;
    const b = $('#btnAna');
    b.className = 'btn toggle' + (S.analyzing ? ' on' : ' off');
    b.setAttribute('aria-pressed', S.analyzing ? 'true' : 'false');
    $('#anaTxt').textContent = S.analyzing ? '分析中' : '已暂停';
  }
  /* 终局（五连/长连/禁手落子）锁住「持续分析」按钮：识别到五连/长连也一样
   * （2026-10-10 老板指令「要锁住分析按钮，只用按钮颜色区别做一个提示」）。
   * 后退/清空撤掉终局面后自动解锁（analyzing 原值还在，引擎接着跑）。 */
  const over = !!(S.winline || S.forbidOver);
  if ($('#btnAna').disabled !== over) $('#btnAna').disabled = over;
  syncTopN();
  syncPos();
  syncScanBar();
  paint(false);
}
/* 识谱摆色条（**全程常显**，2026-10-03 老板指令：黑白选择要全程都有。
 * 只在变化时写 DOM，同 uiAll 纪律） */
function syncScanBar() {
  /* 常驻占位（老板指令「棋盘固定住」）+ 全程显示：不用 visibility 切换了，
   * 行高恒定，棋盘位置与尺寸不随状态跳。
   * seg 高亮 = 「下一手摆色」**纯显示**（2026-10-10 强改退役，不可点）：
   * 识别导入过（scanFreeColor 非空）跟盘面差值推算值，否则跟手数交替的
   * sideToMove()。 */
  const cur = nextColor();
  const b = $('#scanNextB'), w = $('#scanNextW');
  const onB = cur === BLACK, onW = cur === WHITE;
  if (b.classList.contains('on') !== onB) b.classList.toggle('on', onB);
  if (w.classList.contains('on') !== onW) w.classList.toggle('on', onW);
  /* 黑白计数提示（老板指令）：识别漏子是常态，黑白数量**不必对称**，
   * 只报数不警告，判断留给用户。旧的红边/拦截体系已删。 */
  let cb = 0, cw = 0;
  for (const m of S.moves) { if (m.c === BLACK) cb++; else if (m.c === WHITE) cw++; }
  const cnt = '●' + cb + ' ○' + cw;
  const cntEl = $('#scanCnt');
  if (cntEl.textContent !== cnt) cntEl.textContent = cnt;
}
/* 摆色 seg = **纯显示**（2026-10-10 老板指令：「还是不要有强行改变黑白子的
 * 方式和视角和胜率了」——识别结果黑白数量总符合棋理（黑=白 或 黑=白+1），
 * 下一手摆色按盘面差值推算就是唯一确定的，点选强改整套机制退役）。
 * 高亮由 syncScanBar() 跟 nextColor() 刷新；CSS pointer-events:none 兜底。
 * 引擎视角仍由 search() 按下一手对齐（Rapfi YXBOARD 轮次对齐 /
 * kata-analyze 指定行棋方）——那是「算对唯一的下一手」，不是强改视角。 */
let uiTurn = null, uiAna = null, uiPos = null;
/* 位置读数与前进/后退的可用性。
 * 读数用 tabular-nums（见 CSS）：不然 9/10 → 10/11 时数字宽度会变，
 * 在这一行里就是一次横向抖动。 */
function syncPos() {
  /* 读数只数**手摆**的手：识别导入的子是底图（scanBase），不占手数 ——
   * 识别后显示 0/0（像刚开始一样），手摆第一手变 1/1（2026-10-10 老板指令）。 */
  const s = (S.cursor - S.scanBase) + '/' + (S.moves.length - S.scanBase);
  if (s !== uiPos) { uiPos = s; $('#posTxt').textContent = s; }
  /* 后退不许退进识别底图（底图不可回放），前进不变。 */
  const atStart = S.cursor <= S.scanBase, atEnd = S.cursor >= S.moves.length;
  if ($('#btnPrev').disabled !== atStart) $('#btnPrev').disabled = atStart;
  if ($('#btnNext').disabled !== atEnd) $('#btnNext').disabled = atEnd;
}
/* 分析点步进器的显示与端点禁用。放在 uiAll 里调，保证用键盘/其它入口改了
   S.topN 之后界面也能跟上（不只是点按钮那一条路径）。 */
function syncTopN() {
  if ($('#topNVal').textContent !== String(S.topN)) $('#topNVal').textContent = S.topN;
  $('#topNMinus').disabled = S.topN <= TOPN_MIN;
  $('#topNPlus').disabled = S.topN >= TOPN_MAX;
}
function bumpTopN(d) {
  const v = Math.max(TOPN_MIN, Math.min(TOPN_MAX, S.topN + d));
  if (v === S.topN) return;
  S.topN = v;
  save();
  uiAll();      // 先把数字和按钮禁用态刷新掉：手感不该等引擎
  // Rapfi 的候选个数由 `YXNBEST n` 决定，要重发一次搜索才能换；
  // KataGo 那边 info 行本来就把候选全给了，只是显示时按 S.topN 截断。
  schedule(true);
}
function uiStatus() {
  const parts = [];
  if (S.engineName) parts.push(S.engineName);
  /* 两台引擎的「算了多少」不是同一个量，别混着写：
   *   Rapfi 是 alpha-beta，有真实深度 → 「深度 D/S」；
   *   KataGo 是 MCTS，analyze 输出里压根没有 depth 字段（gtp.cpp:625-649）
   *     → 「模拟 N 次」。
   * 以前这里对两者都只试 S.depth，于是 KataGo 那一行永远缺一块 ——
   * 用户报的「RAP 下面有深度和节点，KataGo 下面什么都没有」就是这个。 */
  /* 「算了多少」对两台引擎是**同一个量**：搜索树里展开过的局面数。
   *   KataGo 的「模拟」= MCTS playout；Rapfi 的「节点」= alpha-beta node。
   * 对用户是同一句话（引擎已经看了多少个局面），没必要一个叫「模拟」
   * 一个叫「节点」—— 统一成「模拟 N 次」，少一个要解释的术语
   * （用户原话：「可不可以像卡塔狗这样模拟了多少次」）。
   * 深度仍是 Rapfi 独有的（KataGo 的 analyze 输出里没有 depth 字段，
   * gtp.cpp:625-649，照搬只会永远缺一块）。 */
  if (S.engine !== 'kata' && S.depth) {
    parts.push('深度 ' + S.depth + (S.seldepth ? '/' + S.seldepth : ''));
  }
  if (S.nodes) parts.push('模拟 ' + fmt(S.nodes) + ' 次');
  if (S.nps) parts.push(fmt(S.nps) + '/s');
  /* 「已算 Ns」：距上一条引擎输出了多久。
   *
   * 为什么需要它（用户报的「深度提示词不动，像卡住了」的真身）：Rapfi 只在
   * **完成一个新深度**时才吐一整块 INFO（深度/节点/速度/最佳线全在块里），
   * 块与块之间**零输出**。手机 CPU 被 7 个搜索线程占满，深层一层要好几秒 ——
   * 状态栏于是几秒纹丝不动，用户分不清「在算深层」还是「卡死了」。
   * 把静默秒数直接写出来：**秒数在走 = 引擎活着在算；数字跳变 = 新深度到了。**
   * 只在静默 ≥2s 时出现 —— KataGo 每 80ms 就有一帧，永远不会看到它；
   * 暂停/终局/后台也不显示。 */
  if (S.analyzing && S.ready && !S.winline && !S.forbidOver && !appHidden && S.outAt) {
    const idle = Math.floor((Date.now() - S.outAt) / 1000);
    if (idle >= 2) parts.push('已算 ' + idle + 's');
  }
  if (S.extra) parts.push('⚠ ' + S.extra);
  // 版本号放在最后：它由 Java 侧从 PackageManager 读，跟 build.gradle 同源。
  // 之所以要显示，是因为没有它会分不清「装的是哪一版」—— 排查真机问题时
  // 第一个要问的就是这个，靠用户描述「我重装过了」不可靠。
  if (DEV.ver) parts.push('v' + DEV.ver);
  setText('#stSub', parts.join('  ·  '));
  const bad = (S.forbid || []).length;
  setText('#stHint', (S.rule === 4 && bad)
    ? '黑方禁手点 ' + bad + ' 处（红叉）'
    : '轻点摆子（删除用后退 / 清空按钮）');
}
/* 只在**真的变了**的时候写 DOM。
 * uiStatus() 会被每一行引擎输出调到（DEPTH / SELDEPTH / TOTALNODES / MESSAGE），
 * 无条件赋值会让浏览器反复重建文本节点、重算样式并重排 ——
 * 在手机这种渲染管线上，这本身就是抖动的来源，和画布重画叠加就是「总闪」。 */
function setText(sel, s) {
  const el = $(sel);
  if (el.textContent !== s) el.textContent = s;
}
function fmt(n) {
  if (!n) return '0';
  if (n < 1e4) return String(n);
  if (n < 1e8) return (n / 1e4).toFixed(n < 1e6 ? 1 : 0) + '万';
  return (n / 1e8).toFixed(2) + '亿';
}
function setStatus(st, msg) {
  // 同样只在变化时写：setStatus('busy','分析中…') 每轮搜索都会调一次，
  // className 每轮重设会让浏览器重算这个元素的样式（它带 transition）。
  const cls = 'dot' + (st === 'ok' ? ' ok' : st === 'busy' ? ' busy' : st === 'err' ? ' err' : '');
  const dot = $('#stDot');
  if (dot.className !== cls) dot.className = cls;
  setText('#stTxt', msg || '');
}
/* 引擎报错统一入口。
 * 注意：这个函数以前**根本不存在**，但驱动里已经调用了三次
 * （Rapfi 的 ERROR 行、KataGo 的 `?` 应答、停止握手超时）。
 * 也就是说只要引擎吐一行 ERROR，整个 onLine 就抛 ReferenceError 静默中断，
 * 界面永远停在旧数据上、连个提示都没有 —— 典型的「看起来没坏，其实已经死了」。
 *
 * 另外要让 `?` 这类错误浮到界面上：KataGo 的 syncBoard() 是一条条 play 发过去的，
 * 中途某条被拒（盘面非法 / 规则不符 / 引擎与棋谱不同步）之后，引擎的盘面就与
 * 界面上的棋谱不一致了，此时它给出的分析结果看着正常、其实全是错的。
 * 这种必须报出来，不能静默。
 *
 * soft 参数区分两类：
 *   · soft（兜底体检的结论，如「一时没等到结果」）—— 引擎随后给出候选就说明
 *     已经恢复了，这条提示必须被抹掉。否则一次慢握手会在状态栏留下一个**永久**的 ⚠，
 *     看着像引擎一直坏着（用户看到的「为什么总会引擎报错」正是这类）。
 *   · 非 soft（引擎自己报的 ERROR / `?` 拒绝）—— 它们的含义是「现在显示的东西
 *     可能不对」，得一直挂着直到重启引擎，不能被后面随便几行输出冲掉。 */
function onEngineErr(msg, soft) {
  S.extra = String(msg || '引擎报错').slice(0, 120);
  S.softErr = !!soft;
  setStatus('err', '引擎报错：' + S.extra);
  uiStatus();
}
/* 当前局面的候选真的到了 → 自愈型的提示可以撤了（硬错误保持不动）。 */
function clearSoftErr() {
  if (S.softErr && S.extra) { S.extra = ''; S.softErr = false; uiStatus(); }
}
let toastT = null;
function toast(m) {
  const t = $('#toast'); t.textContent = m; t.className = 'on';
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 1600);
}

/* ---------- 设置持久化 ---------- */
// 只存「用户选了什么」，不存「引擎算出来的东西」。
// 旧版存的 budget/strong 两个键已经跟着设置项一起删掉了。
const LS = 'gomoku-ana-v2';
function save() {
  try {
    /* analyzing 刻意**不入库**（2026-09-22 起）：开机一律暂停是产品要求，
     * 若这里存、load() 里读，「上次开着」会把它绕掉。按了分析也只影响本轮会话。 */
    localStorage.setItem(LS, JSON.stringify({
      engine: S.engine, rule: S.rule, topN: S.topN,
    }));
  } catch (e) {}
}
function load() {
  try {
    const o = JSON.parse(localStorage.getItem(LS) || '{}');
    if (o.engine) S.engine = o.engine;
    if (o.rule === 0 || o.rule === 4) S.rule = o.rule;
    // 分析点范围跟着 TOPN_MIN..TOPN_MAX 走，别在这里另写一份 1/3/5/8 ——
    // 存的旧值（比如 8）在新范围里依然合法，会被保留。
    if (typeof o.topN === 'number' && isFinite(o.topN)) {
      S.topN = Math.max(TOPN_MIN, Math.min(TOPN_MAX, Math.round(o.topN)));
    }
    /* analyzing 不恢复：开机一律「已暂停」（见 S 初始化处的说明）。
     * 老库存里可能还留着 analyzing:true，读都不读，免得把要求绕掉。 */
  } catch (e) {}
}
/* 「把分析停下来」与「把分析重新跑起来」—— 按钮和 App 生命周期**共用同一条路径**。
 *
 * 为什么必须共用而不是各写一份：这条路径是本项目里少数「已被断言过」的东西
 * （tools/test_preview.mjs 的 D3 节：引擎必须真的停手、停止账本收支必须平衡）。
 * 另写一份意味着多一份没人验过的实现，而它的失效方式恰恰是**看不出来**的
 * —— 界面写着「已暂停」，引擎却还在满速算。 */
function stopAnalysisNow() {
  S.dirty = false;
  /* 「暂停」必须**真的**把引擎停下来。
   * 旧代码只翻了个标志位：pump() 于是不再排新一轮，可当前这一轮是**无限分析**，
   * 它不会自己结束 —— 引擎继续满速算、输出继续进 onLine、uiAll() 继续按新数据重画。
   * 界面写着「已暂停」，棋盘上的胜率却还在跳，手机还烫着。
   * 这不是显示问题，是状态与事实不符（也是白烧电池）。 */
  S.searching = false;
  drv().stop();
  setStatus(S.ready ? 'ok' : 'err', '已暂停');
  uiStatus();          // 让「已算 Ns」立刻消失（暂停了就没有「在算」可言）
}
function startAnalysisNow() {
  schedule(true);
  setStatus('busy', '分析中…');
  uiStatus();          // 「已算 Ns」恢复显示（计数会在 startSearch 里归零重起）
}
$('#btnAna').onclick = () => {
  S.analyzing = !S.analyzing; save(); uiAll();
  if (S.analyzing) startAnalysisNow(); else stopAnalysisNow();
};

/* ---------- 退到后台（Home 键 / 锁屏）时必须停掉分析 ----------
 *
 * 为什么需要：两个引擎都是 Java 侧拉起的**子进程**，它们**不跟 Activity 生命周期绑定**
 * —— 按 Home 或锁屏时没有任何东西会去停它们，于是引擎继续按 7 个线程满载跑，
 * 输出继续刷、机器继续发热掉电，而用户看不到任何结果。
 * 以前只有「按返回键」（Activity 被销毁 → onDestroy 里 host.stop()）才会停，
 * 所以「摆着谱分析 → 随手锁屏 → 手机发烫」是一条完全真实、又完全不报错的路径。
 *
 * 怎么停：复用上面**同一条**暂停路径（引擎真的停手）。**不杀进程** ——
 * 所以切回前台是秒回，不会重新加载 KataGo 权重。
 *
 * 状态怎么记：**不动 S.analyzing**。它记的是「用户的意图」，不是「此刻在不在算」。
 * 退后台只是临时压一层闸门（appHidden），用户回来时按原意图恢复；
 * 用户自己按过暂停（S.analyzing 为假）时，退后台/回前台一律什么都不做 ——
 * 绝不擅自替他开始分析。 */
function onAppHidden(hidden) {
  hidden = !!hidden;
  if (hidden === appHidden) return;          // 重复通知不做事
  appHidden = hidden;
  if (hidden) {
    if (!S.analyzing) return;                // 本来就是暂停态：不碰
    bgResume = true;
    stopAnalysisNow();
    /* 状态栏要写**到底为什么停**，不能只写「已暂停」：否则用户回来时看到
     * 「分析中」的按钮配「已暂停」的状态行，会以为界面坏了。
     * （按钮显示的是**意图**，回来就会真的恢复，所以那里不翻。） */
    setStatus('ok', '切到后台，分析已暂停');
  } else if (bgResume) {
    bgResume = false;
    if (S.analyzing) {
      /* 回前台发现引擎是死的（后台里被系统杀了，崩溃自愈在后台是故意不跑的）：
       * 这里直接重启引擎 —— onEngineReady 之后的 schedule(true) 会接着把分析续上。
       * 不做这道的话，startAnalysisNow() 会在 !S.ready 下白走一趟 pump()，
       * 界面冻在「分析中」的按钮配上一个死引擎。 */
      if (!S.ready) restartEngine();
      else startAnalysisNow();
    }
  }
}

/* ---------- 自动化检查出口（只读） ----------
 * 给 tools/test_preview.mjs 用：它需要在真浏览器里断言「候选点确实落在棋子附近」
 * 这类事情，光看截图是判不出来的（截图看着正常，其实可能分析的是空盘）。
 * 这里**只暴露读操作**，不提供任何写入口 —— 免得它变成一条绕过界面的后门，
 * 那样测试就测不到真实的交互路径了。摆子一律由测试自己按 geom() 算像素去点。
 */
window.__dbg = {
  state: () => ({
    engine: S.engine, engineName: S.engineName, rule: S.rule, topN: S.topN,
    analyzing: S.analyzing, ready: S.ready, searching: S.searching,
    depth: S.depth, nodes: S.nodes, extra: S.extra,
    // 兜底体检的重试次数、以及 Rapfi 握手「超时也照常执行」的次数。
    // 用来断言「断链会被自愈，而不会静默留一块空棋盘」。
    wdRetry: S.wdRetry || 0, stopTimeouts: RAPFI._timeouts || 0,
    /* 「引擎一条结果都没给」的账：本轮有没有收下过可用的分析输出、
     * 连续几轮是零输出、有没有如实报出结论。
     * 这是「引擎卡死」的唯一可断言出口 —— 旧实现里「搜索在跑 + 候选还在」会让
     * 所有判据同时为假，界面永久冻住却什么痕迹都不留。 */
    roundOut: !!S.roundOut, quietRuns: S.quietRuns || 0,
    wdSilentDone: !!S.wdSilentDone,
    // 累计发起的搜索轮数 + 当前「收不收引擎输出」的闸门状态。
    // 这是「引擎会不会被自己反复打断」的唯一可断言出口：静置一段时间后
    // searches 必须**不再增长**（说明它在安心搜，而不是每 140ms 被重开一次），
    // 同时 lines 要还在涨（说明它确实还在算）。
    searches: searchCount, accept: S.accept,
    // 退后台闸门：appHidden=true 时引擎必须停手且不许再排新一轮（省电省热）；
    // bgResume=true 表示「这次停是我为后台停的」，回前台要恢复。
    appHidden: appHidden, bgResume: bgResume,
    // Rapfi 的停止账本：发过几次 YXSTOP / 收到几次回执。两者长期不相等就说明
    // 「回执分发」出了问题（多发的那次会成为一格永久错位）。
    stopReqs: RAPFI._stopReq || 0, stopAcks: RAPFI._stopAck || 0,
    // 当前引擎进程里**实际加载**的 KataGo 权重档（b10r 连珠 / b10f 无禁手；Rapfi 时 null），
    // 以及累计的引擎启动次数。
    // KataGo 的 -model 只能在进程启动时给，所以 kataNet 一变，就一定发生过一次重开 ——
    // 「切禁手必须换网」这条只能靠这两个值断言，界面状态里没有别的痕迹。
    kataNet: kataNetLoaded, starts: startCount,
    // 崩溃自愈账本：90 秒窗口内的连续崩溃次数。自动重启挂账时这里会 >0，
    // 引擎恢复正常运行（90 秒无崩溃）后归零。
    crashN: crash.n,
    // 识谱：scanBusy=识别正在跑（按钮锁着的证据）。
    // 「识别后不自动开分析」的断言链：applyScan 后 analyzing=false。
    scanBusy: !!S.scanBusy,
    // 游标与总数：前进/后退的自动化断言靠它（棋盘上实际可见的只有前 cursor 手）。
    cursor: S.cursor, total: S.moves.length,
    moves: S.moves.map(m => [m.x, m.y, m.c]),
    /* [x, y, 手数] —— **逻辑编号**（这一手在完整棋谱里的次序，与游标无关）。
     *
     * ⚠ 键名必须是 `moveSeq` 而**不能**叫 `movenos`：`__dbg` 对象顶层已经有一个
     * 同名的 `movenos()`（返回**画布上真正落笔的**序号，与游标有关）。JS 对象字面量
     * 的同名键是**后者覆盖前者**，于是这里若也叫 `movenos` 就是一条死代码 ——
     * 而且它被覆盖后形状恰好也对，`state().movenos` 照样返回 `[x,y,no]`，
     * 测试永远是绿的，谁也看不出问题。可它俩**语义相反**（一个不随游标变、一个随），
     * 哪天有人照「逻辑编号」去改这一行，改的就是画布序号那份 —— 静默。
     * 所以拆成两个名字，让「同义不同物」在类型层面就无法混淆。 */
    moveSeq: S.moves.filter(m => !m.q).map((m, i) => [m.x, m.y, i + 1]),
    cands: (S.cands || []).filter(Boolean).map(c => ({
      x: c.x, y: c.y, wr: c.wr, blkWr: c.blkWr, visits: c.visits, eval: c.eval,
    })),
    root: S.root, forbid: S.forbid, winline: S.winline,
    winOver: !!S.winOver, forbidOver: !!S.forbidOver,
  }),
  geom: () => ({ cell: cell, padL: padL, padT: padT, CW: CW, N: N,
                 KX: KX, KT: KT, KB: KB, dpr: DPR }),
  // 棋盘上那些胜率胶囊的最终矩形 —— 用来断言「选点不会互相压住」。
  labels: () => lastLabels.map(l => ({ x: l.x, y: l.y, w: l.w, h: l.h, txt: l.txt, halo: l.halo,
                                       cx: l.cx, cy: l.cy, px: l.px, py: l.py })),
  // 最近一次画出来的坐标文字（双坐标的坐标数/位置）—— 用来断言四周都有坐标且没被裁掉。
  coords: () => coordRun.map(c => ({ t: c.t, x: c.x, y: c.y, fs: c.fs })),
  // 最近一帧真正画在棋子上的手数序号 —— 断言「序号不是只在数据里，而是确实落了笔」。
  movenos: () => moveNoRun.map(m => ({ x: m.x, y: m.y, no: m.no, c: m.c, fs: m.fs, col: m.col })),
  // 识谱调整 overlay 与「下一手」推导（tools/test_preview.mjs 的 F 段在用）：
  // 手势模拟只能覆盖一两条路径，其余用这里暴露的内部量驱动真实代码。
  adj: () => ({ on: AJ.on, rotDeg: AJ.rotDeg, rot: AJ.rotDeg, zoom: AJ.zoom,
                panX: AJ.panX, panY: AJ.panY,
                crop: { ...AJ.crop }, hasImg: !!AJ.img }),
  adjSetCrop: (x, y, w, h) => { AJ.crop = { x, y, w, h }; adjClampCrop(); adjPaint(); },
  adjSetRot: deg => adjSetRotTo(deg),
  adjConfirm: () => adjConfirm(),
  adjCancel: () => $('#adjCancel').onclick(),
  scanFreeColor: () => S.scanFreeColor != null ? S.scanFreeColor : null,
  scanNextDefault: scanNextDefault,
  // 累计重画次数。用来把「分析时总闪烁」变成可断言的东西：引擎刷得再勤，
  // 重画次数也必须被节拍闸门压住，而不是每来一行输出就整屏重画一次。
  paints: () => paintCount,
  // 引擎吐给界面的总行数。与 paints 一起看才说明问题：以前两者是同一量级
  // （每行都重画），现在行数远大于重画次数才是「闪烁被治住」的实证。
  lines: () => lineCount,
  // 当前画布内容签名。两次签名相同＝界面看起来一模一样，此时不该发生重画。
  sig: () => paintedSig,
  // 临时调试出口（probe_autolev.mjs）：看 scanAutoLevel 在浏览器里对不歪图
  // 会不会误选非 0 角度 —— same=true 返回原图；false 且 w/h 变大 = 真转了。
  autoLevelProbe: img => {
    const r = scanAutoLevel(img);
    return { w: r.width, h: r.height, same: r === img };
  },
};

/* ---------- 启动 ---------- */
cv.addEventListener('click', tapAt);
cv.addEventListener('touchstart', e => { e.preventDefault(); tapAt(e); }, { passive: false });
window.addEventListener('resize', () => resize());
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

load();
rebuild();
bindSeg();
resize();
uiAll(); uiStatus();
setStatus('init', '正在启动引擎…');

// 原生侧会调用 __native.info(...) 触发 boot()；若 3 秒内还没起来则分两种情况处置
setTimeout(() => {
  if (S.ready) return;
  /* ① 有原生环境却没起来 = **冷启动竞态**：Java 侧一解包完就推 __native.info，
   *    而那一刻页面主脚本可能还没执行完 —— 这条消息会落进一个还没有 __native 的
   *    文档里，被 Java 那句 `try{__native.info(...)}catch(e){}` 静静吞掉。
   *    于是引擎永远不启动，界面干停在「正在启动引擎…」，而且哪都不报错。
   *    Android.info() 是**同步**返回同一份数据的，这里主动反向问一次即可补上。
   * ② 没有原生环境（就是拿浏览器打开的）→ 明确说清楚。 */
  if (HAS_NATIVE() && window.Android.info) {
    try { nativeInfo(window.Android.info()); } catch (e) {}
    return;
  }
  setStatus('err', '未检测到本机引擎（需在 App 内运行）');
}, 3000);
</script>
</body>
</html>
