<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#faf9f7">
<title>五子棋分析</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:#faf9f7;color:#1c1b19;
  font:14px/1.45 -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select:none;
}
header{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;flex:none}
.brand{font-size:15px;font-weight:600;letter-spacing:.02em}
.spacer{flex:1}
/* .seg 里所有子项统一 26px 高 + 垂直居中。
   以前没写 align-items（默认 stretch），各项 line-height 又不一样：
   「分析点」这个 label（line-height:1）被拉伸到整行高后，文字贴在顶部，
   而右边的数字是 inline-block 按自身行高居中 —— 于是看着就是
   「分析点和后面数量的高度不一样」。统一盒高最省事，也最稳。 */
.seg{display:inline-flex;align-items:center;background:#ecebe7;border-radius:9px;padding:2px;gap:2px}
.seg button{
  border:0;background:transparent;color:#6b6862;font:inherit;font-size:13px;
  height:26px;display:inline-flex;align-items:center;
  padding:0 11px;border-radius:7px;cursor:pointer;transition:.12s;white-space:nowrap;
}
.seg button.on{background:#fff;color:#1c1b19;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.seg .lbl{
  height:26px;display:inline-flex;align-items:center;
  font-size:11px;color:#8a867e;padding:0 3px 0 7px;white-space:nowrap;
}
main{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 10px}
.board-wrap{flex:none;display:flex;justify-content:center;padding:2px 0 4px}
canvas{display:block;touch-action:manipulation;border-radius:6px}
/* 吃掉底部剩余空间。必须存在且**不能**把它的高度算进「可用高度」，
   否则它和 canvas 尺寸会形成正反馈（canvas 变小 → 它变大 → 可用更小 → 死循环）。 */
.grow{flex:1;min-height:0}
/* nowrap 是**治上下跳动**的一环：这一行原本允许换行，而换行是按内容宽度触发的 ——
   状态文字一长、或「轮到 ●」变成「黑方连五」，就可能把整行挤断成两行。
   行数一变，下面的棋盘位置就整体跳一次。不换行 + 各元素可收缩，布局才是死的。 */
.ctl{display:flex;align-items:center;gap:6px;margin:0 0 6px;flex-wrap:nowrap}
.ctl .spacer{flex:1;min-width:0}
.fld{display:flex;align-items:center;gap:6px;font-size:12px;color:#8a867e}
.btn{
  border:1px solid #e2e0db;background:#fff;color:#33312d;font:inherit;font-size:13px;
  padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;
}
.btn:active{background:#f2f1ed}
.btn.off{opacity:.45}
/* 前进/后退是「小方块」按钮：定宽，不受文字影响 */
.btn.nav{padding:6px 0;width:38px;text-align:center;font-size:16px;line-height:1;font-weight:600}
.btn.nav:disabled{opacity:.32;cursor:default;background:#fff}
/* 手数读数：数字位数变化（9/10、99/100）不能改变宽度，否则整行会跟着抖 */
#posTxt{
  flex:none;min-width:52px;text-align:center;white-space:nowrap;
  font-size:12.5px;color:#6b6862;font-variant-numeric:tabular-nums;
}
/* 轮次标签定宽：内容从「轮到 ●」换成「黑方连五」时宽度不变 */
#turnTag{flex:none;min-width:66px;text-align:right;white-space:nowrap}
/* 校对条计数定宽：●9 ○9 → ●10 ○10 不许把行撑抖（与 #posTxt 同一条规矩） */
#scanCnt{flex:none;min-width:64px;text-align:right;white-space:nowrap;
         font-variant-numeric:tabular-nums}
/* 摆色 seg 是**纯显示**（2026-10-10 老板指令：不要强改黑白）：高亮 = 下一手
   摆色（按盘面差值自动推算），不响应点击。pointer-events:none 让 :active
   也不会触发、光标不出现手型 —— 按钮形态只为了复用 .seg 的样式。
   opacity .45 = 「锁住」的颜色（2026-10-10 老板指令：摆子黑白一直锁住，
   只用按钮颜色区别做一个提示 —— 与终局锁住的「持续分析」按钮同色）。 */
#scanNextB,#scanNextW{pointer-events:none;cursor:default;opacity:.45}
/* 终局（五连/长连/禁手落子）锁住「持续分析」：只用颜色区别做提示，不弹提示词 */
#btnAna:disabled{opacity:.45;cursor:default}
/* 识谱入口放大一号（2026-10-10 老板指令：要大一点但别乱排版）：
   只动这一个按钮自身（字号/内边距），行内其余元素一格不动。
   文字恒为 2 字 → 定宽不抖；多余宽度由行尾 spacer 吸收，窄屏不溢出；
   行高静态变大是一次性的，棋盘位置不随状态跳的老规矩不受影响。 */
#btnScan{padding:9px 18px;font-size:15.5px;font-weight:600;line-height:1}
/* 校对条两行结构：块容器套两个 .ctl，行距收紧 */
#scanBar .ctl{margin-bottom:6px}
#scanBar .ctl:last-child{margin-bottom:0}

/* 「分析点」是 1–10 的步进器，而不是 4 个固定档 —— 用户要能自己加减。
   .seg 原本是「互斥选择」，这里的两个按钮是加/减动作，所以不复用 .on 高亮。 */
.seg.stepbox{padding:2px}
.seg .step{
  min-width:30px;height:26px;display:inline-flex;align-items:center;justify-content:center;
  padding:0 8px;font-size:15px;font-weight:600;line-height:1;
  color:#4a4744;text-align:center;
}
.seg .step:active{background:#fff}
.seg .step:disabled{opacity:.3;cursor:default;background:transparent}
.seg #topNVal{
  min-width:22px;height:26px;display:inline-flex;align-items:center;justify-content:center;
  font-size:13.5px;font-weight:700;color:#1c1b19;font-variant-numeric:tabular-nums;
  white-space:nowrap;   /* 与 #posTxt / #turnTag 同一条规矩：数字从 9 变 10 不许改变行结构 */
}

/* 「持续分析」不是普通按钮，是个**状态开关**：原来的做法只是把整个按钮调成半透明，
   既看不出当前是开还是关，也没有「正在算」的生气。现在用「圆点 + 文字」两个信号：
     开 = 绿点脉动 + 文字「分析中」；关 = 灰点 + 文字「已暂停」。
   文字写的是**当前状态**，圆点在动就说明引擎真的在算。 */
.btn.toggle{display:inline-flex;align-items:center;gap:7px;font-weight:600;padding:6px 13px}
.btn.toggle .tdot{
  width:8px;height:8px;border-radius:50%;background:#c9c6c0;flex:none;transition:.15s;
}
.btn.toggle.on{background:#eff7f1;border-color:#beddc5;color:#22662f}
.btn.toggle.on .tdot{
  background:#3f9c53;box-shadow:0 0 0 3px rgba(63,156,83,.18);
  animation:tpulse 1.4s ease-in-out infinite;
}
/* 暂停时整体压暗一点，但仍要可读 —— 它是「点一下就能恢复」的活控件，不是禁用态 */
.btn.toggle.off{opacity:.72;color:#6b6862}
@keyframes tpulse{0%,100%{opacity:1}50%{opacity:.28}}
.dot{width:7px;height:7px;border-radius:50%;background:#c9c6c0;flex:none}
.dot.ok{background:#4a9d5b}.dot.busy{background:#d9a03a}.dot.err{background:#d25a52}
/* 三行状态必须**恒定占位**，这是「界面总上下跳动」的主因：
   它们初始是空的，一个空 flex 容器高度为 0；引擎一起来 uiStatus() 填入文字，
   行高就从 0 长到 ~16px，三行共撑高约 48px —— .foot 一变高，
   上面的棋盘和按钮整体被顶动一次。
   所以每行给 min-height（空着也占位），文字行再用 block + 省略号
   —— text-overflow 在 flex 容器上不生效，必须让它是块级。
   顺带 nowrap：状态文字很长时宁可省略号，也不要换行改变行数。 */
.foot{
  flex:none;display:flex;flex-direction:column;gap:1px;
  font-size:11.5px;color:#8a867e;padding-bottom:7px;font-variant-numeric:tabular-nums;
}
.foot .ln{display:flex;gap:8px;align-items:baseline;min-height:1.46em;white-space:nowrap}
.foot .ln span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot .ln.hint{
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:1.46em;
}
.hint{color:#a9a59d;font-size:11px;line-height:1.4}
#toast{
  position:fixed;left:50%;bottom:36px;transform:translateX(-50%);
  background:rgba(28,27,25,.9);color:#fff;font-size:13px;padding:8px 16px;border-radius:9px;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;text-align:center;
  /* z-index 必须 > #scanAdj(60)：识谱失败的报错 toast 是在 overlay 开着时弹的，
     没层级会被全屏面板盖住 —— 真机上就是「点击识别之后没有反应」。 */
  z-index:99;
}
#toast.on{opacity:1}
/* 识谱调整 overlay：全屏盖在界面上（含 header），图片框选就在这里做。
   canvas 的 touch-action:none 是手势的前提 —— 不关掉的话浏览器会把
   双指捏合吃掉当页面缩放，框选永远调不准。 */
#scanAdj{
  position:fixed;inset:0;background:#141311;z-index:60;
  display:flex;flex-direction:column;
}
#scanAdj.on{display:flex}
#adjCv{flex:1;min-height:0;touch-action:none;cursor:crosshair}
/* 底栏两行：旋转滑条一行 + 操作按钮一行。单行塞 7 个按钮在窄屏上挤爆（v1.0.20 教训）。 */
#adjBar{padding:8px 10px;flex-direction:column;gap:8px}
.adjRow{display:flex;align-items:center;gap:8px;justify-content:center;width:100%}
#adjRotSlider{flex:1;max-width:430px;accent-color:#ffd54a;height:28px}
#adjRotVal{min-width:46px;text-align:center;color:#ffd54a;font-size:12px;flex:none}
#adjBar .btn{min-width:56px;white-space:nowrap}
#adjBar #adjOk{background:#2f6b3a;border-color:#2f6b3a;color:#fff;font-weight:600;flex:1;max-width:220px}
#adjHint{color:#8a867e;font-size:11px;text-align:center;padding:0 10px 10px}

</style>
</head>
<body>

<header>
  <div class="brand">五子棋分析</div>
  <div class="spacer"></div>
  <div class="seg" id="segEngine">
    <button data-v="rapfi">Rapfi</button>
    <button data-v="kata">KataGo</button>
  </div>
</header>

<main>
  <!-- 棋盘是**正方形**、尺寸受宽度限制（见 resize()：w = min(宽度, 可用高)）。
       高屏手机上宽度先到顶，于是剩下几百 px 高度全被 .grow 吃掉，
       堆成底部一整块死白。这里再放一个 .grow，让留白对称分到上下，
       内容块看上去是居中的 —— 比「顶部拥挤 + 底部空洞」像样得多。
       resize() 是按 class 排除 .grow 的，多一个不会影响尺寸计算。 -->
  <div class="grow"></div>

  <div class="board-wrap"><canvas id="cv"></canvas></div>

  <div class="ctl">
    <div class="seg" id="segRule">
      <button data-v="0">无禁手</button>
      <button data-v="4">有禁手</button>
    </div>
    <div class="spacer"></div>
    <div class="seg stepbox" id="segTopN">
      <span class="lbl">分析点</span>
      <button class="step" id="topNMinus" aria-label="减少分析点">−</button>
      <b id="topNVal">3</b>
      <button class="step" id="topNPlus" aria-label="增加分析点">＋</button>
    </div>
  </div>

  <div class="ctl">
    <button class="btn toggle on" id="btnAna" aria-pressed="true">
      <i class="tdot"></i><span id="anaTxt">分析中</span>
    </button>
    <!-- 前进/后退取代了原来的「悔棋」：摆谱复盘需要的是**来回看**，
         而悔棋只能删、删了就回不去。中间读数显示「当前第几手/总手数」。 -->
    <button class="btn nav" id="btnPrev" aria-label="后退一步" title="后退一步">←</button>
    <span id="posTxt">0/0</span>
    <button class="btn nav" id="btnNext" aria-label="前进一步" title="前进一步">→</button>
    <button class="btn" id="btnClear">清空</button>
    <div class="spacer"></div>
    <span id="turnTag" class="hint">轮到 ●</span>
  </div>

  <!-- 识谱摆色条：识别直接落盘（**无校对态**，2026-10-03 老板指令，
       校对完成/撤销导入按钮已删）。seg =「下一手摆子颜色」**纯显示**：
       按盘面黑白数差自动推算（黑=白→黑、黑=白+1→白），**不可点**
       （2026-10-10 老板指令：识别结果黑白数量总符合棋理，强改多余——
       「还是不要有强行改变黑白子的方式和视角和胜率了」）。
       右侧 #scanCnt 报当前黑白子数（数量不必对称，只报数不警告）。
       **全程常显**（2026-10-03 老板指令）——初始不加 visibility:hidden，
       行高恒定，棋盘位置与尺寸不随状态跳。 -->
  <div id="scanBar">
    <div class="ctl">
      <!-- 识谱住这行行首（2026-10-10 老板：上一版挪到谱操作行把那行挤乱了）：
           摆色本来就是识谱功能的组成部分，同组语义顺；该行只有 seg+计数，
           空间宽裕，窄屏也不溢出。 -->
      <button class="btn" id="btnScan" title="从相册识别棋盘截图">识谱</button>
      <span class="fld" title="下一手摆子颜色：按盘面黑白数自动推算">摆子</span>
      <div class="seg">
        <button id="scanNextB" title="下一手摆黑（按盘面黑白数自动推算）">●黑</button>
        <button id="scanNextW" title="下一手摆白（按盘面黑白数自动推算）">○白</button>
      </div>
      <div class="spacer"></div>
      <span class="fld" id="scanCnt" title="当前盘面黑白子数">●0 ○0</span>
    </div>
  </div>

  <!-- 识谱调整 overlay：选图后先人工框出棋盘，再识别。
       自动识别在真实照片上不可靠（透视/背景/拍不全），把「棋盘在哪」交给用户，
       算法只负责框内的网格与黑白分类 —— 这是「完全识别不了」的正解。
       旋转是任意角度（滑条 ±90° + 双指转动）：斜着拍的照片 90° 步进救不了。
       缩放没有按钮 —— 双指捏合/滚轮就够了（老板指令：缩放就用手）。 -->
  <div id="scanAdj" style="display:none">
    <canvas id="adjCv"></canvas>
    <div class="ctl" id="adjBar">
      <div class="adjRow">
        <span class="hint" style="white-space:nowrap;flex:none">旋转</span>
        <input type="range" id="adjRotSlider" min="-90" max="90" step="0.5" value="0">
        <span id="adjRotVal" title="点一下回正">0°</span>
      </div>
      <div class="adjRow">
        <button class="btn" id="adjFull" title="框选重置为整张图">全图</button>
        <button class="btn" id="adjCancel">取消</button>
        <button class="btn" id="adjOk" title="只识别框选的棋盘区域">识别此区域</button>
      </div>
    </div>
    <div class="hint" id="adjHint">拖四角调框 · 框内拖动移框 · 框外单指平移 · 双指捏合缩放/旋转</div>
  </div>

  <div class="grow"></div>

  <div class="foot">
    <div class="ln"><i class="dot" id="stDot"></i><span id="stTxt">正在启动引擎…</span></div>
    <div class="ln hint" id="stSub"></div>
    <div class="ln hint" id="stHint"></div>
  </div>
</main>

<div id="toast"></div>
<!-- 相册选图入口。App 里由 Java 侧 onShowFileChooser 接管（onchange 不会触发，
     HAS_NATIVE() guard 再兜一层）；浏览器/预览里走 FileReader 原生路径。 -->
<input type="file" id="fileScan" accept="image/*" style="display:none">

<script>
'use strict';
/* ============================================================================
 * 五子棋摆谱 · 持续分析（单机 Android 双引擎）
 *  - 引擎：RAPFI五子棋（piskvork 协议）/ KataGo(五子棋分支, GTP)
 *  - 界面：只做摆谱 + 持续分析，极简
 * ==========================================================================*/
const N = 15, EMPTY = 0, BLACK = 1, WHITE = 2;
const $ = s => document.querySelector(s);
const LETTERS = 'ABCDEFGHJKLMNOP';           // GTP 列字母（跳过 I —— 协议标准，引擎通信专用）
/* 棋盘上画的坐标标签用**连续 A-O**（老板 2026-10-02：横坐标少了 I）。
 * 与 GTP 的 LETTERS 是两套：GTP 的 I 容易和 1 混淆所以协议跳过，但那是给机器
 * 看的；界面上人眼读的是连续字母，col 8 显示 I。引擎解析/生成的 A1 坐标
 * （BESTLINE、候选点、gtp()）仍走 LETTERS，两边互不串。 */
const DISP_LETTERS = 'ABCDEFGHIJKLMNO';
// 棋盘上标注的分析点个数：1–10，由用户用 −/＋ 自己加减。
// 下限 1（至少给一个最佳点）、上限 10（再多就糊成一片，且 Rapfi 的 YXNBEST
// 也只需这么多）。默认 3 —— 能看出「最佳点 + 备选」，又不至于挤。
const TOPN_MIN = 1, TOPN_MAX = 10;

/* ---------- 状态 ---------- */
const S = {
  moves: [],          // 完整棋谱 [{x,y,c}]  c=BLACK|WHITE
  /* 游标：当前「看到第几手」，0..moves.length。棋盘绘制、胜负判定、禁手、
   * 以及送给引擎的盘面**一律只看前 cursor 手** —— 后退一格就是真的分析到
   * 那一手时的局面。S.moves 仍保留完整棋谱，所以前进还能走回来。
   * 一定要和 moves.length 分开：合成一个变量就只能「删」，回不去。 */
  cursor: 0,
  rule: 0,            // 0=无禁手(FREESTYLE) 4=有禁手(RENJU)
  ruleApplied: null,  // 引擎**实际生效**的规则（null=未知）。见 applyRuleIfNeeded()
  topN: 3,            // 棋盘上标注几个分析点（用户可用 −/＋ 调，范围 TOPN_MIN..TOPN_MAX）
  /* 开机**一律暂停**（2026-09-22 用户要求）：进软件时分析模式必须是「已暂停」，
   * 由用户自己按「分析」开始。不恢复上次会话的开关——load() 里也不再读这个键，
   * 否则「上次开着」会把这条要求整个绕掉。引擎本身照常启动（秒回不重载权重），
   * 只是 onEngineReady 后 pump() 因 !S.analyzing 直接返回，不会排任何搜索。 */
  analyzing: false,
  engine: 'rapfi',
  forbid: [],         // 连珠黑方禁手点 [x,y]
  /* 识别导入后的摆色状态（2026-10-03 老板指令；2026-10-10 强改退役）：
   * 识别落地即置为盘面差值推算值（黑=白 → 黑、黑=白+1 → 白），之后摆子/
   * 删子都按新盘面差值重推（scanNextDefault），seg 纯显示它、**不可点**。
   * null = 没识别过（普通摆谱按手数交替，seg 高亮跟 sideToMove()）。

      const k = y * N + x;
      if (seen.has(k) || S.board[k] !== EMPTY) continue;
      seen.add(k);
      if (isForbidden(x, y)) S.forbid.push([x, y]);
    }
  }
}

/* ---------- 引擎桥 ---------- */
// 原生侧（Android）注入：window.Android.{start,send,kill,setNet}
// 回调：window.__native.{info,ready,line,exit}
const Eng = {
  pending: [],
  started: false,
  send(cmd) {
    if (typeof cmd !== 'string' || !cmd) return;
    if (HAS_NATIVE()) window.Android.send(cmd);
    else if (window.__mockSend) window.__mockSend(cmd);
  },
  start(id, model, rule) {
    this.pending = [];
    this.started = false;
    // 三个参数必须原样透传：Java 侧 Bridge.start(String id, String model, int rule)
    // 是按签名匹配的，少给参数会直接抛异常、引擎根本起不来。
    if (HAS_NATIVE()) window.Android.start(id, model || '', rule | 0);
    else { this.started = true; onEngineReady(); }
  },
  kill() {
    if (HAS_NATIVE()) window.Android.kill();
    // 预览模式下也要把「停止」告诉模拟引擎，否则它的模拟搜索循环会继续输出，
    // 切换引擎后旧引擎的深度/速度还挂在状态栏上，看着像切换没生效。
    else if (window.__mockSend) window.__mockSend('END');
    this.started = false;
    RAPFI.reset();
    KATA.reset();
  },
};
function HAS_NATIVE() { return !!(window.Android && window.Android.start); }
function isMock() { return !!window.__mockSend; }

/* ---------- Rapfi 驱动 ----------
 * 无限分析带来的新约束：搜索不会自行结束，于是「用户改棋谱」必须能打断它。
 * Rapfi 的规则很硬（Rapfi/command/gomocup.cpp:801-805）：
 *
 *     if (cmd == "END")   return Search::Engine.stopThinking(), true;   // true = 退出程序
 *     else if (cmd == "STOP" || cmd == "YXSTOP") return stopThinking(), false;
 *     else if (thinking)  return false;    // 搜索期间，其余命令**一律静默丢弃**
 *
 * 也就是说：搜索中直接重发 `YXBOARD`/`YXNBEST` 是**没有用的**，命令会被丢掉。
 * 必须「先 YXSTOP 停掉搜索 → 等 thinking 变 false → 再发盘面」。
 *
 * 踩过的坑（值得记）：最初用「重发盘面后 N 秒内是否出现 INFO PV 0」来判断能否打断，
 * 结论是「可打断」——但这是**误判**：旧局面的搜索本来就在不停刷 INFO PV 0，
 * 于是新命令哪怕被丢光了也一样能"看到 PV 0"。判据必须用只有新局面才可能出现的
 * 证据（见 tools/probe_rapfi_stop.py 里用两个可区分的局面做对照）。
 *
 * 怎么知道 thinking 变 false 了？YXSTOP **不回复任何东西**（注意那是 `return false`
 * 的分支），没有回执可等。用一个只读探针去问：`ABOUT` 也受 thinking 门限制，
 * 只在空闲时才会被处理并回一行 `name="Rapfi", version=...`。收到它就说明门开了。
 * 实测（tools/probe_rapfi_stop.py）：YXSTOP → 空闲 0.08s；空闲后重发盘面 0.05s 出新结果。
 * 顺带纠正：`END` 是**关引擎**（返回 true = 程序该退出），不是停搜索。
 */
const RAPFI = {
  id: 'rapfi', label: 'RAPFI五子棋',
  _idle: true,          // 应用层对引擎「thinking == false」的认知
  _pending: null,       // 引擎空闲后要执行的动作
  _pollT: null,
  _tries: 0,
  /* 「发过几次停止请求」/「收到几次停止回执」。
   * YXSTOP 的收尾**一定会回一行坐标**（实测见 tools/probe_rapfi_stopack.py），
   * 而引擎自己结束（证出必胜等）也会回同样格式的一行。两者必须分开，
   * 否则前者会被当成「搜索结束」→ 立刻再排一轮 → 又 YXSTOP → 自我打断成永动机。
   * 见 onLine 里 /^\d+,\d+$/ 那一段。 */
  _stopReq: 0,
  _stopAck: 0,
  boot() {
    const c = DEV.cores || 4;
    Eng.send('START ' + N);
    // 置换表：**恒给 512MB**（2026-09-25 老板拍板「统一最高，不管机型」）。
    // 这只是「按需增长的上限」：Rapfi 侧分配失败会自动减半重试，跑得深才逐步占上。
    // 代价：低配机（3~4GB）超长分析后可能被系统杀进程 —— 有崩溃自愈自动重启兜底；
    // 收益：无限分析跑得越久越吃表，表满互相顶替会直接伤深层棋力，512MB 一律拉满。
    Eng.send('INFO HASH_SIZE 524288');
    // 线程：**全部核**给引擎（不再留一核）。理由见 EngineHost.java 同款注释 ——
    // 界面在 v1.0.14 之后开销已极低；7→8 线程 ≈ +12% 搜索速度。
    Eng.send('INFO THREAD_NUM ' + Math.max(1, Math.min(8, c)));
    Eng.send('INFO RULE ' + S.rule);
    Eng.send('INFO STRENGTH 100');
    Eng.send('INFO MAX_DEPTH 128');
    Eng.send('INFO MAX_NODE 0');
    Eng.send('INFO SHOW_DETAIL 2');
    Eng.send('INFO PONDERING 0');
    Eng.send('INFO SWAPABLE 0');
    /* 全 0 = 引擎的 Infinite 分支 → 真正的分析模式。别改回「很大的数」，
     * 原因见 TIME_LEFT_UNLIMITED 那段：非分析模式下证出杀棋就自己收手。
     * 两条都要**显式**发，顺序也不能反：MATCH 与 TURN 各自都会重算 timeLimit，
     * 必须让最后一条拿到两个 0。虽然引擎的默认值恰好是 0/false（searchcommon.h:132-134），
     * 但「靠默认值对」等于没写 —— 哪天默认值变了，行为会静默退回计时对局。 */
    Eng.send('INFO TIMEOUT_MATCH 0');
    Eng.send('INFO TIME_LEFT ' + TIME_LEFT_UNLIMITED);
    Eng.send('INFO TIMEOUT_TURN 0');
    this._idle = true;
  },
  syncRule() { Eng.send('INFO RULE ' + S.rule); },

  /* 引擎重启时必须清掉握手状态：否则上一轮的 ABOUT 轮询定时器还活着，
   * 会把 _pending 里的旧闭包在新引擎上执行一次，表现为「切引擎后莫名其妙
   * 多跑了一次旧局面的搜索」。 */
  reset() {
    if (this._pollT) { clearTimeout(this._pollT); this._pollT = null; }
    this._pending = null;
    this._tries = 0;
    this._timeouts = 0;
    this._idle = true;
    /* 回执账本也要归零：新进程里没有「上一台引擎欠我们的停止回执」，
     * 留着的话第一行坐标会被误当成停止回执吞掉。 */
    this._stopReq = 0;
    this._stopAck = 0;
  },

  /* 中断当前搜索（若有），等引擎真正空闲后执行 fn。
   * fn 会收到一个布尔值：**引擎是否被确认空闲**（ABOUT 握手回来了 = true，
   * 握手超时后硬着头皮执行 = false）。规则下发靠它决定敢不敢记账，
   * 见 applyRuleIfNeeded()。 */
  interrupt(fn) {
    if (this._idle) { fn(true); return; }
    this._pending = fn;
    /* 握手必须**单飞**：已经有一条 ABOUT 轮询链在跑，就只换待办，绝不再起第二条。
     * 这里踩过一个很隐蔽的坑，值得写清楚：
     *   快速连点「分析点 ＋/－」时（每 60ms 一次，用户轻点两下就这样），
     *   每次 interrupt 都会 _poll() 起一条新链，而旧的 setTimeout 句柄没被清掉
     *   —— 因为 _pollT 只记得住最后一条。于是 t=0 起链、t=60 起链、t=120 起链…
     *   四条链一起发 ABOUT，可 _tries 是**共用一个计数器**的，涨速变成 4 倍，
     *   ≈0.6s 就撞上 40 次上限 → 报出假的「Rapfi 未响应停止命令」，
     *   并且把 _pending 里那条待办**丢掉**。结果就是最后那一次「＋」的重启从未发生，
     *   棋盘上一直留着上一档点数的候选（实测 topN=7 却只有 6 个候选，正是这么来的）。
     *   Rapfi 那边完全正常，是界面自己把握手的账算乱了。 */
    if (this._pollT) return;
    this._tries = 0;
    this._stopReq++;                           // 记一次「要等回执」的停止请求
    Eng.send('YXSTOP');
    this._poll();
  },
  /* 真把引擎停下来（暂停分析 / 已分胜负时用）。
   * 与 interrupt 的区别：**不排任何待办**，只是停 —— 换句话说，
   * 停止之后不会有新一轮搜索被续起来，这才是「暂停」该有的语义。 */
  stop() {
    this._pending = null;
    if (this._idle || this._pollT) return;      // 本来就空闲，或已在等空闲
    this._stopReq++;
    Eng.send('YXSTOP');
    this._poll();                              // 只为了把 _idle 校准回 true
  },
  _poll() {
    if (this._tries++ >= 60) {                 // 60 × 60ms ≈ 3.6s
      this._pollT = null;
      const fn = this._pending; this._pending = null;
      /* 超时 ≠ 确认失败，更 ≠ 该把待办丢掉。
       *
       * 旧实现在这里 `this._pending = null` 直接放弃，于是走成一条最坏的路径：
       *   摆一子 → post() 把候选清空 → pump() 排队「重发盘面」→ 握手超时把它丢掉
       *   → 引擎侧其实还在跑旧局面 → 棋盘上**再也没有估值**。
       * 用户报的「为什么 RAP 的估值没有了」，症状与这条路径完全吻合。
       *
       * 手机被 7 个搜索线程占满时，YXSTOP 生效 + ABOUT 回来本来就可能比桌面慢
       * （桌面实测 0.08s，但那是空载）。把预算从 2.4s 提到 3.6s，并且**超时也照常执行待办**：
       *   · 引擎其实空闲 → 这次 YXBOARD/YXNBEST 立刻生效，估值当场回来（多数情况）；
       *   · 引擎还在思考 → 那条命令被门禁丢掉，什么也不会坏，下一轮体检会再试一次。
       * 两条路都比「丢掉待办、棋盘永远空着」好。 */
      this._idle = true;
      this._timeouts = (this._timeouts || 0) + 1;
      /* 没待办（比如「暂停」刚把 _pending 清空）时不该报「已重发盘面」——
       * 那时根本没有盘面要重发。 */
      if (fn) {
        setStatus('busy', '引擎响应偏慢，已直接重发盘面');
        fn(false);                    // false = **没有**收到空闲确认
      }
      return;
    }
    /* 顺序很关键：**先挂表，再发命令**。
     * ABOUT 的回包可能是**同步**回来的 —— 预览页的模拟引擎就是同步 emit，
     * 真机上 Java 侧也是先入队再回调，而 onIdle() 会在回包里被调到。
     * 若写成「先 send 后挂表」，onIdle() 那一刻 clearTimeout(null) 什么也清不掉，
     * 等回到这里又挂上一条**全新的**定时器 —— 链条于是永远停不下来：
     * 它每 60ms 空发一次 ABOUT（此时引擎已在跑新一轮搜索，全被门禁丢掉），
     * 一路把 _tries 顶到 40，最后报出一条**假的**「Rapfi 未响应停止命令」，
     * 还把 _pending 里那条待办重启顺手丢掉。实测就是「设 7 个分析点却只剩 6 个候选」
     * 和「改棋谱 6.5s 才生效」这两条失败的共同来源。
     * 先挂表就没有这个窗口：回包同步回来时，表已经挂好，onIdle 能把它清干净。 */
    this._pollT = setTimeout(() => this._poll(), 60);
    Eng.send('ABOUT');                         // 空闲时才会被处理
  },
  /* 收到 ABOUT 的回复 → 引擎确实空闲了 */
  onIdle() {
    if (this._pollT) { clearTimeout(this._pollT); this._pollT = null; }
    this._idle = true;
    const fn = this._pending; this._pending = null;
    if (fn) fn(true);                 // true = 引擎已被确认空闲
  },

  search() {
    this._idle = false;
    /* 用户刚把「分析点」调小时，多出来的那几条要**立刻**消失，不能干等引擎下一轮。
     * 放开方向不用管（新候选会自己填进来）。持续分析时 topN 不变，这行不触发，
     * 所以不会引入闪烁。 */
    if (S.cands.length > S.topN) S.cands.length = S.topN;
    /* YXBOARD 轮次对齐：引擎该算「下一手摆色方」的局面 —— 识别导入的盘面
     * 是「黑组→白组」识别序（非落子序），下一手摆色由盘面差值推算
     * （nextColor），可能与手数奇偶的自然轮次不同，必须让引擎重放后的行棋方
     * = nextColor()，候选点才是那一方的选点。这是「算对唯一的下一手」，
     * 不是强改视角（2026-10-10 强改机制退役后语义不变）。
     * 引擎世界观（eng/rapfi-src gomocup.cpp getPosition）：第一实子恒视为黑、
     * 子色与轮次不符时引擎自动插 PASS 对齐（连续 PASS 才拒绝）；
     * 显式 PASS 坐标 = "-1,-1"（iohelper.cpp PASS_COORD），我们只放两种：
     *   · 开头 PASS（放它时轮次恒=黑 ✓，放完翻白）——白先盘必需（第一子是白时
     *     不放它，引擎会把整盘颜色解释反）；
     *   · 尾部 PASS（仅当模拟结束时轮次=黑且上一 token 是实子）。
     * 模拟不出合法方案（如白先 2黑2白 还要轮黑）就降级发自然序列 —— 引擎按它
     * 自己的世界观解释，轮次不是想要的但盘面不会崩；摆子/删子 post() 会重算。
     * 只送**游标之前**的手：后退一格就要真的分析那一手的局面。 */
    const tail = rapfiBoardTail(played(), nextColor());
    /* 记下**这轮搜索引擎实际的行棋方**，供胜率换算用（EVAL/WINRATE 是行棋方视角）：
     * 对齐成功时 = nextColor()（盘面差值推算的下一手）；降级发自然序列时引擎
     * 按自己的世界观重放，轮次最接近的近似是 sideToMove()。必须在 YXBOARD
     * 之前赋值 —— INFO 输出只在 accept 打开（本轮 search 已发出）后被消费，
     * 读到的一定是本轮值。不记这个的话：换算处写死 sideToMove()，识别序盘面
     * （下一手 ≠ 手数奇偶轮次）的黑方胜率/药丸百分比整体错位。 */
    S.engStm = tail !== null ? nextColor() : sideToMove();
    Eng.send('INFO TIMEOUT_TURN 0');
    let cmd = 'YXBOARD';
    if (tail !== null) cmd += tail;
    else for (const m of played()) cmd += ' ' + m.x + ',' + m.y + ',' + m.c;
    Eng.send(cmd + ' DONE');
    /* 顺手要一份**引擎自己算的**禁手点（仅连珠）。
     * Rapfi 的 checkForbiddenPoint 是权威实现（gomocup.cpp:627-641 的 showForbid，
     * 由 YXSHOWFORBID 触发）。实测代价只有 0.062s —— 密集 115 子棋盘也一样，
     * 而且**不会**拖慢紧随其后的 YXNBEST（实测首个 INFO 行 0.032s）。
     * 界面上那套自家近似实现（三三/四四/长连）会漏「跳四」、也会把假活三算成三，
     * 拿引擎的结果盖上去才是对的；而且它与 onTap 的拦截共用同一份列表，
     * 所以「画出来的红叉」和「挡住的落点」永远一致。
     * 必须在 YXNBEST **之前**发：YXNBEST 会把 thinking 打开，之后一切命令被门禁丢弃。 */
    if (S.rule === 4) Eng.send('YXSHOWFORBID');
    Eng.send('YXNBEST ' + S.topN);
  },
  onLine(line) {
    // ABOUT 的回执＝引擎已空闲（见上面一长段说明）。必须是精确前缀，
    // 否则会跟其它含 "Rapfi" 的输出（如启动横幅）混淆。
    if (line.indexOf('name="Rapfi"') === 0) { this.onIdle(); return; }
    if (line === 'OK' || line === 'SWAP') return;
    /* ── 裸坐标行：这是本项目最贵的一个坑，务必看完再改 ──────────────────
     *
     * 一行 `x,y`（形如 `7,6`）有两种来源，行为必须相反：
     *
     *  ① **我们发过 YXSTOP**，这是它的收尾回执。
     *     实测 tools/probe_rapfi_stopack.py：每发一次 YXSTOP 就**恰好回一行**，
     *     内容还是一条很像样的最佳手（例如 `7,6`，不是空值/0,0）；
     *     而完全不打扰地跑 6s，收尾坐标是 **0 条** —— 引擎在无限预算下不会自行结束。
     *     旧代码把 ① 也当成「这一轮搜索结束了」，于是：
     *        改一手 → YXSTOP → 回 `7,6` → afterSearch() → 140ms 后 schedule →
     *        pump → 又 YXSTOP → 又回一行 → …… **自己喂自己，永不停止**。
     *     后果不是「看着坏了」而是「看着挺好、其实一直没算」：引擎每 ~140ms
     *     被砍一次，永远加深不了，却一直占满 CPU、手机发烫。这就是
     *     「RAP 的估值在动、深度却上不去」的根因。
     *  ② 引擎**自己**结束（证出必胜/必败等，ab/search.cpp 里会 stopThinking）。
     *     这时界面才真的需要续跑下一轮。
     *
     * 两者靠「发过几次停止 / 收到几次回执」的账本区分，而不是靠猜。
     * 账本在 reset() 里随引擎重启归零。 */
    if (/^\d+,\d+$/.test(line)) {
      S.searching = false;
      if (this._stopAck < this._stopReq) { this._stopAck++; uiAll(); return; }
      afterSearch();
      return;
    }
    /* 局面刚改、新一轮还没下发之前，引擎吐的是**上一个局面**的结果。
     * 照单全收会让棋盘上出现「新局面的棋子 + 旧局面的选点」。
     * ERROR 不挡：引擎报错与局面无关，永远要浮上来。 */
    if (!S.accept && line.indexOf('ERROR') !== 0) return;
    /* 站到这里就说明「属于当前局面的输出确实在来」——兜底体检的时钟就靠它。 */
    S.outAt = Date.now();
    S.roundOut = 1;                 // 本轮「引擎给过结果」了（见 watchdog ⓪ 节）
    const i = line.indexOf(' ');
    if (i < 0) return;
    let head = line.slice(0, i), tail = line.slice(i + 1);
    if (head === 'INFO') {
      const j = tail.indexOf(' ');
      if (j < 0) return;
      head = tail.slice(0, j); tail = tail.slice(j + 1);
    }
    if (head === 'PV') { S._pv = tail === 'DONE' ? 0 : (+tail || 0); return; }
    if (head === 'NUMPV') {
      /* 本轮引擎**实际**给了几路候选。
       *
       * 名字务必按线上格式写：源码是 `INFO("NUMPV", n)`（searchoutput.cpp:32 的宏
       * `#define INFO(type, ...) sync_cout() << "INFO " << type << ' ' << ...`），
       * 所以发出来的是 `INFO NUMPV n` —— **没有下划线**。
       * 这里原先写成 'NUM_PV'，与线上格式对不上，整段是**死代码**（好在是「少做了事」，
       * 不会让估值消失）。真引擎原始输出里 61 条 `INFO NUMPV 3` 是它的实测依据
       * （tools/probe_rapfi_app.py 录、tools/test_live_replay.mjs 回放）。
       *
       * 为什么不能见 1 就裁：Rapfi 还有第二处 NUMPV ——
       * `printBestmoveWithoutSearch`（searchoutput.cpp:260）在「不用搜索」的路径上
       * 发的是一个**恒为 1** 的 NUMPV。照它裁剪会把 3~10 个活跃候选削成 1 个，
       * 用户看到的就是「估值忽然只剩一个」。所以只处理 n > 1 的情形；
       * 真·只剩 1 路时由 search() 的 topN 截断与 post() 的清空兜住。 */
      const n = +tail || 0;
      if (n > 1 && S.cands.length > n) { S.cands = S.cands.slice(0, n); scheduleUI(); }
      return;
    }
    if (head === 'FORBID') {
      /* 引擎的禁手点列表，格式是**两位补零**的 `xxyy` 连写（gomocup.cpp:635-636
       * 用 setw(2) + setfill('0')），末尾跟一个 '.' 收尾，所以按 4 字符切组正好；
       * 空列表是 `FORBID .`，切不出组 → []，语义也是对的。
       * 这条由 search() 里的 YXSHOWFORBID 触发，是**权威值**，直接覆盖掉
       * refreshForbid() 那套自家近似结果（含轮白走时的空列表）。 */
      S.forbid = (tail.match(/.{4}/g) || []).map(s => [+s.slice(0, 2), +s.slice(2)]);
      paint(false); return;
    }
    if (head === 'DEPTH') { S.depth = +tail || 0; scheduleStatus(); return; }
    if (head === 'SELDEPTH') { S.seldepth = +tail || 0; scheduleStatus(); return; }
    if (head === 'TOTALNODES') { S.nodes = +tail || 0; scheduleStatus(); return; }
    if (head === 'EVAL') {
      const k = S._pv || 0;
      const c = S.cands[k] = S.cands[k] || {};
      c.eval = tail; c.wr = evalToWr(tail); c.done = true;
      // 首路兼作根局面判断。引擎值是**行棋方视角**，行棋方 = 这轮 YXBOARD
      // 对齐后的 S.engStm（识别序盘面上 ≠ sideToMove()，见 search() 里的注释）。
      if (k === 0) { S.root = { blkWr: S.engStm === BLACK ? c.wr : 1 - c.wr, eval: tail }; }
      clearSoftErr();                 // 真的出结果了 → 自愈型提示可以撤
      scheduleUI(); return;
    }
    if (head === 'WINRATE') {
      /* 引擎自己算好的胜率（searchoutput.cpp: INFO("WINRATE", valueToWinRate(value))），
       * 比客户端 sigmoid(EVAL/K) 更可信 —— 它用的是引擎内的真实 ScalingFactor。
       * 紧跟在 EVAL 之后到达，直接覆盖同一条候选的 wr 即可。 */
      const k = S._pv || 0;
      const c = S.cands[k] = S.cands[k] || {};
      const v = parseFloat(tail);
      if (isFinite(v)) {
        c.wr = Math.max(0, Math.min(1, v));
        if (k === 0) S.root = { blkWr: S.engStm === BLACK ? c.wr : 1 - c.wr, eval: c.eval };
      }
      scheduleUI(); return;
    }
    if (head === 'BESTLINE') {
      const ms = tail.match(/\d+,\d+|[A-Z]\d+/g) || [];
      const k = S._pv || 0;
      const c = S.cands[k] = S.cands[k] || {};
      /* 两种坐标格式都要认，但**翻转规则完全不同**：
       *  - `x,y`（Rapfi 的原生格式）：引擎侧 ioCoordMode = NONE，
       *    inputCoordConvert / outputCoordConvert 全走 default 分支即恒等
       *    （core/iohelper.cpp），所以引擎的 y 与棋盘上的 y 同向，**原样用**。
       *    实机验证：黑在 y=3 行摆活四、轮到白走，引擎回 `INFO BESTLINE 7,3`
       *    —— y 就是 3，没有翻。这里曾经写成 N-1-y，会把最佳点画到棋盘另一半。
       *  - `A1` 风格（GTP 约定，行号自底向上）：那种才需要 N-y。
       */
      c.line = ms.map(s => {
        const p = s.indexOf(',');
        return p >= 0 ? [+s.slice(0, p), +s.slice(p + 1)] :
          [LETTERS.indexOf(s[0]), N - (+s.slice(1))];
      });
      c.x = c.line[0][0]; c.y = c.line[0][1];
      /* 落在**已有棋子**上的候选一律作废（置 -1，绘制层与 topN 截断都会跳过它）。
       * 引擎不会把一个被占的点当最佳手，所以出现这种值只可能是旧局面的残留 ——
       * 用户报的「已经下棋了，估值还显示在已经下的地方」正是它。
       * Rapfi 侧本来有 ABOUT 握手把旧输出排干（比 KataGo 严），这刀是保险。 */
      if (!(c.x >= 0 && c.x < N && c.y >= 0 && c.y < N) || stoneAt(c.x, c.y)) { c.x = -1; c.y = -1; }
      scheduleUI(); return;
    }
    if (head === 'MESSAGE') {
      /* MESSAGE 那一行是给人看的摘要，形如：Speed 2.3M nps Depth 5/11
       * 只从它取**速度**。以前这里把 Depth 字段也写进了 S.depth，而那是个
       * "5/11" 字符串 —— 它和 INFO DEPTH 写的数字来回覆盖，S.depth 的类型就在
       * number / string 之间跳：状态栏跟着闪，任何按数值使用它的地方（比如
       * 「深度是否在增长」）都会失效。主深度与选择深度分别由
       * INFO DEPTH / INFO SELDEPTH 提供，都是纯数字，不需要从这行摘要里抠。 */
      const m = /Speed\s+([\d.]+[KMG]?)/.exec(tail);
      if (m) { S.nps = parseNum(m[1]); scheduleStatus(); }
      return;
    }
    if (head === 'ERROR') { onEngineErr(tail); return; }
  },
};

/* ---------- KataGo(Gomoku) 驱动 ---------- */
// 权重：按规则分两份 b10 蒸馏网（b10r 连珠 / b10f 无禁手），由 kataModel() 在启动时挑。
const KATA = {
  id: 'kata', label: 'KataGo 五子棋（KataGomo）',
  boot() {
    this._warned = false;
    this._pn = undefined; this._pt = 0;      // 计算量上次采样，用来估「次/秒」
    this.send('boardsize ' + N);
    this.send('kata-set-rule basicrule ' + (S.rule === 4 ? 'renju' : 'freestyle'));
    this.syncBoard();
  },
  reset() {
    /* 闸门与累积缓存必须随引擎进程一起归零。
     * 不归零 _gateId 的后果很隐蔽：旧进程的回执永远等不到，而新一轮的 `=<id>`
     * 如果和旧值撞上，就会「提前开闸」—— 旧局面的输出又能混进来。 */
    if (this._gateT) { clearTimeout(this._gateT); this._gateT = null; }
    this._gateId = 0;
    this._acc = Object.create(null);
    this._pn = undefined; this._pt = 0;
  },
  send(c) { Eng.send(c); },
  /* 把当前棋谱完整重放到引擎盘面上。
   * 这一步是**必需**的，而且以前整个 App 都漏了：老的 KATA.search() 只发
   * time_settings + kata-genmove_analyze，从头到尾**没发过一条 play** ——
   * 也就是说 KataGo 一直在分析**空盘**，用户摆了多少子对它的结果毫无影响。
   * 引擎级验证（tools/verify_engine.py）抓不到这个：那些测试自己显式发了 play。
   * 只有把「App 实际发出的那串命令」原样回放，才能暴露这种漏发。 */
  syncBoard() {
    this.send('clear_board');
    for (const m of played()) {
      this.send('play ' + (m.c === BLACK ? 'B' : 'W') + ' ' + gtp(m.x, m.y));
    }
  },
  /* 切规则不必**自己**下发：换 b10 之后，规则一变 kataModel() 就一定变，
   * 而 KataGo 的 -model 只能在进程启动时给 —— 于是 bindSeg() 那条
   * 「kataModel() !== kataNetLoaded → restartEngine()」会先行接管，
   * 这里实际上是**兜底分支**（万一以后换回一份能通吃两种规则的网，它就又活了）。
   * 注意：这条属性在 b28 时代是对的（那份网同时支持两种规则，改规则只要重放
   * 盘面即可），换成按规则分开的 b10 之后不再成立，别再按它去推理。 */
  syncRule() {
    this._warned = false;   // 让改规则后的报错能重新浮出来（原本每 boot 只报一次）
    this.send('kata-set-rule basicrule ' + (S.rule === 4 ? 'renju' : 'freestyle'));
  },
  /* 打断：KataGo 是最省事的（gtp.cpp:1269）
   *     //Upon any input line at all, stop any analysis and output a newline
   *     if(currentlyAnalyzing) { currentlyAnalyzing = false; engine->stopAndWait(); cout << endl; }
   * 任何一条输入行到达都会自动停掉分析并等搜索线程收尾 —— 连 stop 都不用发。
   * 实测 clear_board 应答 0.42s（tools/probe_infinite.py）。
   * KataGo 走的是「同步停」，所以 fn 一定是在引擎确实停下之后才被调用 → true。 */
  interrupt(fn) { this.send('clear_board'); fn(true); },
  /* 只停不算（暂停 / 已分胜负）。同样是靠「任意输入行即停」那条语义，
   * 用 clear_board 当那条输入行；盘面会在下一轮 search() 的 syncBoard() 里重放回去。 */
  stop() { this.send('clear_board'); },
  search() {
    this._acc = Object.create(null);
    /* 用 kata-analyze 而不是 kata-genmove_analyze（两条都读源码确认过）：
     *  - analyze() 里写死 searchFactor = 1e40，注释就写着 "go basically forever"，
     *    且 suppressResponse = true → **永不自行结束、也永不落子**（gtp.cpp:812）；
     *  - genmove_analyze 走 genMove()，是阻塞的，结束时会真把一手棋落到引擎盘上
     *    （老代码靠事后补一条 undo 兜）。无限分析下用它很别扭：不返回就没法继续，
     *    硬停又可能真落一子，把引擎盘面和棋谱弄脏。
     * 时间设置必须写成 `0 <读秒> 0`：gtp.cpp:1644 只在「读秒时间>0 且读秒手数=0」
     * 时才给 TimeControls()（= 无时间限制）；写成 0 0 0 会落进 absoluteTime(0)，
     * 那是**零时间**，搜索会瞬间收尾（探针 #1 实测就是这个现象）。 */
    this.syncBoard();
    this.send('time_settings 0 ' + KATA_BYOYOMI + ' 0');
    /* ── 开闸时机：等引擎**确认收到这一轮的 analyze 命令**，再打开 S.accept ──
     *
     * 为什么不能像过去那样「发完命令就把闸门打开」（这是本项目第二个贵坑）：
     *   KataGo 收到任何一行输入都会「停掉分析并等搜索线程收尾」
     *   （gtp.cpp:1269 `if(currentlyAnalyzing){ currentlyAnalyzing=false;
     *   engine->stopAndWait(); cout << endl; }`）。**收尾时搜索线程往往还会再打一行
     *   属于上一个局面的 info**。而 post() 到 startSearch() 之间只有 140ms，
     *   那一行完全可能在这之后才被投递上来 —— 于是：
     *     · 数值是**旧局面**的（用户报的「KataGo 估值有时候会标错」）；
     *     · 候选里还带着刚落下的那个点，圆标就画在了新落的棋子上
     *       （用户报的「已经下棋了，估值还显示在已经下的地方」）；
     *     · 更隐蔽的一层：toMoverWr() 按**当前**行棋方换算视角，旧局面的数据配上
     *       新的行棋方，百分比会被整体翻面 —— 看着像个"差不多对"的数，其实反了。
     *
     * 怎么才能知道「这条 analyze 命令真的被引擎处理了」？用 GTP 命令 id：
     *   带 id 时引擎会回一行 `=<id>`，而它的打印位置就在（gtp.cpp:2189）
     *     //Make sure the "equals" for GTP is printed out prior to the first analyze
     *     //line, regardless of thread racing
     *     if(hasId) cout << "=" << id << endl;
     *   紧接着才 engine->analyze(...)。stdout 严格有序 ⇒ 看到 `=<id>` 就等于：
     *     ① 它之前的一切输出（含旧局面那行收尾 info）**都已经投递完毕**；
     *     ② 新局面第一行 analyze 输出**还没开始**。
     *   正是「可以把闸门打开了」的那一刻。 */
    this._gateId = (this._gateId || 900000) + 1;
    const gid = this._gateId;
    S.accept = false;                    // 关到这一轮的 analyze 回执为止
    if (this._gateT) { clearTimeout(this._gateT); this._gateT = null; }
    /* 兜底：引擎异常时回执可能永远不来，不能让闸门一直关着（那就等于"估值没了"）。
     * 800ms 足够宽（实测起步在几十毫秒级），到点无条件开闸 —— 此时旧输出早该排干。 */
    this._gateT = setTimeout(() => {
      if (this._gateId === gid && !S.accept) { this._gateT = null; S.accept = true; }
    }, 800);
    /* 行棋方 = 下一手摆色（seg 强改语义，与 Rapfi 的 YXBOARD 对齐同一来源）：
     * 切黑白时引擎跟着换视角重算（2026-10-03 老板指令）。 */
    this.send(gid + ' kata-analyze ' + (nextColor() === BLACK ? 'B' : 'W') + ' ' + KATA_INTERVAL_CS);
  },
  onLine(line) {
    if (line[0] === '=' || line[0] === '?') {
      const body = line.replace(/^[=?]\s?/, '').trim();
      /* 开闸回执：`=<id>`（见 search() 里那一长段）。
       * 收到它就说明「旧局面的输出已经全部投递完、新局面的输出还没开始」——
       * 这时候才打开 S.accept，旧局面的数字就再也进不来了。
       *
       * 匹配必须**同时**满足两条，两条都是踩过的：
       *  ① 前缀是 `=` 而不是 `?`。`?<id> 原因` 是引擎拒绝这条命令，
       *     那是**必须报出来的错**，不能当成成功开闸（否则「猜错原因」直接消失）。
       *  ② 正文**恰好**就是那个 id。syncBoard() 的每条 play 都会回 `=`，
       *     见 `=` 就开闸等于没关；而 analyze 的成功回执正文是空的
       *     （suppressResponse=true，只打了 `=<id>` 这一行）。 */
      const g = /^(\d+)$/.exec(body);
      if (line[0] === '=' && g && +g[1] === this._gateId) {
        if (this._gateT) { clearTimeout(this._gateT); this._gateT = null; }
        S.accept = true;
        return;
      }
      /* kata-analyze 不会给结果行；这里收到的 `?` 基本都是引擎拒绝了某条命令
       * （盘面非法、规则不符等）。必须报出来 —— 静默忽略的话，界面上会显示
       * 一份「空盘或旧局面」的分析结果，而用户以为那是在分析自己的棋谱。 */
      if (line[0] === '?' && !this._warned) {
        this._warned = true;
        onEngineErr(body || 'KataGo 拒绝了一条命令');
      }
      return;
    }
    if (line.slice(0, 4) !== 'info') return;
    /* 局面刚改时同理（见 RAPFI.onLine 里那段闸门说明）：
     * 已经 clear_board 但还没发新课目的那段窗口里，引擎可能仍在往外吐
     * **上一个局面**的 info 行。收了它，棋盘上就会挂一份与分析对象不符的选点。 */
    if (!S.accept) return;
    S.outAt = Date.now();
    S.roundOut = 1;                 // 本轮「引擎给过结果」了（见 watchdog ⓪ 节）
    const dm = /depth\s+(\d+)/.exec(line);
    if (dm) S.depth = +dm[1];

    /* 解析。注意两件事（都来自对 KataGomo 源码 cpp/command/gtp.cpp 的逐行核对）：
     *  1) kata-genmove_analyze 把全部候选写在**同一行**、以空格分隔，每段自带 "info" 前缀；
     *     而 kata-analyze(sabaki) 是每路一行。按 "info" 分段再各自解析，两种都能吃。
     *  2) **两根分支的 winrate 量纲不同**，别搞混（gtp.cpp 里是 if/else 两个 lambda）：
     *     - lz-analyze 分支（第 542 行 `args.lz && !args.kata`）：
     *         `cout << " winrate " << round(winrate * 10000.0)` → **万分比整数**
     *     - kata 分支（第 588 行 else，kata-analyze / kata-genmove_analyze / 裸 analyze）：
     *         `out << " winrate " << winrate` → **0~1 浮点**
     *     本 App 走 `kata-genmove_analyze`，实测输出形如 0.00867358，确认是浮点。
     *     下面按「>1 才除 10000」判量纲，两条路都能吃。
     */
    const segs = line.split(/\binfo\b/).filter(s => /\bmove\b/.test(s));
    if (!segs.length) { uiStatus(); return; }
    if (!this._acc) this._acc = Object.create(null);
    for (const s of segs) {
      const mm = /\bmove\s+([A-Za-z]\d+|pass)\b/.exec(s);
      if (!mm) continue;
      const vv = /\bvisits\s+(\d+)/.exec(s);
      const ww = /\bwinrate\s+(-?[\d.]+(?:[eE][+-]?\d+)?)/.exec(s);
      const oo = /\border\s+(\d+)/.exec(s);
      let raw = ww ? parseFloat(ww[1]) : null;
      /* 万分比只可能出自 lz-analyze 那条分支（那边打的是 winrate*10000 的整数）。
       * 带指数的科学计数法（实测引擎会打 `8.67358e-06`）必然是 kata 分支的 0~1 浮点，
       * 直接采信、别再除 10000。老正则写的是 `[\d.]+`，会把 `8.67358e-06` 截成
       * `8.67358` → 误判成万分比 → 再除一万，量级差 100 倍。数值小到看不出颜色变化，
       * 但它确实是个解析错误，顺手修掉。 */
      if (raw !== null && raw > 1 && !/[eE]/.test(ww[1])) raw /= 10000;   // 万分比 → 比例
      const key = mm[1];
      const prev = this._acc[key];
      const cur = { mv: key, visits: vv ? +vv[1] : 0, wr: raw, order: oo ? +oo[1] : 99 };
      if (prev) {                                   // 同一路可能被多行重复刷新，取更长过程
        cur.visits = Math.max(prev.visits, cur.visits);
        if (cur.wr === null) cur.wr = prev.wr;
        cur.order = Math.min(prev.order, cur.order);
      }
      this._acc[key] = cur;
    }

    const list = Object.values(this._acc)
      // KataGo 的 info 行里带 order（引擎自己的排序），有就听它的，没有则按访问量。
      .sort((a, b) => (a.order - b.order) || (b.visits - a.visits));
    // 只展示用户设定的前 N 个（S.topN）。引擎那边 info 行本来就把候选全给了，
    // 这里截断即可 —— 与 Rapfi 用 YXNBEST n 限制个数是等效的。
    /* 顺序很要紧：**先过滤、再截断**。
     * 写成 `list.slice(0, topN).map(…).filter(Boolean)` 时，被丢掉的条目
     * （PASS / 越界坐标 / 未知列字母）照样占着一个名额：用户设了 5 个分析点
     * 却只看到 4 个，而且那一个空位不会被后面的候选补上 —— 明明引擎给了 8 路。 */
    const out = [];
    for (const o of list) {
      const mv = o.mv.toUpperCase();
      if (mv === 'PASS') continue;
      const x = LETTERS.indexOf(mv[0]), y = N - (+mv.slice(1));
      if (x < 0 || x >= N || !(y >= 0 && y < N)) continue;   // 越界/未知列字母直接丢
      /* 已经落子的交叉点不可能是合法着点 —— 收到它只可能是**别的局面**的残留。
       * 这一刀必须下在**解析层**而不是绘制层：它会占掉一个 topN 名额，
       * 而排在第一位的那个还会被当成「首选」写进 S.root，让状态栏那行胜率整体偏掉。 */
      if (stoneAt(x, y)) continue;
      // o.wr 是**引擎原始值**（KataGo 实测为黑方胜率，见 KATA_WR_AS），
      // 两个消费点视角不同，各走各的换算函数（药丸=行棋方，顶部条=黑方）。
      out.push({ x, y, wr: toMoverWr(o.wr), visits: o.visits, blkWr: kataBlkWr(o.wr), mv });      if (out.length >= S.topN) break;
    }
    S.cands = out;
    if (!S.cands.length) { uiStatus(); return; }
    clearSoftErr();                   // 真的出结果了 → 自愈型提示可以撤
    const f = S.cands[0];
    if (f.blkWr !== null && f.blkWr !== undefined) S.root = { blkWr: f.blkWr };
    /* 「计算量」= 所有候选 visits 之和，即这棵搜索树一共模拟了多少个局面。
     * 注意 KataGo **没有** alpha-beta 那种深度：它的 analyze 输出里根本没有 depth
     * 字段（gtp.cpp:625-649 只输出 move/visits/utility/winrate/scoreMean/prior/
     * lcb/order/pv）。所以状态栏对它显示「模拟 N 次」，而不是照搬 Rapfi 的
     * 「深度 D」—— 那样永远只能显示一个空字段，这正是用户报的
     * 「RAP 下面有深度和节点，KataGo 下面什么都没有」。
     * 速度也没有现成的：用两次上报的 visits 增量除以间隔自己估。 */
    const tot = list.reduce((a, c) => a + (c.visits || 0), 0);
    const now = performance.now();
    if (this._pn !== undefined && now > this._pt) {
      const dv = tot - this._pn;
      if (dv > 0) S.nps = Math.round(dv * 1000 / (now - this._pt));
    }
    this._pn = tot; this._pt = now;
    S.nodes = tot;
    /* 必须**显式**刷一次状态栏。
     * Rapfi 那边是靠 INFO DEPTH / SELDEPTH / TOTALNODES 那几行顺带调 uiStatus() 的，
     * 而 KataGo 的 analyze 输出里**没有这类行**（只有 move 条目那一行），
     * 所以少了这一句，状态栏永远停在「引擎名」那一截 ——
     * 用户报的「KataGo 下面什么都没有」正是这个原因，不是没算。 */
    uiStatus();
    scheduleUI(); return;
  },
};
/* 选权重。KataGo 的网是**按规则分开**的，没有哪一份能通吃：
 *   b10r = b10_renju15x.bin.gz（连珠/有禁手蒸馏网，b10c128nbt，约 6MB）
 *   b10f = b10_freestyle15x.bin.gz（无禁手蒸馏网，b10c128nbt，约 6MB）
 * 档名 → jniLibs 里的 libkgnn<tag>.so 由 EngineHost.netTag() 映射。
 *
 * 为什么不是那份 269MB 的 b28c512nbt 满血网（zhizi_renju28b_s1600）：
 * 它确实更"大"，但产品里能给的预算只有一个 —— **时间**，并没有「等访问数」这个选项。
 * 等时间对拍实测（tools/probe_kata_weight_match.py，同机同 8 线程、同每手时间）：
 *   · 每手 2 秒：b28 访问数中位 7，b10 是 460 —— 差约 60 倍；而且 8 局里有 4 局
 *     b28 连一帧都没发出来，直接被判超时
 *   · 每手 6 秒：差距收窄到约 27 倍（b28 中位 100 / b10 中位 2715）
 * 结构上就是 512 通道对 128 通道。用户报告的「KataGo 出估值太慢」正是它造成的。
 * 所以这个决定必须**在等时间下**下 —— 要翻它，请先跑一遍那个对拍脚本，
 * 不要按参数量直觉把 b28 换回来。 */
function kataModel() { return S.rule === 4 ? 'b10r' : 'b10f'; }

/* 这一轮引擎进程里**实际加载**的是哪份网。
 * 规则一改就要拿它比对：KataGo 的 -model 只能在进程启动时给，
 * 没有运行时换网的办法（kata-set-rule 只管规则，换不了权重文件）。 */
let kataNetLoaded = null;
/* 累计引擎启动次数。给自动化断言用：切禁手时 KataGo 必须**真的重开一次进程**
 * （权重只能在启动时指定），而这件事在界面状态里不留痕迹，只能靠计数看。 */
let startCount = 0;
/* 累计发起过几轮搜索。同样只给断言用，而且它盯的是一个**很难一眼看出**的毛病：
 * 「停止回执被当成自然结束」会让引擎每 ~140ms 被重开一次，界面上照样有数字在动、
 * 看着完全正常。判据只能是「静置期间这个计数不再增长」——
 * 见 tools/test_preview.mjs 里那条「引擎不被自己反复打断」。 */
let searchCount = 0;
function gtp(x, y) { return LETTERS[x] + (N - y); }
function parseNum(s) {
  const m = /([\d.]+)\s*([KMG])?/i.exec(String(s));
  if (!m) return 0;
  const v = parseFloat(m[1]); const u = (m[2] || '').toUpperCase();
  return Math.round(v * (u === 'K' ? 1e3 : u === 'M' ? 1e6 : u === 'G' ? 1e9 : 1));
}
/* ---- Rapfi 胜率视角：**行棋方视角**（已用干净局面三连钉死，别再乱改） ---- */
/* 结论（2026-09-22 复测，tools/probe_rapfi_dump.py）：Rapfi 的 `INFO WINRATE` 与
 * `INFO EVAL` 都是**行棋方视角**——即「当前该走棋那一方的胜率」。
 *
 * 为什么值得写这么长的注释：曾经有人（我）用「必杀局面」做探针，
 * 被收尾路径上的那一行骗到，误判成「白方视角」并"改正"了换算 —— 结果把对的改错了。
 * 记下完整的证伪过程，免得下一次再踩：
 *
 *   ✗ 错误做法：拿「黑活四、轮白走」（黑必胜）和「白活四、轮黑走」（白必胜）两个
 *     *必杀* 局面去测。必杀局面下引擎会**极快证出杀棋并收手**，输出来自收尾路径，
 *     样本量常常只有 1 条（实测 B 局面只有 1 条 WINRATE），语义不能当常规分析输出用。
 *     那次就据此误判成「白方视角」。
 *
 *   ✓ 正确做法：用**双方都没成杀**的常规局面，取 50+ 条稳定输出，
 *     看 EVAL 的**正负**与 WINRATE 的**高低**是否同向。实测（rule=0）：
 *       G1 轮白：EVAL −370…−447，WINRATE 0.10…0.18  → 白(行棋方)劣势
 *       G2 轮黑：EVAL +442…+449，WINRATE 0.90       → 黑(行棋方)大优
 *       G3 轮白：EVAL  −64…+17，WINRATE 0.42…0.52   → 均势
 *     G2 是决定性的：行棋方是**黑**而胜率 0.90 —— 若是「白方视角」这里该是 0.10。
 *     ⇒ 只有「行棋方视角」能同时解释三组。
 *
 * 所以下面的换算是**正确**的：引擎值直接当「行棋方胜率」，
 * 换算成黑方胜率时按**这轮引擎实际的行棋方** S.engStm 翻转（search() 里随
 * YXBOARD 对齐结果赋值：成功=nextColor()，降级=sideToMove()）。
 * 改动前请先跑 tools/probe_rapfi_dump.py。
 */

/* Rapfi 分值 → 行棋方胜率（与引擎内部 scoretables.h 同式：sigmoid(eval/K)，K 默认 200）。
 * 视口语义同上：EVAL 与 WINRATE 同为行棋方视角。 */
function evalToWr(e) {
  const m = /^([+-]?)M(\d+)$/.exec(e);
  if (m) return m[1] === '-' ? 0 : 1;
  const v = +e;
  if (isNaN(v)) return 0.5;
  return 1 / (1 + Math.exp(-v / (S.scaleK || 200)));
}

/* ---- KataGo 胜率视角：本项目最贵的一个坑，结论只能来自实机实验，**别凭源码推** ----
 *
 * 结论（2026-09-22 重测，tools/probe_kata_perspective.py）：随包配置
 * （reportAnalysisWinratesAs = BLACK）下，引擎 `kata-analyze` 输出的 winrate 是
 * **黑方胜率**。用户报的「KataGo 估值总会标反」就是它——此前按「白方」换算，
 * 每一个数都翻面。
 *
 * 镜像对指纹（当前引擎构建 eng/out/win/katago.exe + 随包 gtp.cfg + App 同款命令
 * `<id> kata-analyze <色> 8`，b10r 与 b10f 两个权重结论一致）：
 *   局面 A：黑 D8-G8 活四两头开、轮白（黑必胜）→ raw = 1.0000
 *   局面 B：白 D8-G8 活四两头开、轮黑（白必胜）→ raw = 0.0000
 *   白方视角的指纹应为 A≈0/B≈1，行棋方视角应为 A≈0/B≈0 —— 都对不上，
 *   只有「黑方胜率」能同时解释两个局面。
 *
 * **为什么和旧注释写的「白方」相反**：旧的镜像实验（A≈0.0086/B≈0.9935）是在
 * 更早的引擎构建上做的，后来引擎重编过，这条输出语义跟着变了（上游对
 * reportAnalysisWinratesAs 的处理在本分支里本来就来回改过）。教训钉在这里：
 *   ① 这个视角**没有任何稳定契约**——换引擎构建、换权重、改 gtp.cfg 都可能翻面；
 *   ② 每次动过引擎/配置，必须重跑 tools/probe_kata_perspective.py 重新定指纹，
 *      再回来核对这个常量；
 *   ③ 判据永远是「镜像对」：单个局面分不开白方与行棋方视角，必须两个都成立。
 *
 * 注意 Rapfi **不走这条路径**：它的 INFO WINRATE / INFO EVAL 由 RAPFI 驱动自己换算，
 * 是**行棋方视角**（2026-09-22 用三个干净局面复测钉死，见下面 RAPFI 那段注释与
 * tools/probe_rapfi_dump.py）—— 和 KataGo 的黑方视角是两回事，别混用。
 */
const KATA_WR_AS = 'black';   // 2026-09-22 实测指纹：raw = 黑方胜率（改前务必重跑探针）

/* 引擎给的胜率 → 黑方胜率（界面顶部胜率条用这个）。
 * 'mover' 分支的「行棋方」= kata-analyze 指定的行棋方 = nextColor()
 * （盘面差值推算的下一手；识别序盘面上 ≠ sideToMove()，写死会整体错位）。 */
function kataBlkWr(raw) {
  if (raw === null || raw === undefined) return null;
  if (KATA_WR_AS === 'black') return raw;
  if (KATA_WR_AS === 'mover') return nextColor() === BLACK ? raw : 1 - raw;
  return 1 - raw;                                // 'white'：引擎给的就是白方胜率
}

/* 引擎给的胜率 → 行棋方胜率（候选点列表上那个百分比用这个）。
 * 行棋方同理 = nextColor()（与 kata-analyze 的 <色> 参数同源）。 */
function toMoverWr(raw) {
  if (raw === null || raw === undefined) return null;
  if (KATA_WR_AS === 'mover') return raw;
  const blk = kataBlkWr(raw);
  return nextColor() === BLACK ? blk : 1 - blk;
}

/* ---------- 驱动注册 ---------- */
const DRV = { rapfi: RAPFI, kata: KATA };
function drv() { return DRV[S.engine]; }

/* ---------- 引擎事件 ---------- */
let DEV = { cores: 4, memMB: 4000 };
/* 原生侧推来的设备信息 + **点火**。抽成具名函数是为了让下面那处「冷启动补点火」
 * 走同一条路 —— 复制一遍 boot 的逻辑迟早会与这里不一致。 */
let nativeBooted = false;
function nativeInfo(json) {
  try { DEV = Object.assign(DEV, JSON.parse(json)); } catch (e) {}
  // 只在第一次点火。Java 侧每次 start() 之后也会回一条 info（用于刷新核数/内存），
  // 若在这里无条件 boot()，就会形成 boot→Android.start→info→boot 的无限重启。
  if (!nativeBooted) { nativeBooted = true; boot(); }
}
window.__native = {
  info(json) { nativeInfo(json); },
  ready() { onEngineReady(); },
  line(json) {
    let line; try { line = JSON.parse(json); } catch (e) { line = json; }
    if (offline()) return;
    lineCount++;                                  // 只用于自证「刷屏 ≠ 重画」
    try { drv().onLine(line); } catch (e) { console.error(e); }
  },
  /* 引擎崩溃自愈（2026-09-25 补，全面复查问题①）：
   * exit 回调只在「非主动关闭」时才会来（EngineHost 的 closedUpTo/gen 门挡住了
   * 主动 kill），所以走到这里 = 引擎**意外死亡**。统一内存档（恒 512MB / 2^18）之后，
   * 低配机多了一种死法：TT 预分配触发系统内存回收、引擎进程被杀。修这个之前，
   * 用户的唯一出路是「切到另一个引擎再切回来」—— 根本想不到。
   * 处置：有限次自动重启（3 次，带退避）；90 秒内的连续死算连环（防死循环），
   * 撑过 90 秒的运行重新计账；后台里不重启（省电省热），回前台另有兜底
   * （见 onAppHidden）。连坏 3 次才升级成硬错误。 */
  exit(code, msg) {
    S.ready = false; S.searching = false;
    const now = Date.now();
    if (now - crash.last > 90000) crash.n = 0;
    crash.last = now; crash.n++;
    const myGen = ++crashGen;
    if (crash.n <= 3 && !appHidden) {
      setStatus('init', '引擎意外退出，正在自动重启（' + crash.n + '/3）…');
      setTimeout(() => {
        if (myGen !== crashGen || S.ready || appHidden) return;
        restartEngine(true);
      }, 900 * crash.n);
      return;
    }
    setStatus('err', '引擎已退出' + (msg ? '：' + msg : '') + (code ? '（' + code + '）' : '')
                     + exitHint(msg));
  },
  /* App 进入/离开后台（Java 侧 onStop / onStart 调）。见 onAppHidden()。 */
  appHidden(hidden) { onAppHidden(hidden); },
  /* 识谱：Java 侧把相册图解码缩放后以 base64 回传（JPEG）。空串=读流失败后的占位。 */
  image(b64) {
    scanBusyOff();
    if (!b64) { toast('未收到图片数据'); return; }
    decodeImageDataUrl('data:image/jpeg;base64,' + b64, handleImageData);
  },
  /* 识谱：Java 侧读流/解码失败的统一着陆点 */
  scanFail(msg) {
    scanBusyOff();
    toast(msg || '识谱失败');
  },
};

/* 把引擎启动失败最常见的几种 errno 翻成人话，并带上**能自证原因**的机器信息。
 * 背景：曾出现「两个引擎在新机上同时起不来、每次必报错」，而根因是 ELF 只按
 * 4KB 对齐、该机型页大小却是 16KB。现场只有一句英文 errno，看不出是这个原因。
 * 把页大小一起打出来，一眼就能对上，不用再猜。 */
function exitHint(msg) {
  const m = String(msg || '');
  const pg = DEV.page ? '本机 ' + (DEV.page / 1024) + 'KB 页' : '';
  if (/Exec format error/i.test(m)) {
    return '　·　引擎文件被系统拒收' + (pg ? '（' + pg + '）' : '')
         + '，常见原因是引擎的页对齐/架构与系统不符';
  }
  if (/error=2|No such file|not found/i.test(m)) {
    return '　·　引擎文件缺失，多半是随包资源解包失败';
  }
  if (/error=13|Permission denied/i.test(m)) {
    return '　·　引擎文件没有执行权限';
  }
  /* KataGo 的权重是按「文件名后缀」决定要不要 gunzip 的（desc.cpp
   * loadFromFileMaybeGZipped）。Android 侧那两份 b10 权重只能以 jniLib
   * 形式分发、名字被迫叫 libkgnn10r.so / libkgnn10f.so，后缀对不上就会被它拒收。
   * 这条已经在 patches.py 里补掉了，但**留着这句翻译**：万一以后换权重、
   * 换打包方式又踩回去，界面上要一眼看出是「命名」而不是「文件坏了」。 */
  if (/should end with \.txt|loadFromFileMaybeGZipped|Model file/i.test(m)) {
    return '　·　权重文件命名不被引擎接受（KataGo 只看后缀判断是否 gzip）';
  }
  return pg ? '　·　' + pg : '';
}
// 丢弃上一引擎/上一局面的滞留输出
function offline() { return !S.ready; }

/* 引擎崩溃自愈的账本与代际（见 __native.exit 里的注释）。
 * crash.n   —— 90 秒窗口内的连续崩溃次数（≤3 才自动重启）
 * crash.last—— 上次崩溃时刻
 * crashGen  —— 待执行的重启定时器的代际；restartEngine 里 +1，
 *              让「用户手动切引擎」能作废还没跑的自动重启，避免双启动。 */
let crash = { n: 0, last: 0 };
let crashGen = 0;

/* 发起一次引擎启动。**必须**经这里走：它顺带记下这一轮实际加载的是哪份 KataGo 网，
 * 规则切换时要靠这个判断「要不要重开进程」。
 * （KataGo 的 -model 只能在进程启动时给，运行时换不了权重文件。） */
function startEngineNow() {
  const net = S.engine === 'kata' ? kataModel() : '';
  kataNetLoaded = net || null;
  startCount++;
  Eng.start(S.engine, net, S.rule);
}
function boot() {
  setStatus('init', '正在启动 ' + drv().label + '…');
  bindSeg();
  startEngineNow();
}
function restartEngine(fromCrash) {
  crashGen++;                        // 作废任何还没执行的崩溃自动重启
  if (!fromCrash) crash = { n: 0, last: 0 };   // 人为重启 = 重新计账（自动重启那路不许清）
  Eng.kill();
  S.ready = false; S.searching = false;
  S.cands = []; S.root = null; S.forbid = []; S.depth = 0; S.nodes = 0;
  S.nps = 0; S.seldepth = 0; S.extra = ''; S.softErr = false;
  S.ruleApplied = null;          // 新引擎还没被设置过规则，交给 applyRuleIfNeeded()
  S.accept = false;              // 旧引擎的残留输出一律不收（进程杀了，回调可能还在路上）
  /* 「引擎哑了几轮」的账也要归零：那是**上一台引擎**的事，别让它把新引擎
   * 一上来就判成「给不出结果」。 */
  S.roundOut = 0; S.quietRuns = 0; S.wdSilentDone = false;
  paint(true); uiAll(); uiStatus();
  setStatus('init', '正在启动 ' + drv().label + '…');
  setTimeout(startEngineNow, 260);
}
function onEngineReady() {
  S.ready = true;
  S.engineName = drv().label;
  /* 这几个统计量必须**一并清零**。只清 cands/depth/nodes 的话，
   * 切换引擎后上一台引擎的速度还挂在状态栏上 —— 实测就是这样：
   * 切到 KataGo 之后副行仍然写着「292万/s」，那是 Rapfi 的速度。
   * 换引擎＝换了台机器，所有跟这台机器有关的数字都要作废。 */
  S.cands = []; S.root = null; S.depth = 0; S.nodes = 0; S.nps = 0; S.seldepth = 0;
  S.extra = ''; S.softErr = false; S.forbid = [];
  drv().boot();
  /* boot() 里已经按 S.rule 配过规则了（Rapfi 发 INFO RULE，KataGo 发 kata-set-rule），
     所以这里把「已应用」标记对齐，免得第一轮搜索再白改一次规则、把盘面和置换表清掉。 */
  S.ruleApplied = S.rule;
  setStatus('ok', '已就绪');
  // 必须立刻刷新状态栏：上面刚改了 S.engineName，而 setStatus 只管主提示行，
  // 副行(#stSub)是 uiStatus() 拼的。少了这一句，切换引擎后副行会一直挂着
  // **上一个引擎的名字**，直到下一批分析输出碰巧再触发 uiStatus() 才纠正。
  uiStatus();
  schedule(true);
}

/* ---------- 分析调度 ----------
 * 单 worker 串行：任何时刻只跑一个搜索，绝不让两轮搜索抢 CPU 或抢同一个盘面。
 *
 * 与上一版最大的区别：搜索**不再自行结束**（无限分析），所以「用户又摆了一颗子」
 * 这件事必须能**主动打断**正在跑的搜索 —— 否则新一轮要等到天荒地老，界面看着
 * 就是卡死。打断方式因引擎而异，见 RAPFI.interrupt / KATA.interrupt 上方注释。
 *
 * 统一入口是 drv().interrupt(fn)：已空闲则直接 fn()，否则先停搜索、确认引擎真空闲
 * 之后再 fn()。两条引擎都实现了，所以 pump() 这边不必区分。
 */
let kick = null;
function schedule(immediate) {
  S.dirty = true;
  if (kick) clearTimeout(kick);
  kick = setTimeout(() => { kick = null; pump(); }, immediate ? 0 : 140);
}
/* 把 S.rule 真正下发到引擎 —— **必须在引擎空闲时**做。
 *
 * 这就是用户报的「切换有无禁手，棋盘上的估值没有变化，估计是引擎也没有变化」：
 * Rapfi 在思考期间会静默丢弃除 STOP 之外的一切命令
 * （gomocup.cpp:801-805 的 `else if (thinking) return false;`），
 * 而旧代码是在 bindSeg() 里**同步**发 `INFO RULE` 的 —— 那一刻它几乎一定在跑
 * 无限搜索，于是命令被丢掉、引擎规则压根没变，估值自然一模一样。
 *
 * 现在的时机：pump() 走 drv().interrupt(fn)，fn 在「引擎确认空闲」之后才被调用，
 * 于是 `INFO RULE` 一定进得去；紧接着 startSearch() 重发的 YXBOARD 正好补上
 * 那条命令的副作用（Rapfi 改规则会 board->newGame() 清盘，gomocup.cpp:237-240）。
 *
 * 只在真的不一致时才发：Rapfi 每次改规则都会清置换表，每轮都重发会让它永远加深不了。
 *
 * confirmed 参数：本次下发是不是在「引擎**已被确认空闲**」的握手里做的。
 * 只有确认过的才敢把 S.ruleApplied 记上账，理由见下。 */
function applyRuleIfNeeded(confirmed) {
  if (S.ruleApplied === S.rule) return;
  drv().syncRule();
  /* 握手**超时**那条路只是「硬着头皮发一次」，不能当成功。
   * 超时意味着引擎很可能还在思考，而 Rapfi 在 thinking 期间会静默丢弃除 STOP 外的
   * 一切命令（gomocup.cpp:804）—— `INFO RULE` 照样进不去。若在那里把 ruleApplied
   * 记成已同步，下一轮连试都不会再试，规则就**永久**停在错误的档上：
   * 表现与当初那个「切换有无禁手，估值一点没变」一模一样，而且再也不会有第二次机会。
   * 所以超时路径把 ruleApplied 留成 null，下一轮接着试。 */
  S.ruleApplied = confirmed ? S.rule : null;
}
function pump() {
  if (!S.ready || !S.analyzing) return;
  /* 退到后台了：不再排新的一轮。当前那一轮已经在 onAppHidden() 里停掉了，
   * 这里再挡一道是防「停完引擎之后又有别的路径把它排起来」。 */
  if (appHidden) return;
  if (S.winline || S.forbidOver) {
    /* 已经终局（五连/黑长连/禁手落子）—— 必须把引擎**真的停下来**。
     * 旧代码在这里直接 return：那台「无限分析」的引擎会在后台一直算下去，
     * 线程占满、手机发烫；更要紧的是它算的是**终结前**的局面，输出照样进 onLine
     * 把刚清空的 S.cands 又填回来 —— 棋盘上于是留着几颗「上一手局面」的胜率胶囊，
     * 而且会一直留着（引擎不停，就永远有新输出把它填回去）。
     * （S.accept 也在 post() 里关掉了，两道保险。）
     * 终局后用户仍可继续摆子（2026-10-10 老板指令），摆完 post() 会再进这里 ——
     * 只加不删，终局局面恒在，引擎保持停手、胜率定格。 */
    if (S.searching) { S.searching = false; drv().stop(); }
    /* 胜率定格：恰五=胜方 1/0；黑长连与禁手落子=黑负 0。 */
    S.root = { blkWr: (S.winline && !S.winOver)
      ? (stoneAt(S.winline[0][0], S.winline[0][1]) === BLACK ? 1 : 0) : 0 };
    S.cands = []; uiAll(); return;
  }
  S.dirty = false;
  S.searching = false;          // 旧搜索即将作废（interrupt 保证它在引擎侧也停掉）
  /* 这里**不再**清 S.cands / S.root。位置没变、只是又开一轮搜索，
   * 旧值该继续显示到新值到达为止。以前每轮都清零再逐条填回来，
   * 棋盘上的数字就一明一灭 —— 那正是用户说的「估值还是会不断闪烁」。
   * 真正需要清空的时机只有两个：post()（位置变了）和换引擎/换规则。 */
  uiAll();
  setStatus('busy', '分析中…');
  drv().interrupt(ok => { applyRuleIfNeeded(ok); startSearch(); });
}
function startSearch() {
  // interrupt 的握手是异步的，等它回来时这些前提可能已经变了，逐条复查。
  if (!S.ready || !S.analyzing || S.winline || S.forbidOver) return;
  S.searching = true;
  searchCount++;
  /* 「这一轮引擎有没有给过**可用的分析输出**」。
   *
   * 必须用它，而不是「原生桥送了几行」：GTP 的 `=<id>` 回执、Rapfi 的 `name="Rapfi"`
   * （ABOUT 回包）都算「一行」，可它们只证明**进程活着**，不证明它在出结果。
   * 实测的故障形态恰恰是「回执 1ms 就回来、然后一个字都没有」
   * （tools/probe_kata_silent.py）—— 拿行数当判据就会把它误判成「刚说过话」。
   * 所以这个标志位只在两个驱动**真正收下一条属于当前局面的输出**时置 1，
   * 也就是紧挨着 `S.outAt = Date.now()` 那两个点。 */
  S.roundOut = 0;
  /* 新一轮真正要下发了 —— 从这里开始，引擎输出才属于当前局面（闸门打开）。 */
  S.accept = true;
  S.outAt = Date.now();
  // 同上：不清 cands。上一轮的数字留在棋盘上，等这一轮的新值覆盖。
  drv().search();
}
function afterSearch() {
  /* 走到这里只可能是**引擎自己**结束了搜索（证出必胜/必败等；KataGo 走
   * kata-analyze，永不自行结束）。既然它自己停了，那它此刻确实是空闲的 ——
   * 把本地认知同步过去。这一步很关键：不然后面的 interrupt() 会以为它还在算、
   * 白发一条 YXSTOP（引擎空闲时这条不产生回执），账本就此错开一格。 */
  RAPFI._idle = true;
  S.searching = false;
  uiAll();
  // 持续分析：立即续跑（TT 保留 → 逐轮加深）
  // 退后台时不续跑（见 onAppHidden）：否则引擎自己收尾的那一下会把循环重新点着。
  if (S.analyzing && !S.winline && !S.forbidOver && !appHidden) schedule(false);
  else setStatus(S.ready ? 'ok' : 'err', '停止');
}

/* ---------- 兜底体检：治「估值莫名其妙没有了」 ----------
 *
 * 为什么需要它
 * ------------
 * 「分析在跑、棋盘上却一个候选都没有」这个状态，界面自己**看不出来** ——
 * 画面上只是「没有数字」，和「还没算完」长得一模一样。用户报的
 * 「为什么 RAP 的估值没有了」就是这类：真引擎侧正常（tools/probe_rapfi_app.py
 * 录到 61 组 INFO EVAL），所以只可能是「某一环没接上」：
 * 握手超时把待办丢了、命令被门禁吞了、原生桥没把 ready 回调送回来……
 * 这些都不该靠用户描述来定位。
 *
 * 判据取「该有候选却没有」：只要分析在跑、没分胜负、引擎就绪，
 * 候选迟早会来（真机实测首轮 <150ms）。连续 STARVE_MS 一个都没有 = 某一环断了。
 * 处置分两步：**先自愈**（重发搜索），连试 3 次仍无结果才**报出可核对的事实**
 * （收到了多少行引擎输出）—— 而不是继续留一块空白棋盘让用户猜。
 */
const WD_TICK_MS = 1500, WD_MAX_RETRY = 3;
/* 「多久没候选才算断链」按引擎分档：
 *   Rapfi 是 alpha-beta，首轮详情**毫秒级**就出来（真机实测 <150ms），4.5s 足够宽。
 *   KataGo 是 MCTS，只按上报间隔（KATA_INTERVAL_CS）吐 analyze 行，而它在本机
 *   只有个位数访问/秒 —— 慢机上前几次上报可能还没有像样的访问数。给 15s，
 *   免得把「慢」误判成「坏了」，那会变成自己打扰自己。 */
function wdStarveMs() { return S.engine === 'kata' ? 15000 : 4500; }
/* 「引擎停手多久」算该续跑。取 2.5s：正常握手在百毫秒级，绝不该撞上；
 * 而真的断了的时候，用户最多等 2.5s 就恢复，观感上像「顿了一下」而不是卡死。 */
const WD_IDLE_MS = 2500;
/* 「引擎一条结果都没给」多久算异常。
 *   KataGo 每 0.08s 上报一次（KATA_INTERVAL_CS = 8），安静 3.5s 已经等于
 *   连丢 40 多次上报，不可能是「刚好在忙」；Rapfi 是 alpha-beta，首轮详情
 *   毫秒级就出来，2.5s 同样宽裕。
 *   这个阈值比 WD_IDLE_MS 宽松一点，是因为它要判的是**更严重**的事
 *   （引擎完全哑了），宁可多等一会儿，也不要冤枉一个正在出结果的引擎。 */
function wdQuietMs() { return S.engine === 'kata' ? 3500 : 2500; }
S.starveSince = 0; S.wdRetry = 0;
S.quietRuns = 0;            // 连续「重排一轮之后引擎仍然一条结果都没给」的次数
S.wdSilentDone = false;     // 「引擎给不出结果」这条结论是否已如实报出（只报一次）
/* ② 那条判据（「该有候选却一个都没有」）的结论有没有报过。
 *
 * 这个键原本**没有在这里声明**，靠隐式 undefined 跑。同族的 quietRuns / wdRetry /
 * starveSince / wdSilentDone 四个全都显式初始化了，唯独它没有。undefined 恰好是
 * falsy，所以行为上等价于 false，**当时并没有出错** —— 这里补上纯粹是为了
 * 「同一族状态变量用同一种写法」，免得读代码的人以为漏了初始化而去乱补。
 *
 * ⚠ 曾经（就在本次复查里）把它误判成一个真缺陷，说「post() 没清它 → 换局面后
 *   报错会被永久吞掉」。**那个诊断是错的**，记在这里免得再被"想当然"一次：
 *   进到 `if (S.wdDone) return` 必须先满足 `wdRetry > WD_MAX_RETRY`，而 wdRetry
 *   是**单调递增**的（同样只在 cands 非空时才清）—— 所以第一次冲到上限时
 *   wdDone 必然是 false，报错一定会出，post 清不清它都不改变这一点。
 *   实测脚本（三个版本）跑下来修复前后轨迹**逐行相同**，才把这个误判钉掉。
 *   真正让"该报不报"的从来不是这个变量。 */
S.wdDone = false;
function watchdog() {
  if (!S.ready || !S.analyzing || S.winline || S.forbidOver) { S.starveSince = 0; S.wdRetry = 0; return; }
  /* 在后台就什么都不查、也什么都不重排：那一轮是被我们**故意**停掉的，
   * 体检在这里只会把引擎反复叫醒 —— 既费电，又正好抵消掉「退后台停分析」的意义。 */
  if (appHidden) { S.starveSince = 0; S.wdRetry = 0; return; }
  const now = Date.now();
  const silent = !S.roundOut;      // 这一轮引擎一条可用的分析输出都没给过
  if (S.roundOut) { S.quietRuns = 0; S.wdSilentDone = false; }

  /* ⓪ **引擎一条结果都没给** —— 必须先判这一条，且**不看 S.searching / S.cands**。
   *
   * 为什么单独立这一条：旧实现只有下面 ① 和 ② 两个判据，而 ① 要求
   * `!S.searching`、② 要求「一个候选都没有」，于是
   *     「搜索还在跑（S.searching 为真）」＋「上一轮的候选还挂在棋盘上（S.cands 非空）」
   * 时两条同时为假 → 界面**永久冻在旧数字上，一个字都不报，也不自愈**。
   * 用户报的「点返回键后引擎直接卡死」就是这个状态：棋盘上的估值不动了，
   * 状态栏却一直写着「分析中…」，只能重启 App。
   *
   * 而「引擎接受命令但不给结果」是**实测存在**的真实故障形态，不是假想：
   * tools/probe_kata_silent.py 里有一个局面，`<id> kata-analyze` 回执 1ms 就回来，
   * 但此后 20s 一行 info 都没有，加 minmoves / 换上报间隔 / 换权重（b10 与 b28
   * 各试一遍）都逼不出来；而同一个盘面换成 kata-analyze **另一个行棋方**却正常。
   * 属于引擎侧「这一轮它给不出候选点」。
   * 遇到这种局面，界面唯一的正确姿势是：如实报出来 + 有限次重排 + 不再空转。
   *
   * 判据用 `S.roundOut`（本轮有没有收下过一条**属于当前局面**的分析输出），
   * 不用「原生桥收了几行」—— GTP 的 `=<id>` 回执、Rapfi 的 ABOUT 回包都是「行」，
   * 它们只证明进程活着。用行数当判据，恰好会把「回执正常、然后一个字都没有」
   * 这种最需要被发现的情况误判成「刚说过话」。
   *
   * 重排次数封顶（WD_MAX_RETRY）且每次都会刷新 S.outAt，所以这里不会变成
   * 「140ms 喂自己一次」那种永动机 —— 两次自动重排之间至少隔 wdQuietMs()。 */
  if (S.outAt && silent && now - S.outAt > wdQuietMs()) {
    S.outAt = now;
    S.quietRuns = (S.quietRuns || 0) + 1;
    if (S.quietRuns <= WD_MAX_RETRY) {
      setStatus('busy', '引擎没有返回结果，正在重排（' + S.quietRuns + '/' + WD_MAX_RETRY + '）…');
      schedule(true);
      return;
    }
    if (!S.wdSilentDone) {
      S.wdSilentDone = true;
      /* 说实话，而不是继续写「正在续跑…」骗自己。用户至少知道：
       * 不是他在等，而是这个局面引擎给不出候选点（实测确实存在这种局面）。
       * 一旦动一下棋盘（落子/前进/后退）或换引擎，这条会被清掉重新来过。 */
      onEngineErr('引擎没有返回分析结果（这个局面它给不出候选点）', true);
      uiStatus();
    }
    return;
  }

  /* ① 引擎已经停手，界面却还写着「分析中」——**结果有、但再也不更新**。
   *
   * 这一类和下面那条判据正好互补，而且旧实现完全够不着：旧判据盯的是
   * 「一个候选都没有」，可这一类恰恰是**有候选**（上一批留在棋盘上没被清），
   * 于是永远不触发 —— 画面定格、数字不动，用户只能重启 App。
   * 会走到这里的典型原因：停止回执被误判成自然结束、握手待办丢了、
   * 或者是引擎自己收尾后没人续跑。
   * 处置只有一句：既然不该停，那就重新排一轮。
   * （`S.roundOut` 为真才走这条：零输出的情况已经由 ⓪ 处理，
   *   两条都开火会互相触发，把重排做成 140ms 一次的自喂循环。） */
  if (S.roundOut && !S.searching && S.outAt && now - S.outAt > WD_IDLE_MS) {
    S.outAt = now;                       // 给这一轮留出时间，别每个 tick 都重排
    setStatus('busy', '引擎停手，正在续跑…');
    schedule(true);
    return;
  }

  /* ② 该有候选却一个都没有（原判据）。 */
  if (S.cands && S.cands.length) { S.starveSince = 0; S.wdRetry = 0; S.wdDone = false; return; }
  if (!S.starveSince) { S.starveSince = now; return; }
  if (now - S.starveSince < wdStarveMs()) return;
  S.starveSince = now;
  S.wdRetry++;
  if (S.wdRetry <= WD_MAX_RETRY) {
    setStatus('busy', '未收到分析结果，正在重试（' + S.wdRetry + '/' + WD_MAX_RETRY + '）…');
    /* 只重发一轮搜索，不在这里动握手状态：如果握手链还活着，interrupt 会
     * 把待办换成这一份（单飞，不会起第二条链）；如果它已经超时，
     * _poll() 的超时分支会照常把待办执行掉。两条路都会收敛。 */
    schedule(true);
    return;
  }
  if (S.wdDone) return;                       // 只报一次，不刷屏
  S.wdDone = true;
  /* 把「卡在哪」写成可核对的事实：有没有收到行、搜索有没有启动。
   * 这两句能直接区分「引擎哑了」和「命令没进去」——比任何猜测都有用。
   * 标成 soft：这是**自愈型**结论（下一段就重试），一旦又开始出结果就该撤掉。 */
  onEngineErr('等不到分析结果（已收 ' + lineCount + ' 行，'
    + (S.searching ? '搜索在跑' : '搜索未启动') + '）', true);
}
setInterval(watchdog, WD_TICK_MS);

/* 「已算 Ns」的节拍器：每 500ms 刷一次状态栏，让静默秒数**走起来**。
 * 不担心 DOM 压力：setText 只在文本真的变了时才写 —— 秒数每秒才变一次，
 * 其余时候这次调用什么也不写。暂停/终局/后台时闸门直接跳过。 */
setInterval(() => {
  if (S.analyzing && S.ready && !S.winline && !S.forbidOver && !appHidden) uiStatus();
}, 500);

/* ---------- 棋盘绘制 ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d');
let cell = 0, padL = 0, padT = 0, CW = 0, DPR = 1;
const COL = {
  bg: '#f3ead7', line: '#b9a889', star: '#a5946f', coord: '#a2906f',
  blk: '#191817', wht: '#ffffff', whtEdge: '#c3b8a4',
  last: '#e0533f', win: '#2f8fd8', winLose: '#d9534f',
  // 候选点：第 1 选最醒目，其余依次变淡
  cand1: '#d0342c', cand1Bg: '#cf2f27', candBg: '#f6efe3', candBd: '#cf7a72',
  forbid: '#d9534f',
};
/* 边距用「格数」表达，这样不同屏宽下比例一致。
 *   左右各 KX 格 → 放两行竖向坐标
 *   上方 KT 格  → 放一行横向坐标
 *   下方 KB 格  → 放一行横向坐标 + 一行局面胜率（所以比上方多）
 * cell 由「水平/竖直两个约束里更紧的那个」定，避免窄高屏上棋盘被压扁或溢出。 */
const KX = 0.92, KT = 0.72, KB = 1.26;
function resize() {
  const wrap = document.querySelector('.board-wrap');
  const mainEl = document.querySelector('main');
  /* 可用高度 = main 高度 − 其余所有兄弟元素占位。
   * 必须**排除** .grow：它是 flex:1 的弹性占位，高度由「剩余空间」决定，
   * 把它算进来就会形成正反馈（canvas 变小 → 它变大 → 可用更小 → 死循环）。
   * 这也顺手去掉了原来写死的 `window.innerHeight - 330` —— 那种魔法数字
   * 每次增删一行控件都要跟着改，改漏了就是一个黑洞般的空白或溢出。 */
  let used = 0;
  for (const el of mainEl.children) {
    if (el === wrap || el.classList.contains('grow')) continue;
    const r = el.getBoundingClientRect();
    const c = getComputedStyle(el);
    used += r.height + (parseFloat(c.marginTop) || 0) + (parseFloat(c.marginBottom) || 0);
  }
  const wcs = getComputedStyle(wrap);
  used += (parseFloat(wcs.paddingTop) || 0) + (parseFloat(wcs.paddingBottom) || 0)
        + (parseFloat(wcs.marginTop) || 0) + (parseFloat(wcs.marginBottom) || 0);

  const availH = Math.max(200, mainEl.clientHeight - used);
  const w = Math.max(220, Math.min(wrap.clientWidth, availH));

  DPR = window.devicePixelRatio || 1;
  cv.width = w * DPR; cv.height = w * DPR;
  cv.style.width = w + 'px'; cv.style.height = w + 'px';
  CW = w;

  cell = w / Math.max((N - 1) + 2 * KX, (N - 1) + KT + KB);
  padL = (w - (N - 1) * cell) / 2;        // 水平居中
  padT = cell * KT;
  paint(true);                            // 尺寸变了必须立刻重画（签名里含 CW，本就不同）
}
function gx(i) { return padL + i * cell; }
function gy(j) { return padT + j * cell; }

let moveNoRun = [];     // 本帧真正画在棋子上的序号，供自动化检查（见 __dbg.movenos）

function draw() {
  const R = Math.max(3.2, cell * 0.44);
  moveNoRun = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, CW, CW);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, CW, CW);
  // 网格
  ctx.strokeStyle = COL.line; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < N; i++) {
    ctx.moveTo(gx(i), gy(0)); ctx.lineTo(gx(i), gy(N - 1));
    ctx.moveTo(gx(0), gy(i)); ctx.lineTo(gx(N - 1), gy(i));
  }
  ctx.stroke();
  // 星位
  ctx.fillStyle = COL.star;
  for (const [sx, sy] of [[3, 3], [11, 3], [3, 11], [11, 11], [7, 7]]) {
    ctx.beginPath(); ctx.arc(gx(sx), gy(sy), Math.max(1.8, cell * 0.09), 0, 7); ctx.fill();
  }
  drawCoords();
  // 棋子（黑/白 + 手数序号）。识别导入的子带 q:1 不占号，之后手摆的第一手
  // 序号 = 1（2026-10-03 老板指令「识别后下一手为 1」，无校对态）。
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const k = y * N + x, c = S.board[k]; if (!c) continue;
    drawStone(x, y, c, R, S.moveNo ? S.moveNo[k] : 0);
  }
  // 最后一手
  if (S.lastMove) {
    ctx.strokeStyle = COL.last; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(gx(S.lastMove.x), gy(S.lastMove.y), R * 0.55, 0, 7); ctx.stroke();
  }
  // 连五
  // 连五横线（v1.0.35 老板指令）：赢的长连和五连画蓝线；输的长连（黑长连禁手
  // 判负）画红线 —— 红线就是「这排是造成判负的长连」，与禁手红叉同色系。
  if (S.winline) {
    ctx.strokeStyle = S.winOver ? COL.winLose : COL.win;
    ctx.lineWidth = Math.max(2.4, cell * 0.1); ctx.lineCap = 'round';
    const a = S.winline[0], b = S.winline[S.winline.length - 1];
    ctx.beginPath(); ctx.moveTo(gx(a[0]), gy(a[1])); ctx.lineTo(gx(b[0]), gy(b[1])); ctx.stroke();
    ctx.lineCap = 'butt';
  }
  // 禁手
  ctx.strokeStyle = COL.forbid; ctx.lineWidth = Math.max(1.6, cell * 0.075);
  for (const [x, y] of (S.forbid || [])) {
    const s = cell * 0.20;
    ctx.beginPath();
    ctx.moveTo(gx(x) - s, gy(y) - s); ctx.lineTo(gx(x) + s, gy(y) + s);
    ctx.moveTo(gx(x) + s, gy(y) - s); ctx.lineTo(gx(x) - s, gy(y) + s);
    ctx.stroke();
  }
  drawCands();
  drawMoverWr();
}
/* 识谱校对的红圈标记已删（老板实测：多此一举）—— 低置信信息只在 toast 里
 * 提一句数量，识别错了用户自己点棋子删 / 点空点补。校对模式本身已删
 * （2026-10-03 老板指令），conf 数据层仅存于识别算法内部。 */

/* ---------- 重画闸门：治「分析的时候总闪烁」 ----------
 *
 * 现象与成因（用户报的「总闪烁」就是这个）：
 * 引擎输出是**一行一行**来的，原先每一行都走 uiAll() → draw()，而 draw() 是
 * 「清屏 + 全量重画」。Rapfi 一轮迭代里对每个候选会先发 BESTLINE（落点）、再发
 * EVAL、再发 WINRATE，于是同一轮迭代内 cands[] 会被**逐条填满**，界面就跟着
 * 重画十几次：先只有 1 个标签、然后 2 个、3 个……标签位置和文字都在跳，
 * 看上去就是闪。KataGo 每 0.5 秒一次上报，同样会整屏重画。
 *
 * 两层处理：
 *  ① 内容闸门 —— renderSig() 把「所有会影响画面的输入」压成一个字符串，
 *     和上次画完时的签名比，一样就**直接不画**。引擎刷得再勤也无所谓。
 *  ② 节拍闸门 —— 内容确实变了也至少间隔 PAINT_MIN_MS 再画。手机上引擎正占满
 *     CPU，界面跟着 60fps 重画既抢 CPU 又让人眼花；~9fps 足够看清。
 *     中间的多次变化自动合并到一次绘制（画的时候读的是最新状态）。
 *
 * 用户操作（落子/悔棋/清空/改规则/改变尺寸）走 paint(true) 强制立即生效 ——
 * 手感不能有延迟，节流只针对引擎输出驱动的刷新。
 */
const PAINT_MIN_MS = 110;
let paintedSig = '', paintT = null, lastPaintAt = 0;
let paintCount = 0;     // 真正落到画布上的重画次数（只读，供自动化检查盯「闪烁」）
let lineCount = 0;      // 引擎吐给界面的总行数（同一份检查的对照量）

/* 把一切会影响画面的状态压成签名。宁可多塞几个字段，也别漏 —— 漏一个就是
   「状态变了但界面不更新」的隐性 bug（比闪烁难查得多）。 */
function renderSig() {
  const b = [];
  // 只压**可见**的那部分（游标之前）。游标之后的手不在画面上，不该进签名。
  for (const m of played()) b.push(m.x, m.y, m.c);
  const c = (S.cands || []).map(o => o
    ? (o.x + ',' + o.y + ','
       + (o.wr === null || o.wr === undefined ? '-' : Math.round(o.wr * 100)) + ','
       + (o.eval === undefined || o.eval === null ? '' : o.eval))
    : '-');
  return CW + '|' + S.rule + '|' + S.topN + '|' + S.cursor + '|' + b.join(' ') + '|' + c.join(' ') + '|'
       + (S.root && typeof S.root.blkWr === 'number' ? Math.round(S.root.blkWr * 1000) : '-') + '|'
       + (S.forbid || []).map(p => p[0] + '.' + p[1]).join(' ') + '|'
       + (S.winline ? S.winline.map(p => p[0] + '.' + p[1]).join(' ') : '') + '|'
       + (S.winOver ? 'O' : '') + (S.forbidOver ? 'F' : '') + '|'
       + (S.lastMove ? S.lastMove.x + '.' + S.lastMove.y : '');
}
function paint(force) {
  if (force) {
    if (paintT) { clearTimeout(paintT); paintT = null; }
    paintNow();
    return;
  }
  if (renderSig() === paintedSig) return;      // 画面内容没变 → 不重画
  if (paintT) return;                          // 已排队，合并掉这次
  const wait = Math.max(0, PAINT_MIN_MS - (performance.now() - lastPaintAt));
  paintT = setTimeout(() => { paintT = null; paintNow(); }, wait);
}
function paintNow() {
  paintedSig = renderSig();
  lastPaintAt = performance.now();
  paintCount++;
  draw();
}

/* 双坐标：横坐标在**棋盘上下各一行**，竖坐标在左右各一列。
 * 上下坐标的数字与原实现保持一致（自顶向下 N..1），
 * 因为 Rapfi 的输出坐标系就是这个方向（ioCoordMode=NONE 恒等，实测不翻转），
 * 换了方向会与引擎回传的坐标对不上。
 * coordRun 记录本次真正画了哪些坐标文字，供自动化检查用（见 __dbg.coords）。 */
let coordRun = [];
function drawCoords() {
  coordRun = [];
  const fs = Math.max(7, cell * 0.34);
  ctx.fillStyle = COL.coord;
  ctx.font = fs + 'px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const yTop = gy(0) - KT * cell * 0.58;
  const yBot = gy(N - 1) + KB * cell * 0.36;
  for (let i = 0; i < N; i++) {
    put(DISP_LETTERS[i], gx(i), yTop);
    put(DISP_LETTERS[i], gx(i), yBot);
  }
  const xL = padL - KX * cell * 0.50;
  const xR = gx(N - 1) + KX * cell * 0.50;
  for (let i = 0; i < N; i++) {
    put(String(N - i), xL, gy(i));
    put(String(N - i), xR, gy(i));
  }
  function put(t, x, y) {
    ctx.fillText(t, x, y);
    coordRun.push({ t: t, x: x, y: y, fs: fs });
  }
}

/* 棋盘上的分析选点。
 *
 * 需求：① 胜率直接写在棋盘上；② **不许乱、不许闪**。
 *
 * 以前的做法是「浮动避让」：从落点周围的 8 个方位 × 3 圈距离里挑第一个不重叠的
 * 位置，挑到外圈还补一条引线。问题是那个布局**依赖数值**：胶囊宽度由文字宽度决定，
 * 而文字是 Math.round(wr*100)+'%' —— 胜率在搜索中不断变化，于是
 *   「9%」(2 字符) → 「10%」(3 字符) → 「100%」(4 字符)
 * 每变一次，胶囊就换一个宽度，于是重新挑位置、整屏数字跟着搬家。
 * 用户看到的「估值标得太乱」「估值还是会不断闪烁」，根子在这里。
 *
 * 现在的做法是**固定位置、固定尺寸、圆形**：
 *   - 圆**正好压在它自己的交叉点上**（圆心 = 落点），不浮动、不引线；
 *   - 圆的直径只由 cell 决定，**与数值无关**（0.86 格）；
 *   - 字号允许按文字长度自适应，但它只影响圆**内部**的字形大小，
 *     不影响圆的位置和外形 —— 所以数值怎么变，画面都不会动。
 *
 * 「圆的」这条是用户后来说的（原本是横长的胶囊）。圆看起来更像「一个点」，
 * 但代价是**装字的空间变小了**：横排 4 个字符（"100%"）现在必须塞进一个圆里，
 * 所以字号要按「圆内的可用弦长」收缩，见下面 avail 那一段。
 *
 * 直径压在 1 格以内还有个好处：相邻两个候选的圆永远不会相碰
 * （中心距恰好 1 格，而「直径 + 两侧光环」< 1 格）。
 *
 * 「< 1 格」这条是**看像素**才定下来的：0.98 格时只剩 0.5px 缝，
 * 候选点常常连着几个落在同一横排，标记会首尾相接糊成一条红带
 * （用户看到的「标得太乱」还没根治干净）。定在 0.86 格 + 一圈棋盘色光环后，
 * 相邻标记之间始终隔着一条约 7px 的底色。**换成圆时直径取得就是过去胶囊的宽度**，
 * 所以这道缝的宽度一点没变，原先调好的手感原样保留。
 *
 * lastLabels 记录最终放置结果，供自动化检查断言「每个候选都写了胜率、
 * 且标签都锚定在自己的落点上」（见 __dbg.labels）。 */
let lastLabels = [];
function drawCands() {
  lastLabels = [];
  const list = (S.cands || []).filter(c => c
    && c.x >= 0 && c.x < N && c.y >= 0 && c.y < N
    /* 已经落子的交叉点上**永远**不画估值。
     * 引擎不会把一个被占的点当候选，所以真出现这种条目只可能是「旧局面的输出
     * 混进了新局面」—— 用户报的「已经下棋了，估值还显示在已经下的地方」就是它。
     * 这里是最后一道保险（源头在 KataGo 的闸门回执、以及两个驱动各自的过滤）。 */
    && !stoneAt(c.x, c.y));
  if (!list.length) return;
  /* 固定尺寸：只跟棋盘格大小有关，跟胜率数值无关。
   *
   * 直径取 0.86 格 —— 与它替换掉的胶囊**同宽**，于是「相邻两个标记之间的缝」
   * 与过去完全一致（0.14 格），不必重新调参：候选点常常连着几个落在同一横排，
   * 缝只要小于 2~3px 就会糊成一条红带。 */
  const d = cell * 0.86;                     // 圆直径
  const halo = cell * 0.06;                  // 光环宽度：让相邻的圆之间始终有一条棋盘色
  const rad = d * 0.5;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < list.length; i++) {
    const c = list[i];
    const txt = (c.wr === null || c.wr === undefined)
      ? (c.eval ? String(c.eval) : '—') : Math.round(c.wr * 100) + '%';
    const px = gx(c.x), py = gy(c.y);
    const r = { x: px - rad, y: py - rad, w: d, h: d };
    /* 先铺一圈棋盘底色的光环，再画圆本体。
     * 光环不是装饰：它把「圆贴着棋盘」这件事变成「圆浮在棋盘上」，
     * 于是两个相邻的圆之间永远隔着一条底色 —— 即使只差 3px 也不会看起来是连体的。 */
    ctx.beginPath(); ctx.arc(px, py, rad + halo, 0, 7);
    ctx.fillStyle = COL.bg;
    ctx.fill();
    /* 字号：先给一个舒服的值，再按**圆内的可用弦长**收缩。
     * 圆的横向空间比同宽的胶囊少（横排的字要嵌进弧里），所以目标取直径的 0.90：
     * 字高只有 0.42 直径，落在 ±fs/2 处的弦长约 0.98 直径，取 0.90 留出余量，
     * 「100%」这种 4 字符串也不会顶到圆周上。 */
    let fs = Math.min(cell * 0.42, d * 0.42);
    ctx.font = '700 ' + fs.toFixed(1) + 'px system-ui,sans-serif';
    const tw = ctx.measureText(txt).width;
    const avail = d * 0.90;
    if (tw > avail) {
      fs = Math.max(6, fs * avail / tw);
      ctx.font = '700 ' + fs.toFixed(1) + 'px system-ui,sans-serif';
    }
    ctx.beginPath(); ctx.arc(px, py, rad, 0, 7);
    ctx.fillStyle = i === 0 ? COL.cand1Bg : COL.candBg;
    ctx.fill();
    ctx.strokeStyle = i === 0 ? COL.cand1Bg : COL.candBd;
    ctx.lineWidth = Math.max(1, cell * 0.045);
    ctx.stroke();
    ctx.fillStyle = i === 0 ? '#fff' : '#8e2a24';
    ctx.fillText(txt, px, py + fs * 0.04);
    lastLabels.push({ x: r.x, y: r.y, w: r.w, h: r.h, txt: txt, halo: halo,
                      cx: px, cy: py,      // 圆心 = 落点（固定锚定）
                      px: px, py: py });
  }
}

/* 局面胜率也写在棋盘里（长条胜率已按需求删除，改用画布底部一行文字）。 */
function drawMoverWr() {
  let blk = S.root && typeof S.root.blkWr === 'number' ? S.root.blkWr : null;
  /* 终局胜率定格：禁手落子/黑长连 = 黑负 0%；恰五 = 胜方 1/0。 */
  if (S.forbidOver) blk = 0;
  else if (S.winline) blk = S.winOver ? 0
    : (stoneAt(S.winline[0][0], S.winline[0][1]) === BLACK ? 1 : 0);
  const fs = Math.max(9, cell * 0.46);
  ctx.font = '600 ' + fs + 'px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const y = gy(N - 1) + KB * cell * 0.82;
  const txt = blk === null ? '胜率 —'
    : '黑 ' + (blk * 100).toFixed(1) + '%   白 ' + ((1 - blk) * 100).toFixed(1) + '%';
  ctx.fillStyle = '#8a867e';
  ctx.fillText(txt, CW / 2, y);
}
function drawStone(x, y, c, R, no) {
  ctx.save();
  ctx.beginPath(); ctx.arc(gx(x), gy(y) + R * 0.04, R, 0, 7);
  ctx.fillStyle = 'rgba(0,0,0,.13)'; ctx.fill();
  const g = ctx.createRadialGradient(gx(x) - R * .35, gy(y) - R * .35, R * .1, gx(x), gy(y), R);
  if (c === BLACK) { g.addColorStop(0, '#4a4744'); g.addColorStop(1, '#111010'); }
  else { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e6e2da'); }
  ctx.beginPath(); ctx.arc(gx(x), gy(y), R, 0, 7); ctx.fillStyle = g; ctx.fill();
  if (c === WHITE) { ctx.strokeStyle = COL.whtEdge; ctx.lineWidth = 1; ctx.stroke(); }
  ctx.restore();
  drawMoveNo(x, y, c, R, no);
}

/* 棋子上的手数序号。
 * 摆谱复盘靠它一眼看出先后 —— 比只有一个「最后一手」红圈有用得多。
 * 字号按位数收缩：2 位数、3 位数（15×15 最多 225 手）都得塞进直径 2R 的圆里，
 * 不然会溢出到棋盘线上。R 太小（棋盘被压扁时）就整个不画：糊成一团比没有更糟。 */
function drawMoveNo(x, y, c, R, no) {
  if (!no || R < 6.5) return;
  const s = String(no);
  const fs = R * (s.length >= 3 ? 0.74 : s.length === 2 ? 0.94 : 1.14);
  const col = c === BLACK ? '#f6f3ed' : '#2b2825';   // 与棋子反差：黑子写浅、白子写深
  ctx.save();
  ctx.font = '700 ' + fs.toFixed(1) + 'px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = col;
  ctx.fillText(s, gx(x), gy(y) + fs * 0.03);
  ctx.restore();
  moveNoRun.push({ x: x, y: y, no: no, c: c, fs: fs, col: col });
}

/* ---------- 交互 ---------- */
function tapAt(ev) {
  const rect = cv.getBoundingClientRect();
  const t = ev.touches ? ev.changedTouches[0] : ev;
  const px = (t.clientX - rect.left), py = (t.clientY - rect.top);
  const x = Math.round((px - padL) / cell), y = Math.round((py - padT) / cell);
  if (x < 0 || x >= N || y < 0 || y >= N) return;
  if (Math.hypot(px - gx(x), py - gy(y)) > cell * 0.62) return;
  onTap(x, y, ev);
}
function onTap(x, y, ev) {
  /* 点棋子 = **无操作**（2026-10-10 老板指令「把双击清空和单点同一颗子清除，删了」：
   * 摆子**只加不删**）。原「点棋子删除」手势整个退役 —— 手指胖、盘面密，
   * 单点误删一颗识别的子就要重导整张图；删子统一走「后退」（撤最后一手）
   * 与「清空按钮」（全清）。双击清空更早（2026-10-03）已随同退役，
   * 清空从此只有清空按钮一条路。 */
  if (S.board[y * N + x]) return;
  /* 已分胜负（连五/长连）**仍可继续摆子**（2026-10-10 老板指令）：摆的子不参与
   * 计算 —— 引擎闸（pump/startSearch 等）见 S.winline 非空就不排新一轮，摆完
   * post() 重算 findWin，原五连/长连只加不删恒在 → 引擎一直停着，界面胜率
   * 定格在终局值。禁手红叉照画、连五横线照画（长连除外，见 winOver）。 */
  /* 处于「回看」状态时落子 = 从这里开新分支：先把游标之后的手截掉。
   * 这是所有棋谱编辑器的通行语义；不截的话，新子会长在一段已经不显示的手后面，
   * 序号和胜负判定都会变得莫名其妙。 */
  if (S.cursor < S.moves.length) S.moves.length = S.cursor;
  /* 摆子颜色（2026-10-03 老板指令：识别后默认黑白交替落子；2026-10-10：
   * 强改机制退役，摆色**不可选**）：
